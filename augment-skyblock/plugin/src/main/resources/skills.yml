  description: ["적을 쫓아가는 마력 화살을 쏜다."]
  cooldown: 2.5
  mechanics:
    - type: projectile
      speed: 1.4
      homing: 0.15
      particle: "DUST:#8f7bff:1.2"
      particle_count: 3
      effects: [{damage: 6, magic: true}]
    - {type: sound, sound: entity.illusioner.cast_spell, pitch: 1.6}

ground_slam:
  name: 대지 강타
  description: ["뛰어올라 땅을 내려찍고 주변 적을 띄운다."]
  cooldown: 8
  mechanics:
    - type: leap
      forward: 0.5
      upward: 0.8
      land:
        - type: nova
          radius: 4
          particle: "BLOCK:dirt"
          effects: [{damage: 8}, {launch: 0.6}]
        - {type: sound, sound: item.mace.smash_ground}

spear_lunge:
  name: 꿰뚫는 돌진
  description: ["창을 앞세워 돌진하고 맞은 적을 밀어낸다."]
  cooldown: 6
  mechanics:
    - type: dash
      distance: 6
      ticks: 4
      particle: CRIT
      effects: [{damage: 8}, {knockback: 1.0}]
    - {type: sound, sound: item.trident.throw}

spark_slash:
