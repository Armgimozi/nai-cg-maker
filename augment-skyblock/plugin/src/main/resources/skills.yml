  description: ["전기가 흐르는 칼날로 앞을 베어 느리게 만든다."]
  cooldown: 6
  mechanics:
    - type: cone
      range: 4
      angle: 90
      particle: ELECTRIC_SPARK
      effects: [{damage: 6}, {slow: 1.5}]
    - {type: sound, sound: entity.lightning_bolt.impact, pitch: 1.8, volume: 0.6}

thorn_burst:
  name: 가시 폭발
  description: ["주변에 가시를 터뜨려 피해를 주고 중독시킨다."]
  cooldown: 8
