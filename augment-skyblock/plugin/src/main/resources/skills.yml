# ─────────────────────────────────────────────────────────────
#  스킬 목록. 무기(weapons.yml)와 몬스터(mobs.yml)가 이 id 를 가져다 쓴다.
#
#  mechanics 에 쓸 수 있는 부품(type):
#    cone      전방 부채꼴 베기      range, angle, particle, effects
#    nova      원형 폭발/충격파      radius, at(self|aim|target), expand_ticks, particle, effects
#    projectile 투사체              speed, range, count, spread, homing, gravity, pierce, ground,
#                                   display(날아가는 아이템), spin, explode{radius, effects}, on_impact
#    beam      즉발 광선            length, width, through_walls, particle, core, effects, on_end
#    dash      돌진                 distance, ticks, effects(지나가며 맞힘), on_end
#    leap      도약 후 착지          forward, upward, land(착지 때 실행할 부품들)
#    blink     순간이동              distance, behind(대상 뒤로)
#    rain      하늘에서 떨어지는 공격 count, radius, interval, height, display, impact_radius, effects
#    strike    낙뢰/기둥            count, radius, targets, visual(lightning|pillar), impact_radius, effects
#    chain     연쇄                 jumps, range, first_range, effects
#    zone      장판                 radius, duration, interval, follow, effects, ally_effects
#    orbit     주위를 도는 칼날       count, radius, duration, speed, display, effects
#    vortex    끌어당기는 소용돌이    radius, duration, strength, effects, end(끝날 때 부품들)
#    self      나에게 효과           effects
#    target    지금 대상에게 효과     effects
#    party     주변 아군에게 효과     radius, effects
#    summon    소환                 entity(플레이어 스킬) / mob(몬스터 스킬), count, duration, health, damage
#    repeat / delay / sound / particle / say / skill / velocity
#
#  effects(맞은 대상에게): damage, percent, ignite, potion, slow, poison, wither, knockback, pull,
#    launch, freeze, stun, heal, heal_caster, lifesteal, absorption, cleanse, lightning, explosion,
#    particle, sound, execute, glow
#  짧게 쓰기: "- damage: 8" 은 "{type: damage, amount: 8}" 과 같다.
#  피해 수치는 무기의 skill_power 와 증강 '마력 증폭'이 곱해진다.
# ─────────────────────────────────────────────────────────────

# ═══════════════════════ 섬 초반 무기 ═══════════════════════

dash_slash:
  name: 돌진 베기
  description: ["앞으로 돌진하며 지나가는 적을 벤다."]
  cooldown: 6
  mechanics:
    - type: dash
      distance: 6
      particle: SWEEP_ATTACK
      effects: [{damage: 7}, {knockback: 0.6}]
    - {type: sound, sound: entity.player.attack.sweep, pitch: 1.2}

shadow_stab:
  name: 그림자 찌르기
  description: ["짧게 순간이동한 뒤 앞을 찌른다."]
  cooldown: 5
  mechanics:
    - {type: blink, distance: 5, particle: LARGE_SMOKE}
    - type: cone
      range: 2.8
      angle: 70
      particle: CRIT
      effects: [{damage: 8}]
    - {type: sound, sound: entity.player.attack.crit}

whirlwind:
  name: 회오리 베기
  description: ["제자리에서 세 번 돌며 주변을 벤다."]
  cooldown: 7
  mechanics:
    - type: repeat
      times: 3
      interval: 5
      mechanics:
        - type: nova
          radius: 3.2
          particle: SWEEP_ATTACK
          effects: [{damage: 4}, {knockback: 0.4}]
        - {type: sound, sound: entity.player.attack.sweep, pitch: 0.9}

magic_missile:
