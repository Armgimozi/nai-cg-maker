# ─────────────────────────────────────────────────────────────
#  새로운 몬스터. 바닐라 몬스터를 바탕(type)으로 능력치/장비/능력을 바꾼다.
#    abilities 의 trigger:
#      timer     대상이 range 안에 있으면 cooldown 초마다 chance 확률로
#      on_hit    이 몬스터가 때렸을 때      on_hurt  맞았을 때
#      hp_below  체력이 threshold 아래로 처음 내려갔을 때 (보스 2페이즈)
#      on_spawn / on_death
#    drops 의 item: shard, item:<id>, weapon:<id>, pool:<얻는 곳>(그 무기들 중 하나),
#               armor:<세트>(그 세트의 무작위 부위), 바닐라 아이템 이름
#    natural  자연 스폰된 replace 몬스터를 chance 확률로 이 몬스터로 바꾼다
#    보스(boss: true)의 보상은 함께 싸운 플레이어 모두가 각자 받는다.
# ─────────────────────────────────────────────────────────────

mobs:

  # ═════════════ 섬에 나타나는 몬스터 (자연 스폰 교체) ═════════════

  moss_zombie:
