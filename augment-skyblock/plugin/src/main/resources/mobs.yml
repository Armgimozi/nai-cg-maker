    radius: 9
    boss: inferno_colossus
  void:
    name: "<#c86bff>공허 균열"
    mobs: [void_wraith, void_eye, void_knight, void_knight, void_mite]
    max_alive: 7
    interval: 5
    radius: 9
    boss: void_sovereign
