# ─────────────────────────────────────────────────────────────
#  증강 목록. tier: SILVER(실버) / GOLD(골드) / PRISM(프리즘)
#    icon        선택 화면에 보일 아이템
#    max_stacks  같은 증강을 몇 번까지 겹쳐 받을 수 있는지 (기본 1)
#    weight      뽑힐 확률 가중치 (기본 10)
#    effects     효과 목록. 같은 종류는 서로 더해진다.
#
#  효과 종류
#    attribute {attribute, amount, operation: add | percent | multiply}
#        attribute 이름: max_health movement_speed attack_damage attack_speed armor armor_toughness
#        block_break_speed block_interaction_range entity_interaction_range fall_damage_multiplier
#        safe_fall_distance jump_strength step_height scale luck oxygen_bonus knockback_resistance ...
#    potion {effect, amplifier}               항상 걸려 있는 포션 효과
#    hit_potion {effect, every, seconds, amplifier}  공격 every 번마다 대상에게
#    lifesteal {amount}  thorns {amount}  dodge {every}  damage_reduction {amount}
#    crit {every, multiplier}  double_strike {every, ratio}  execute {threshold}
#    first_strike {amount}  berserk {threshold, amount}  boss_damage {amount}  damage_bonus {amount}
#    lightning {every, damage}  chain_lightning {every, targets, damage}  ignite {every, seconds}
#    regen {interval, amount}  kill_heal {amount}  kill_speed {seconds, amplifier}
#    soul_harvest {per_kill, max}  tank_engine {amount}  undying {cooldown, heal}  void_rescue {cooldown}
#    double_jump {power, cooldown}  glide  magnet {radius}
#    xp_boost {amount}  shard_luck {amount}  loot_boost {chance}  weapon_luck {chance}
#    skill_haste {amount}  skill_power {amount}
#    ore_gen {chance, tier}  auto_smelt  harvest_bonus {chance}  sapling_luck {chance}
#    growth_aura {radius, interval}  fishing_luck {chance}
#    extra_choice {amount}  reroll_bonus {amount}
#    grant_random {tier, count}  grant_item {item, amount}   (얻는 순간 한 번)
#    죽었을 때 지키기: keep_hotbar {slots}  keep_weapons  keep_armor  keep_materials  keep_levels  keep_all
#
#  전투 효과는 확률이 아니다 (hit_potion ignite lightning chain_lightning crit double_strike dodge)
#    every: N  → 맞힌 공격 N번째마다 터진다 (회피는 받는 공격 N번째마다). 1 이면 매번.
#    직접 휘두른 근접 공격과 화살 같은 투사체만 센다 (스킬·가시 피해는 세지 않는다). 효과마다 따로 세고, 접속을 끊으면 처음부터.
#    휩쓸기에 함께 맞은 몹은 세지 않고, 그 휘두름에서 주 대상에게 터진 효과를 똑같이 받는다.
#    chance: 0.2 처럼 적어도 되고, 그러면 1/chance 를 반올림한 N(0.2 → 5, 0.15 → 7)으로 바뀐다. 갑옷 세트 효과도 같다.
#    같은 효과를 여러 곳에서 얻으면 비율(1/N)을 더한 뒤 다시 N 으로 바꾼다. 예) 5번마다 + 4번마다 → 2번마다
#    (hit_potion 만은 항목마다 따로 센다: 증강 둔화와 갑옷 둔화는 각자 제 횟수에 터진다)
#  그 밖의 chance (광석 생성, 수확, 묘목, 낚시, 전리품, 무기 발견 등)는 지금처럼 확률이다.
#  tank_engine: 다른 플레이어를 처치할 때마다 최대 체력 +amount. 쌓인 값은 증강을 잃거나 죽어도 남고,
#    관리자 증강 초기화(/증강관리 증강 초기화)에서만 지워진다.
# ─────────────────────────────────────────────────────────────

