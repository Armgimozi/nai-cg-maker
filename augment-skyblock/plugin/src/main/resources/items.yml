# ─────────────────────────────────────────────────────────────
#  재료 아이템. 바닐라 아이템을 껍데기로 쓰고, 리소스팩 모델 augsky:<id> 로 모양을 바꾼다.
#  커스텀 아이템은 설치/연료/바닐라 조합 재료로 쓸 수 없다.
# ─────────────────────────────────────────────────────────────

shard:
  name: "<#c86bff>증강 파편"
  material: ECHO_SHARD
  lore:
    - "<gray>제단에 바치는 제물."
    - "<gray>몬스터를 잡거나 돌을 캘 때 얻는다."

prism_crystal:
  name: "<gradient:#ff6b9d:#ffd36b:#6bffb0:#6bc8ff:#c86bff>프리즘 결정</gradient>"
  material: HEART_OF_THE_SEA
  glint: true
  lore:
    - "<gray>프리즘 제단의 제물."
    - "<gray>균열의 보스에게서 얻거나"
    - "<gray>세 가지 정수를 모아 만든다."
  recipe:
    shape: ["ABC", "SDS", "CBA"]
    ingredients: {A: "item:essence_frost", B: "item:essence_flame", C: "item:essence_void", S: "item:shard", D: DIAMOND}

ticket_silver:
  name: "<#cfdbe6>실버 증강권"
  material: PAPER
  lore:
    - "<gray>실버 제단에서 제물 없이"
    - "<gray>증강을 하나 고를 수 있다."

