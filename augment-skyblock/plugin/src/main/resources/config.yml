# ─────────────────────────────────────────────────────────────
#  증강 스카이블럭 설정
#  고친 뒤 게임 안에서 /증강관리 리로드 (서버를 다시 켜도 됨)
#
#  같은 폴더의 다른 파일
#    augments.yml  증강 목록        weapons.yml  무기 목록
#    skills.yml    스킬 목록        mobs.yml     몬스터와 균열
#    items.yml     재료 아이템       players/     플레이어별 증강 저장
# ─────────────────────────────────────────────────────────────

altar:
  # 제단은 제물 없이 우클릭하면 증강 선택지가 열린다.
  # 한 번 쓰면 힘을 잃는다:
  #   global  서버 전체에서 한 번 (누가 쓰면 빛기둥이 꺼진다)
  #   player  한 사람당 한 번 (친구들은 각자 한 번씩 쓸 수 있다)
  #   off     몇 번이고 쓸 수 있다
  single-use: global
  # 보여 주는 증강 선택지 수 (증강 '증강 공명'으로 늘어남, 최대 5)
  choices: 3
  # 선택지마다 주는 무료 다시 뽑기 횟수
  rerolls: 1
  # 무료 횟수를 다 쓴 뒤 다시 뽑기에 드는 증강 파편 수 (0 이면 더 못 뽑음)
  reroll-shards: 3

bosses:
  # 보스가 쓰러진 뒤 둥지에서 다시 깨어나기까지 걸리는 시간(분)
  respawn-minutes: 30
  # 보스가 둥지 가운데서 이만큼 멀어지면 되돌아간다
  leash: 22
  # 둥지 결투장 반지름. 이 안의 블록은 부수거나 놓을 수 없다
  arena-radius: 17

drops:
  # 일반 적대 몬스터를 플레이어가 잡았을 때 증강 파편이 나올 확률
  shard-chance: 0.08
  # 돌, 조약돌, 광석, 네더랙을 캘 때 증강 파편이 나올 확률
  shard-mining-chance: 0.004

generator:
  # 증강이 없어도 조약돌 생성기에서 광석이 나올 확률 (기본 0 = 고전 스카이블럭)
  base-ore-chance: 0.0
  # '광맥의 기운' 증강 단계별로 나오는 광석과 가중치
  tiers:
    1: {COAL_ORE: 40, COPPER_ORE: 30, IRON_ORE: 25}
    2: {COAL_ORE: 30, COPPER_ORE: 20, IRON_ORE: 25, GOLD_ORE: 12, REDSTONE_ORE: 10, LAPIS_ORE: 8}
    3: {COAL_ORE: 20, COPPER_ORE: 12, IRON_ORE: 24, GOLD_ORE: 14, REDSTONE_ORE: 10, LAPIS_ORE: 8, DIAMOND_ORE: 7, EMERALD_ORE: 5}

mobs:
  # 자연 스폰 몬스터 일부를 새로운 몬스터로 바꾼다
  natural-replace: true
  # 균열 섬에서 몬스터가 계속 나온다
  rift-spawning: true

starter:
  # 처음 들어온 플레이어에게 주는 물건 (안내서는 따로 준다). "아이템*개수"
  items:
    - "weapon:apprentice_sword"
    - "item:shard*3"
    - "BREAD*4"

resource-pack:
  enabled: true
  # 비워 두면 플레이어가 접속한 주소의 port 번으로 팩을 직접 내보낸다.
  # 친구들이 터널(playit.gg 등)로 들어와서 팩을 못 받으면, pack.zip 을 인터넷에 올리고 그 주소를 적는다.
  url: ""
  port: 8163
  # 팩 주소에 쓸 호스트 이름을 고정하고 싶을 때 (예: 123.45.67.89 또는 mc.example.kr)
  public-host: ""
  # true 면 팩을 거절한 사람은 접속할 수 없다
  required: false
  # false 면 무기/아이템 모양을 바꾸지 않는다 (팩 없이 바닐라 모양으로)
  custom-models: true

guide-book:
  - "<b><dark_purple>증강 스카이블럭</dark_purple></b>\n\n하늘 위 작은 섬에서 시작합니다.\n\n맵 곳곳의 제단에서 <dark_purple>증강</dark_purple>을 모으고, 새 무기와 갑옷으로 둥지의 보스를 쓰러뜨리세요.\n\n<dark_gray>다음 장 ▶"
  - "<b>1. 섬에서 살아남기</b>\n\n상자에 용암과 얼음이 있어요. 얼음을 녹여 물을 만들고 용암 옆으로 흘려 <b>조약돌 생성기</b>를 만드세요.\n\n죽으면 아이템을 떨어뜨려요. 증강으로 지킬 수 있어요."
  - "<b>2. 제단과 증강</b>\n\n하늘로 솟은 빛기둥이 제단이에요.\n<gray>흰색</gray> 실버 16곳\n<gold>노란색</gold> 골드 9곳\n<dark_purple>무지개</dark_purple> 프리즘 5곳\n\n우클릭하면 증강 3개 중 하나를 고릅니다. 한 번 쓰면 힘을 잃어요."
  - "<b>3. 다시 뽑기와 증강권</b>\n\n선택지가 마음에 안 들면 한 번은 무료로, 그 뒤로는 <dark_purple>증강 파편</dark_purple> 3개로 다시 뽑아요.\n\n<b>증강권</b>은 손에 들고 우클릭하면 어디서든 증강을 고릅니다.\n\n/증강 제단"
  - "<b>4. 맵</b>\n\n가운데는 초원, 서쪽은 서리, 동북쪽은 화염, 북서쪽은 공허, 남쪽은 바다 지역이에요.\n\n지역마다 재료가 다르니 다리를 놓아 넓혀 가세요."
  - "<b>5. 무기</b>\n\n무기는 작업대에서 만들어요. 레시피 책을 보세요.\n\n섬 초반 무기는 대부분 스킬이 없어요. 강한 무기일수록 스킬이 붙고, 프리즘 무기는 <dark_purple>궁극기</dark_purple>도 있어요.\n\n/무기도감"
  - "<b>6. 스킬 쓰기</b>\n\n<dark_red>우클릭</dark_red> 스킬\n<dark_red>웅크리기+우클릭</dark_red> 두 번째\n<dark_red>웅크리기+좌클릭</dark_red> 궁극기\n\n<b>활</b>은 그냥 당기면 화살\n<dark_red>웅크리기+당겨 쏘기</dark_red> 스킬\n<dark_red>웅크리기+좌클릭</dark_red> 두 번째\n\nF키는 손 바꾸기예요."
  - "<b>7. 갑옷</b>\n\n같은 세트를 2개, 4개 입으면 세트 효과가 붙어요.\n\n균열 정수로 만드는 세트, 보스가 떨구는 세트, 프리즘 세트가 있어요.\n\n/갑옷도감"
  - "<b>8. 균열과 둥지</b>\n\n지역 끝에는 균열의 몬스터가 쏟아지는 섬과, 그 너머 보스의 <b>둥지</b>가 있어요.\n\n보스는 처음부터 둥지를 지키고, 쓰러지면 30분 뒤 다시 깨어나요."
  - "<b>9. 보스 보상</b>\n\n<dark_purple>프리즘 결정</dark_purple>, 증강권, 보스 무기와 갑옷. 함께 싸운 친구 모두가 각자 받아요.\n\n<b>명령어</b>\n/증강  /증강 도감\n/증강 선택  /증강 제단\n/무기도감  /갑옷도감  /스폰"
