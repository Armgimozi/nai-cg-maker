# ─────────────────────────────────────────────────────────────
#  무기 목록. 무기 한 종 = 항목 하나.
#    pool    얻는 곳: basic(섬 초반) island(섬 재료) frost/flame/void(균열) boss(보스) prism(프리즘)
#            몬스터 드롭 "pool:frost" 는 그 pool 의 무기 중 하나를 준다
#    source  설명에 보일 '얻는 곳' 문구 (안 적으면 pool 에 맞게 자동)
#    type    sword greatsword dagger katana axe hammer spear scythe staff wand
#    element 리소스팩 색상표 (iron stone wood bone copper flame frost storm venom ocean
#            earth wind holy nature blood abyss shadow star crystal prism gold ender sun doom)
#    damage  공격력(맨손 1 포함),  speed  초당 공격 횟수(바닐라 검 1.6)
#    reach   공격 거리 추가,  skill_power  스킬 피해 배율
#    skill   우클릭 스킬,  skill2  F키 스킬 (skills.yml 의 id)
#    passive 근접 공격 시 확률 효과
#    recipe  작업대 조합법 (item:아이템id, weapon:무기id, 바닐라 재료 이름)
#    droppable false 면 '무작위 무기' 드롭에 나오지 않는다
#  리소스팩 모델 이름은 augsky:<무기id> 이다.
# ─────────────────────────────────────────────────────────────

