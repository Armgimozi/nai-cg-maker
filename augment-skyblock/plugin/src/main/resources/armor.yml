  bonus:
    2: [{type: attribute, attribute: block_break_speed, amount: 0.25, operation: percent}]
    4: [{type: ore_gen, chance: 0.05, tier: 1}, {type: potion, effect: night_vision}, {type: attribute, attribute: max_health, amount: 2}]
  bonus_desc:
    2: "블록 캐는 속도 +25%"
    4: "조약돌 생성기에서 5% 확률로 광석, 야간 투시, 최대 체력 +2"
  aura: "DUST:#ffcf80:0.8"
  recipe: {M: IRON_INGOT, S: COPPER_BLOCK}

frost:
