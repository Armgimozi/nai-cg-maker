# ─────────────────────────────────────────────────────────────
#  갑옷 세트. 부위: helmet(투구) chestplate(갑옷) leggings(각반) boots(신발)
#    name      세트 이름          color   이름 색
#    source    얻는 곳 (설명에 표시)
#    pieces    부위별 [방어력, 방어 강도, 밀치기 저항]
#    bonus     같은 세트를 2개, 4개 입었을 때 효과 (augments.yml 의 effects 와 같은 형식, 서로 더해진다)
#    bonus_desc 세트 효과 설명
#    aura      4부위를 다 입으면 몸 주변에 도는 입자 (없으면 생략)
#    recipe    조합법. M 은 주재료, S 는 특수 재료로 바닐라 갑옷 모양에 S 가 한 칸 들어간다.
#              shape 를 직접 적으면 그 모양을 쓴다. "armor:세트1,세트2" 는 같은 부위의 그 세트 갑옷.
#              조합법이 없는 세트는 보스가 떨군다 (mobs.yml drops 의 "armor:<세트>").
# ─────────────────────────────────────────────────────────────

pioneer:
  name: 개척자
  color: "#d9a86a"
  source: "섬 재료로 만든다 (가죽, 참나무 원목)"
  pieces: {helmet: [2, 0, 0], chestplate: [4, 0, 0], leggings: [3, 0, 0], boots: [1, 0, 0]}
  bonus:
    2: [{type: attribute, attribute: movement_speed, amount: 0.06, operation: percent}]
    4: [{type: attribute, attribute: max_health, amount: 4}, {type: harvest_bonus, chance: 0.2}, {type: sapling_luck, chance: 0.3}]
  bonus_desc:
    2: "이동 속도 +6%"
    4: "최대 체력 +4, 수확물 20% 더, 묘목 30% 더"
  recipe: {M: LEATHER, S: OAK_LOG}

miner:
  name: 광부
  color: "#e8916a"
  source: "섬 재료로 만든다 (철 주괴, 구리 블록)"
