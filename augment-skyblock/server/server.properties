# 증강 스카이블럭 서버 설정 (마인크래프트 1.21.4 / Paper)
motd=\u00a7d\u00a7l\uc99d\uac15 \uc2a4\uce74\uc774\ube14\ub7ed \u00a77\uce5c\uad6c\ub4e4\uacfc \ud568\uaed8\ud558\ub294 \ud558\ub298\uc12c
level-name=world
# 맵이 들어 있는 world 폴더를 지우면, 아래 설정으로 빈 공허 월드가 새로 생긴다 (/증강관리 맵생성 으로 다시 지을 수 있음)
level-type=minecraft\:flat
generator-settings={"layers"\:[{"block"\:"minecraft\:air","height"\:1}],"biome"\:"minecraft\:plains","features"\:false,"lakes"\:false,"structure_overrides"\:[]}
generate-structures=false
# 네더로 가면 섬 재료와 거리가 의미 없어져서 막는다
allow-nether=false
# 정품 계정만 접속 (친구도 정품이어야 함)
online-mode=true
server-port=25565
max-players=10
difficulty=normal
gamemode=survival
# 협동 서버라 기본은 PvP 끔. 친구끼리 싸우고 싶으면 true
pvp=false
spawn-protection=0
view-distance=10
simulation-distance=8
# 스킬과 이단 점프가 몸을 띄우기 때문에 켜 둔다 (끄면 '비행' 으로 오해받아 튕길 수 있음)
allow-flight=true
enable-command-block=false
enforce-secure-profile=false
