# ─────────────────────────────────────────────────────────────
#  스퀘어 소울 설정
#  고친 뒤 게임 안에서 /souls reload (서버를 다시 켜도 됨)
#
#  같은 폴더의 다른 파일
#    content/        콘텐츠 (skills.yml, items.yml, weapons.yml, origins.yml …). id 와 수치만 있고 보이는 글은 없다
#  게임 안 문구 (한국어 원본과 영어) 는 jar 와 리소스팩 안에 있어 여기 꺼내지 않는다.
#  고치려면 소스의 plugin/src/main/resources/lang/ko.yml, en.yml 을 고치고 python3 tools/make_dist.py
# ─────────────────────────────────────────────────────────────

controls:
  # 구르기 키 (2.1, 3.3): sneak (웅크리기 키를 짧게 눌렀다 떼면 구른다. 누르고 있으면 웅크리기·강공격·다음 표적의 조합 키) |
  # f (예전 판: F 가 구르기, 웅크리기 키를 누른 채 F 는 무기 기술) | both (둘 다 구른다).
  # 바닐라 설정에서 웅크리기를 "전환" 으로 쓰는 사람은 짧게 눌렀다 떼는 입력이 서버에 오지 않으므로 f 나 both 를 쓴다
  roll-key: sneak
  roll-tap:
    # 누름에서 뗌까지 이 틱 (1틱 = 0.05초) 안이면 짧게 누른 것 (다크 소울은 약 0.3초)
    max-ticks: 5
    # 핑이 이 ms 를 넘으면 max-ticks 에 lag-extra-ticks 를 더한다 (흔들리는 지연이 짧은 누름을 길게 읽지 않게)
    lag-ping: 100
    lag-extra-ticks: 1
    # 공격·마시기의 회복 중에 뗀 짧은 누름은 이 틱 동안 기억했다가 되는 첫 틱에 구른다 (공중에서 뗀 것은 기억하지 않는다)
    buffer: 6

start:
  # 세계 설정 (난이도와 PvP, 5.7) 을 누가 고르나: first (세계를 처음 연 사람) | op (관리자만)
  setup-by: first
  # 창을 닫은 사람에게 창을 다시 띄우는 가장 짧은 틈 (틱)
  reopen-cooldown: 40
  # 출신을 고르기 전에는 시작 자리에서 이 칸 수 안에서만 걷는다 (0 이면 막지 않는다). 관리자가 출신을 지웠거나 다시 고르는 사람은
  # 그 자리가 가운데다. 가운데에서 멀어지지 않는 걸음은 늘 된다
  unborn-radius: 8
  # 출신 창을 닫은 사람이 걷는 동안 "고르려면 · 웅크리기 키 짧게" 를 다시 알리는 틈 (틱, 1200 = 1분. 0 이면 닫을 때만)
  hint-every: 1200
  # 리소스팩을 다 싣고 이 틱 뒤에 창을 띄운다. 팩을 싣지 않은 사람 (선택 팩을 거절했거나 팩이 꺼짐) 은 접속하고 no-pack-wait 틱 뒤
  pack-wait: 20
  no-pack-wait: 200
  # 시험 모드 (debug.test-mode) 에서만 듣는다. 실제 서버에서는 비워 둔다.
  #   auto: "normal,off" 처럼 주면 세계 설정을 묻지 않고 그 값으로 확정한다 (봇 묶음이 창에 막히지 않게)
  #   auto-origin: 이름이 auto-names 의 앞머리 (쉼표로 여럿) 로 시작하는 사람의 출신을 묻지 않고 이것으로 고른다 (접속할 때).
  #                봇 시험은 Souls (봇 이름), 실제 클라이언트 점검 (devserver) 은 Souls,Tester
  auto: ""
  auto-origin: ""
  auto-names: "Souls"

difficulty:
  # 난이도는 플러그인의 배율이다 (5.7). 바닐라 난이도 (/difficulty) 는 늘 normal 이고 다르면 플러그인이 되돌린다 (3.9).
  # 어느 난이도인지는 이 파일이 아니라 세계에 적힌다 (처음 들어온 사람이 고르고, 관리자는 /souls settings 로 바꾼다).
  # 세계 설정이 없을 때·창을 닫았을 때 쓰는 난이도
  default: normal
  # 난이도마다의 배율. 구르기 (무적·비용)·스태미나·피격 대기열은 어느 난이도에서나 같다
  #   enemy-damage        적·보스가 주는 피해 배율 (3.7 의 원피해)                                         지금 듣는다
  #   enemy-health        적 체력 배율 (souls 세계의 적에 최대 HP 수정자 souls:difficulty. 생길 때, 바꿀 때 모두) 지금 듣는다
  #   enemy-poise         적 강인도·보스 자세 최대치 배율                                              강인도가 생기는 M1·M2 부터
  #   parry-window-bonus  쳐내기 창에 더하는 틱 (PvP 의 쳐내기에는 더하지 않는다)                       쳐내기가 생기는 M1 부터
  #   estus-start         처음 에스트 횟수 (최대 횟수 = 이것 + 오다의 병 조각, 다음 휴식부터)              에스트가 생기는 M1 부터
  #   souls               적을 쓰러뜨려 얻는 소울 배율 (소울 아이템은 곱하지 않는다)                       적이 소울을 주는 M2 부터
  #   attack-tokens       한 사람을 동시에 노리는 적 (공정함 규칙 6.3: 둘을 넘지 않는다)                   적 두뇌가 생기는 M2 부터
  # 세계를 정한다 창의 단추 설명 칸에는 지금 듣는 둘 (적 피해·적 HP) 만 보인다
  levels:
    easy:      {enemy-damage: 0.70, enemy-health: 0.80, enemy-poise: 0.80, parry-window-bonus: 2,  estus-start: 5, souls: 1.0, attack-tokens: 1}
    normal:    {enemy-damage: 1.00, enemy-health: 1.00, enemy-poise: 1.00, parry-window-bonus: 0,  estus-start: 4, souls: 1.0, attack-tokens: 2}
    hard:      {enemy-damage: 1.25, enemy-health: 1.20, enemy-poise: 1.15, parry-window-bonus: 0,  estus-start: 4, souls: 1.0, attack-tokens: 2}
    very_hard: {enemy-damage: 1.50, enemy-health: 1.40, enemy-poise: 1.30, parry-window-bonus: -1, estus-start: 3, souls: 1.0, attack-tokens: 2}

pve:
  # 적을 칠 때 (M1 의 공격 동작 전의 다리, 3.7): souls 근접 무기로 플레이어가 아닌 것을 치면 바닐라 피해 대신
  # 공격력 × (0.2 + 0.8 × 공격 대기²) × bridge-scale (직검 71 → 6.4, 대검 118 → 10.6, 단도 51 → 4.6. 근력·양손 잡기가 듣는다)
  bridge-scale: 0.09
  # 분류마다 약공격 한 주기 (틱, 3.6 의 준비 + 판정 + 회복). 든 무기의 바닐라 공격 속도 = 20 / 주기 (공격 대기가 이만큼에 다 찬다),
  # 민첩의 공격 속도 몫이 그것을 곱한다 (souls:lvl_dex). 없는 분류 (활·방패·촉매) 는 맨손 4.0
  swing-ticks: {dagger: 10, straight_sword: 13, curved_sword: 12, greatsword: 22, ultra_greatsword: 30, axe: 18, hammer: 18, spear: 13, halberd: 20}

pvp:
  # 세계 설정이 없을 때의 PvP (켜고 끄는 것은 처음 들어온 사람이 고르고, 관리자는 /souls settings pvp on|off)
  default: false
  # 플레이어 → 플레이어 피해 배율 (난이도 배율은 곱하지 않는다)
  damage-scale: 1.0
  # 접속·부활·명령 순간이동 뒤 이 틱 동안 다른 사람에게 맞지 않는다
  respawn-grace: 100
  death:
    # PvP 로 죽으면 소울을 잃지 않고 혈흔을 남기지 않으며 적도 되살아나지 않는다 (친구끼리 겨룰 때. 혈흔은 M2 부터)
    keep-souls: true

stats:
  # 능력치 여섯 (5.2): 체력 vig · 정신 mnd · 기력 end · 근력 str · 민첩 dex · 지능 int. 레벨 = 합 − 59.
  # 표는 "능력치 값: 효과 값" 이고 사이는 직선으로 잇는다. 표 밖은 끝값 (무른 상한: 40 까지 많이, 40~60 은 절반쯤, 60 넘어 조금)
  max: 99
  # 공격력 보정 등급 계수 (3.7): AR = 기본 × (1 + 등급 × 곡선(근력)). 술 세기도 같은 등급·곡선 (지능)
  grades: {E: 0.25, D: 0.5, C: 0.8, B: 1.1, A: 1.4, S: 1.7}
  # 공격 속도 등급 계수 (무기의 민첩 보정, 3.6): 속도 배율 = 1 + 민첩 속도(민첩) × 계수
  speed-grades: {E: 0.4, D: 0.6, C: 0.8, B: 1.0, A: 1.2, S: 1.4}
  # 근력·지능의 보정 곡선 (10·20·30·40·60 에서 꺾인다. 10~40 이 가장 가파르다: 한 점에 약 +2%, 검토 slow-stats-feel-dead)
  scaling-curve: {1: 0.0, 10: 0.13, 20: 0.35, 30: 0.52, 40: 0.68, 60: 0.80, 99: 1.0}
  # 방어력 = defense-base + defense-per-level × 레벨 + 체력 방어, 마법 저항 = 같은 바탕 + 정신 저항. 받는 피해 = 원피해² / (원피해 + 방어)
  defense-base: 20
  defense-per-level: 0.4
  # 필요 근력·지능이 모자라면 공격력·술 세기 −40%, 필요 민첩이 모자라면 공격 속도 ×0.85
  unfit-penalty: 0.4
  unfit-speed: 0.15
  vigor:
    # 최대 HP. 플레이어 체력은 큰 숫자다 (하트는 늘 10개, 바닐라 계산은 20 기준. server/spigot.yml 의 maxHealth 상한 2048 아래)
    max-health: {1: 310, 10: 400, 20: 670, 30: 905, 40: 1105, 60: 1305, 99: 1500}
    # 방어력 몫 (물리)
    defense: {1: 10, 10: 16, 20: 26, 30: 33, 40: 38, 60: 42, 99: 46}
  mind:
    # 최대 마나 (술은 M5. 그 전에는 마나 막대 길이만)
    max-mana: {1: 42, 10: 60, 20: 95, 30: 125, 40: 145, 60: 170, 99: 200}
    # 마법 저항 몫 (불·술)
    magic-defense: {1: 6, 10: 12, 20: 26, 30: 36, 40: 44, 60: 52, 99: 58}
    # 기억 칸 (계단: 이 값 이상이면 그 칸 수)
    memory-slots: {8: 1, 13: 2, 18: 3, 24: 4, 30: 5}
  endurance:
    # 스태미나 회복 배율 (최대 스태미나는 combat.stamina.curve)
    regen-scale: {1: 0.91, 10: 1.0, 20: 1.15, 30: 1.24, 40: 1.30, 60: 1.36, 99: 1.40}
  strength:
    # 장비 무게 한도 (5.8). 한도가 늘면 같은 장비의 무게 단계가 내려간다
    equip-load: {1: 30, 10: 40, 20: 54, 30: 66, 40: 76, 60: 88, 99: 100}
  dexterity:
    # 이동 속도 덧셈 몫 (0.05 = +5%. 10 밑은 0)
    move-speed: {10: 0.0, 20: 0.05, 30: 0.08, 40: 0.10, 60: 0.12, 99: 0.13}
    # 공격 속도 몫 (민첩 보정 B 기준. 무기 등급 계수를 곱한다). 든 무기의 바닐라 공격 속도 (pve.swing-ticks) 에 곱해 공격 대기가 빨리 찬다
    attack-speed: {10: 0.0, 20: 0.10, 30: 0.17, 40: 0.22, 60: 0.26, 99: 0.30}
  intelligence:
    # 상태 이상 저항: 해로운 효과 (구속·독·불붙음 …) 의 길이를 × (1 − 저항) 으로 (확률이 아니다. 10틱 밑이면 걸리지 않는다)
    status-resist: {10: 0.0, 20: 0.10, 30: 0.18, 40: 0.24, 60: 0.30, 99: 0.35}

level:
  # 다음 레벨 비용 (5.3): 레벨 L 이 flat-until 이하면 flat-base + flat-per-level × L,
  # 그 위는 round(scale × (a x³ + b x² + c x + d)), x = L + 1 (다크 소울 1 의 식 × 0.6)
  cost: {flat-until: 11, flat-base: 300, flat-per-level: 20, cubic: [0.02, 3.06, 105.6, -895], scale: 0.6}

load:
  # 장비 무게 단계 (5.8): 비율 = 무게 / 한도. 단축 슬롯 아홉 칸과 왼손의 souls 무기·방패·촉매 + 입은 방어구가 무게다 (가방은 들지 않는다)
  tiers: {light: 0.30, medium: 0.70, heavy: 1.00}
  #  roll: 구르기 종류 (combat.roll.kinds), regen: 스태미나 회복 배율, walk: 걷기·달리기 배율, sprint: 달릴 수 있나
  light:  {roll: light,    regen: 1.00, walk: 1.00, sprint: true}
  medium: {roll: medium,   regen: 0.95, walk: 1.00, sprint: true}
  heavy:  {roll: heavy,    regen: 0.85, walk: 0.92, sprint: true}
  over:   {roll: backstep, regen: 0.60, walk: 0.70, sprint: false}

levelup:
  # 레벨 올리기 창의 "올린다" 소리 (5.9)
  sound: "block.beacon.power_select"
  sound-volume: 0.5
  sound-pitch: 0.6

combat:
  stamina:
    # 능력치가 없는 사람 (월드 밖, 프로필을 읽기 전) 의 기력. 보통은 프로필의 기력을 쓴다 (5.2)
    endurance: 10
    # 기력 → 최대 스태미나 (사이는 직선으로 잇는다, 5.2)
    curve: {1: 82, 10: 100, 20: 130, 30: 150, 40: 165, 60: 180, 99: 200}
    # 스태미나를 쓴 행동이 끝나고 regen-delay 틱 뒤부터 틱마다 regen-per-tick × 기력 배율 (stats.endurance.regen-scale)
    # × 무게 배율 (load.*.regen) 씩 찬다
    regen-per-tick: 2.2
    regen-delay: 12
    # 0 이 되면(탈진) 회복이 늦게 시작되고, exhausted-sprint-until 까지 찰 때까지 달리지 못한다
    exhausted-delay: 24
    exhausted-sprint-until: 25
    # 막는 동안 회복 배율
    guard-regen-scale: 0.35
    # 달리는 동안 틱마다 쓰는 양 (달리는 동안은 회복 없음)
    sprint-per-tick: 0.6
  roll:
    # 구르기 종류: auto (장비 무게 단계를 따른다, 5.8) | light | medium | heavy (봇 시험이 무게와 상관없이 고정할 때).
    # 방향키가 없으면 늘 backstep, 너무 무거우면 방향키가 있어도 backstep
    load: auto
    # 구르기가 3인칭과 남에게 어떻게 보이는가 (3.3 "보이는 모습"). 움직임·무적·비용은 셋 다 같다
    #   tumble  진짜 몸을 잠깐 감추고 (투명, 든 것·입은 것도) 관절이 있는 사람 꼴의 대역 (부위마다 표시 물체) 이 무기를 쥔 채 어깨로
    #           비스듬히 구르고 일어선다. 대역 머리는 그 사람 스킨 (남에게는 player_head, 그 사람 화면에는 스킨 픽셀 머리), 옷은 그 사람
    #           스킨·갑옷 색으로 물든 팩 모형 souls:roll_*.
    #           1인칭에서는 팩의 아이템 셰이더가 그 사람 화면의 대역을 카메라 곁에서 버린다 (각과 상관없이 1인칭은 보이지 않고 F5 는
    #           늘 보인다). 뒷걸음은 진짜 몸 그대로 뒤로 뛴다
    #   spin    바닐라 급류 회전 (몸이 누운 채 머리 쪽으로 송곳처럼 돈다. 흰 소용돌이는 팩이 감춘다). 대비책
    #   crawl   대역 없이 머리 위 막힘으로 기어가기 자세 (몸이 눕고 바닥을 미끄러진다. 사용자가 "바닥을 휩쓰는 느낌" 이라 한 예전 모습). 비교용
    visual: tumble
    # 구르는 동안 그 사람 화면에만 머리 위 막힘 (라임 색유리: 팩이 보이지 않게 하고, 3인칭 카메라는 지나간다) 을 두어 클라이언트를
    # 기어가기 자세로 만든다: 1인칭 시야가 바닥 가까이 내려갔다 올라온다 (tumble 은 tumble.duck 틱 동안, crawl 은 미는 동안).
    # 끄면 시야는 서 있는 높이 그대로다 (봇 시험은 끈다: mineflayer 는 기어가기를 못 한다)
    crawl: true
    tumble:
      # 대역의 움직임 (부위마다의 열쇠 자세) 은 팩 생성기 (pack/roll_figure.py) 가
      # 플러그인 자원 roll_anim.yml 로 쓴다. 여기는 때만 정한다.
      # 이 틱 뒤에 닿는 자세부터 rise-turn 틱에 걸쳐 구르는 쪽에서 몸 방향으로 돈다 (옆으로 구른 뒤 진짜 몸이 돌아올 때 90° 튀지 않게)
      rise-at: 8
      rise-turn: 3
      # 대역을 띄우고 몇 틱 뒤에 진짜 몸을 감추고 대역을 보이게 하는가 (둘은 같은 틱에 바뀐다: 투명 깃발과 대역의 보기 거리는
      # 클라이언트가 받자마자 그린다). 1 (기본) 이면 F 를 받은 다음다음 틱: 클라이언트가 새 대역을 적어도 한 틱 다룬 뒤라 바뀌는
      # 그림에 빈 바닥도 겹침도 없다. 0 이면 한 틱 빠르지만 대역이 처음 그려지기 전에 깃발이 닿아 0~1틱 빈 바닥이 생길 수 있다
      hide-delay: 1
      # 이 틱에 대역을 거두고 진짜 몸을 보인다 (다음 구르기가 먼저 오면 대역을 그대로 이어 쓴다)
      reveal: 11
      # 이 틱에 그 사람 화면에만 두 손을 돌려준다 (1인칭 무기가 구르기 공격 창 9~16 이 열릴 때 올라와 있게: 감춘 동안 1인칭 손을
      # 내려 둔 채라 돌려주면 곧바로 올라온다, 2~3틱). 0 이면 reveal 때
      hand-back: 6
      # crawl: true 일 때 기어가기 막힘을 두는 틱 수 (0 이면 깔지 않는다). 카메라 눈 높이는 틱마다 남은 몫의 반씩 옮겨 가므로 5 면
      # 눈이 2~5틱에 1.0 → 0.5 로 내려갔다가 6~9틱에 1.05 → 1.55 로 올라와 대역 머리 (2틱 1.0, 3~5틱 0.3~0.6, 6~9틱 1.1~1.6) 와 함께
      # 움직인다 (실제 클라이언트에서 1인칭 89° 바닥 그림의 텍셀 간격으로 잰 눈 높이: 3.3 "1인칭"). 더 길면 진짜 몸이 돌아올 때
      # (reveal) 바닐라 헤엄 자세 값이 남아 3인칭에서 팔을 벌리고 기운 몸이 보인다. 팩의 1인칭 반지름 표가 이 값으로 셈해져 있다
      # (pack/roll_figure.py, gen_pack 이 이 파일에서 읽는다): 바꾸면 팩을 다시 만든다 (아니면 대역이 표시 알파 반지름으로 돌아간다)
      duck: 5
      # 숙인 눈 (발 위 0.4) 에서 F5 등 뒤 카메라가 이 거리 (블록) 안에서 벽·바닥에 막히면 숙이지 않는다 (올려다보며 구를 때, 등 뒤에
      # 턱·벽이 있을 때. 1인칭 시야가 서 있는 높이 그대로다). 숙인 동안 막히게 되면 (올려다보면) 일찍 일어선다. 0 이면 보지 않는다
      duck-camera: 3.0
    # spin 의 회전 틱
    spin-ticks: 8
    # iframes: 무적 틱 (1틱째부터), horizontal: glide 틱 동안 매 틱 미는 속도, glide: 미는 틱 수 (끝 두 틱은 줄여 멈춘다)
    # next: 다음 구르기를 받는 틱, end: 구르기가 끝나는 틱 (회복 지연은 여기서부터 센다)
    kinds:
      light:    {iframes: 8, horizontal: 0.42, vertical: 0.0,  glide: 7, next: 10, end: 12, cost: 18}
      medium:   {iframes: 7, horizontal: 0.38, vertical: 0.0,  glide: 7, next: 12, end: 14, cost: 20}
      heavy:    {iframes: 5, horizontal: 0.30, vertical: 0.0,  glide: 7, next: 16, end: 18, cost: 24}
      backstep: {iframes: 4, horizontal: 0.40, vertical: 0.08, glide: 4, next: 8, end: 10, cost: 12}
    # 구를 때 옷 스치는 소리 (땅을 구르는 소리와 일어설 때 쿵 소리는 밟은 블록 소리로 따로 난다)
    sound: "item.armor.equip_leather"
    sound-volume: 0.6
    sound-pitch: 0.7

world:
  # 게임 세계 폴더 이름. 로비는 server.properties 의 level-name (world)
  name: souls_world
  seed: 7707
  # 시험 방 가운데 (지역 상자 밖, 세계 경계 안)
  test-room: {x: 200, y: 100, z: -200}
  # 멈춰 둔 시각 (해가 막 진 잿빛 저녁)
  time: 13000
  border: {x: 0, z: 20, size: 640}
  # 접속하면 생존 모드를 모험 모드로 바꾼다 (창작·관전 모드는 그대로)
  force-adventure: true

hud:
  # 다크 소울 HUD (10.2): 왼쪽 위에 체력·마나·스태미나 막대 셋 (HUD 전용 보스 막대), 오른쪽 아래에 소울 수 상자 (행동 막대).
  # 바닐라 하트·허기·방어·경험치 막대는 리소스팩이 숨긴다.
  # 오른쪽 아래 소울 수 상자 (소울은 M2 부터 쌓인다. 그 전에는 0)
  show-souls: true
  # 소울 상자 (행동 막대) 를 다시 보내는 주기 (틱). 바뀌면 곧바로 보낸다 (바닐라는 3초 뒤 흐려지므로 40 보다 짧게)
  actionbar-refresh: 20
  bars:
    # 막대 길이 (GUI 픽셀) = 최대치 × 배율, min-px..max-px. 다크 소울처럼 최대치가 늘면 막대가 길어진다 (10.2).
    # 최대 HP 1 당 (체력 10 → 400 → 68 픽셀, 40 → 1105 → 188, 그 위는 190 에서 멈춘다)
    health-px: 0.17
    # 마나 1 당 (정신 10 → 60 → 48 픽셀, 99 → 200 → 160)
    warmth-px: 0.8
    # 스태미나 1 당 (기력 10 → 100 → 65 픽셀, 99 → 200 → 130. HP 막대가 늘 가장 길다)
    stamina-px: 0.65
    min-px: 24
    # 가장 작은 화면 (GUI 폭 320) 에서도 둘째 보스 막대와 겹치지 않게 190 아래로
    max-px: 190
    # 술 (마나) 이 아직 없을 때 (M5 전) 마나 막대를 가득 찬 채 보인다: 길이는 정신의 최대 마나, 능력치가 없으면 이 값.
    # 0 이면 술이 생길 때까지 숨긴다
    warmth-placeholder: 60
    # 막대는 바뀐 틱에 보낸다. 바뀌지 않아도 이 틱마다 한 번 다시 보낸다
    refresh: 100

death:
  # "YOU DIED" 는 한 번만 보인다 (5.6). 자리는 셋 가운데 하나다 (title 이 먼저):
  #   title: false, screen-fade: true   사망 화면 문구 줄로 보내 다크 소울처럼 서서히 나타난다 (검은 띠가 먼저 약 0.5초, 글자가 그
  #                                     속에서 약 1.7초까지, 그동안 어둠에 가렸던 단추가 약 2초에 드러난다). 글자·띠는 사망 화면 제목
  #                                     판과 같은 그림·크기·자리이고 덧칠 위에 또렷하다. 팩을 싣지 않은 사람에게는 보내지 않는다
  #                                     (그 사람은 바닐라 사망 화면 제목 하나를 본다)
  #   title: false, screen-fade: false  리소스팩이 바꾼 사망 화면 제목 (같은 모습, 늘 한꺼번에 보인다)
  #   title: true                       플러그인이 화면 제목으로 두 배 크게 띄운다 (단추 위, 일어설 때까지). 화면 제목은 사망 화면
  #                                     덧칠 밑에 그려져 조금 어둡고, 그림 한 칸이 GUI 2픽셀이라 단추·HUD 와 픽셀 크기가 섞인다 (16절 질문 4)
  # 팩은 이 값을 따라 만든다: python3 pack/gen_pack.py (또는 tools/make_dist.py) 가 이 파일의 death.title·screen-fade 를 읽어
  # screen 판이 아니면 팩의 사망 화면 제목을 비운다 (둘을 함께 쓰면 겹친다). 바꾼 뒤에는 팩과 jar 를 다시 만든다
  title: false
  # 서서히 나타나는 판 (5.6, 10.8): 바닐라 사망 화면은 제목을 한꺼번에 그리고 화면마다 시계가 없어, 플러그인이 죽은 게임 시각을
  # 문구 줄의 글자색에 싣고 글꼴 셰이더가 클라이언트의 게임 시각과 견주어 나타나게 한다 (게임 규칙 show_death_messages 와
  # 상관없이 보낸다. 채팅 알림은 없다). 문구 줄은 죽는 순간에만 오므로, 죽은 채 나갔다 들어오면 (사망 화면이 문구 없이 다시
  # 열린다) 바로 일으켜 세운다 (화톳불에서 깨어난다)
  screen-fade: true
  # 화면 제목에 쓸 그림 글자 이름 (glyphs.yml). you_died_title 은 souls:hud 글꼴의 한 줄로, 사망 화면 판의 두 배 크기다
  # (그림 한 칸 = GUI 2픽셀). 빈칸으로 여러 개를 이어 쓴다. 하나라도 없으면 lang 의 death.title 을 아래 색 글씨로
  title-glyphs: "you_died_title"
  # 그림 글자가 없을 때의 글자색 (생피 가장 밝은 색, 10.1)
  fallback-color: "#cc2418"
  # 화면 제목을 쓸 때 일어설 때까지 남긴다 (일어서면 지운다)
  fade-in: 20
  stay: 6000
  fade-out: 10

pack:
  enabled: true
  # 팩 주소 틀. {sha1} 은 jar 안 pack.zip 의 SHA-1 로 채운다 (dist/packs/<sha1>.zip 을 올려 두면 된다)
  url: "https://raw.githubusercontent.com/Armgimozi/nai-cg-maker/claude/gallant-noether-j4j8t5/soulslike/dist/packs/{sha1}.zip"
  required: true
  # join: 접속하고 join-delay 틱 뒤에 보낸다 (검증됨)
  # configure: 세계가 보이기 전 설정 단계에서 보내고 답을 configure-timeout 초까지 기다린다 (실제 클라이언트로 확인했다.
  #            봇(mineflayer)은 이 단계에서 답하지 않아 기다리는 시간을 다 쓰므로 기본은 join)
  send-at: join
  join-delay: 20
  configure-timeout: 10
  # 켤 때 주소에서 팩을 받아 SHA-1 을 견준다. 다르거나 못 받으면 크게 알리고 팩을 선택으로 보낸다
  self-check: true
  # 0 보다 크면 jar 안 pack.zip 을 이 포트에서 직접 내보낸다 (로컬 시험용).
  # 이때 url 도 "http://127.0.0.1:<포트>/{sha1}.zip" 처럼 바꾼다. 터널(playit)은 25565 만 통하므로 실제 서버에서는 0
  serve-port: 0

debug:
  # 시험 명령어 /soulstest 와 시험 줄([T] ...)을 켠다. 봇 시험 서버에서만 켠다
  test-mode: false
  # 시험 줄을 서버 기록에도 남긴다
  log-test-lines: true
