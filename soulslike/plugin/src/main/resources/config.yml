# ─────────────────────────────────────────────────────────────
#  스퀘어 소울 설정
#  고친 뒤 게임 안에서 /souls reload (서버를 다시 켜도 됨)
#
#  같은 폴더의 다른 파일
#    content/        콘텐츠 (M0: skills.yml). id 와 수치만 있고 보이는 글은 없다
#  게임 안 문구 (한국어 원본과 영어) 는 jar 와 리소스팩 안에 있어 여기 꺼내지 않는다.
#  고치려면 소스의 plugin/src/main/resources/lang/ko.yml, en.yml 을 고치고 python3 tools/make_dist.py
# ─────────────────────────────────────────────────────────────

difficulty:
  # 난이도는 아직 정하지 않았다. 수치는 설계 문서 값 그대로 두고 여기서 바꾼다 (M1 도장부터 쓴다).
  # 적이 주는 피해 배율
  enemy-damage: 1.0
  # 쳐내기 창에 더하는 틱 (너그럽게: 2)
  parry-window-bonus: 0
  # 처음 에스트 횟수
  estus-start: 4

combat:
  stamina:
    # 지구력. 출신과 레벨이 생기기 전(M2)까지는 모두 이 값으로 최대 스태미나를 정한다
    endurance: 10
    # 지구력 → 최대 스태미나 (사이는 직선으로 잇는다)
    curve: {10: 100, 20: 130, 30: 150, 40: 165, 50: 175, 99: 200}
    # 스태미나를 쓴 행동이 끝나고 regen-delay 틱 뒤부터 틱마다 regen-per-tick 씩 찬다
    regen-per-tick: 2.2
    regen-delay: 12
    # 0 이 되면(탈진) 회복이 늦게 시작되고, exhausted-sprint-until 까지 찰 때까지 달리지 못한다
    exhausted-delay: 24
    exhausted-sprint-until: 25
    # 막는 동안 회복 배율
    guard-regen-scale: 0.35
    # 달리는 동안 틱마다 쓰는 양 (달리는 동안은 회복 없음)
    sprint-per-tick: 0.6
  roll:
    # 장비 하중이 생기기 전(M1)까지 쓰는 구르기 무게: light / medium / heavy (방향키가 없으면 backstep)
    load: light
    # 구르기가 3인칭과 남에게 어떻게 보이는가 (3.3 "보이는 모습"). 움직임·무적·비용은 셋 다 같다
    #   tumble  진짜 몸을 잠깐 감추고 (투명, 든 것·입은 것도) 플레이어 비례의 대역이 뛰어들어 웅크려 앞으로 한 바퀴 구르고 일어선다.
    #           대역 머리는 그 사람 스킨 (player_head), 옷은 그 사람 스킨·갑옷 색으로 물든 팩 모형 souls:roll_*. 뒷걸음은 진짜 몸 그대로 뒤로 뛴다
    #   spin    바닐라 급류 회전 (몸이 누운 채 머리 쪽으로 송곳처럼 돈다. 흰 소용돌이는 팩이 감춘다). 대비책
    #   crawl   머리 위 방벽으로 기어가기 자세 (몸이 눕고 바닥을 미끄러진다. 사용자가 "바닥을 휩쓰는 느낌" 이라 한 예전 모습). 비교용
    visual: tumble
    # visual: crawl 일 때 머리 위에 자기 화면에만 보이는 막힘(방벽)을 두어 클라이언트를 기어가기 자세로 만든다
    # (1인칭 시야가 바닥 가까이 떨어지고, 3인칭은 몸이 눕는다). 끄면 방벽 없이 미끄러진다 (봇 시험은 끈다: 기어가기를 못 한다).
    # tumble 에는 깔지 않는다: 3인칭 카메라가 방벽 밑으로 짓눌려 대역을 놓친다
    crawl: true
    tumble:
      # 회전 중심의 발 위 높이 (블록) 와 대역 크기. 크기 0.9375 는 바닐라가 플레이어를 그리는 크기 (대역 픽셀이 진짜 몸과 같다).
      # 웅크린 공이 도는 동안 회전 중심에서 땅까지 평균 6.8 픽셀이라 6.8 × 0.9375 / 16 = 0.40 (pack/roll_figure.py PIVOT_PX)
      pivot: 0.40
      scale: 0.9375
      # 처음 각 (도): 뛰어들기 자세 (souls:roll_dive) 가 이 각에서 바로 서 보이게 만들어졌다 (pack/roll_figure.py START_ANGLE 과 같게)
      start-angle: 45
      # 도는 마디 [구르기 틱, 앞으로 돈 각 (도), 그 각까지 가는 틱]. 첫 마디에서 웅크린 공 (souls:roll_tuck) 으로 바뀐다.
      # 각은 미는 거리를 따라간다 (1~5틱 0.42 칸, 6·7틱 0.27·0.15 칸): 한 틱에 74° 남짓 돌다가 끝에 늦춘다. 보간은 가까운 쪽으로
      # 돌므로 한 마디는 180° 보다 작게. 클라이언트는 표시 물체를 첫 틱에야 그리므로 첫 마디는 2틱부터
      steps: [[2, 124, 1], [3, 198, 1], [4, 272, 1], [5, 319, 1], [6, 345, 1], [7, 360, 1]]
      # 이 틱에 일어서기 자세 (souls:roll_tuck → roll_rise) 로 바꾸고, rise-turn 틱 동안 구르는 쪽에서 몸 방향으로 돈다
      # (옆으로 구른 뒤 진짜 몸이 돌아올 때 90° 튀지 않게)
      rise-at: 8
      rise-turn: 3
      # 회전축을 어깨 쪽으로 기울이는 각 (도). 구를 때마다 좌우를 바꾼다. 머리가 한쪽 어깨 너머로, 발이 다른 쪽으로 돌아
      # 등 뒤 (F5) 에서도 앞으로 도는 것이 읽힌다. 0 이면 곧은 앞구르기
      tilt: 20
      # 대역을 띄우고 몇 틱 뒤에 진짜 몸을 감추는가. 클라이언트는 새 표시 물체를 받은 뒤 첫 틱에야 그리지만 투명 깃발은 받자마자
      # 반영한다. 0 이면 둘이 같은 틱에 나가 몸이 먼저 사라지고 대역이 0~1틱 늦게 나타난다 (빈 화면이 깜빡인다).
      # 1 이면 대역이 먼저 그려지고 0~1틱 뒤 몸이 사라진다 (잠깐 겹친다)
      hide-delay: 1
      # 이 틱에 대역을 거두고 진짜 몸을 보인다 (다음 구르기가 먼저 오면 대역을 그대로 이어 쓴다)
      reveal: 11
      # 이 틱에 그 사람 화면에만 주손을 돌려준다 (1인칭 무기가 구르기 공격 창 9~16 전에 다시 올라오게). 0 이면 reveal 때
      hand-back: 8
    # spin 의 회전 틱
    spin-ticks: 8
    # iframes: 무적 틱 (1틱째부터), horizontal: glide 틱 동안 매 틱 미는 속도, glide: 미는 틱 수 (끝 두 틱은 줄여 멈춘다)
    # next: 다음 구르기를 받는 틱, end: 구르기가 끝나는 틱 (회복 지연은 여기서부터 센다)
    kinds:
      light:    {iframes: 8, horizontal: 0.42, vertical: 0.0,  glide: 7, next: 10, end: 12, cost: 18}
      medium:   {iframes: 7, horizontal: 0.38, vertical: 0.0,  glide: 7, next: 12, end: 14, cost: 20}
      heavy:    {iframes: 5, horizontal: 0.30, vertical: 0.0,  glide: 7, next: 16, end: 18, cost: 24}
      backstep: {iframes: 4, horizontal: 0.40, vertical: 0.08, glide: 4, next: 8, end: 10, cost: 12}
    # 구를 때 옷 스치는 소리 (땅을 구르는 소리와 일어설 때 쿵 소리는 밟은 블록 소리로 따로 난다)
    sound: "item.armor.equip_leather"
    sound-volume: 0.6
    sound-pitch: 0.7

world:
  # 게임 세계 폴더 이름. 로비는 server.properties 의 level-name (world)
  name: souls_world
  seed: 7707
  # 시험 방 가운데 (지역 상자 밖, 세계 경계 안)
  test-room: {x: 200, y: 100, z: -200}
  # 멈춰 둔 시각 (해가 막 진 잿빛 저녁)
  time: 13000
  border: {x: 0, z: 20, size: 640}
  # 접속하면 생존 모드를 모험 모드로 바꾼다 (창작·관전 모드는 그대로)
  force-adventure: true

hud:
  # 행동 막대의 "소울 N" 줄 (소울은 M2 부터 쌓인다. 그 전에는 0)
  show-souls: true
  # 행동 막대를 다시 보내는 주기 (틱). 바뀌면 곧바로 보낸다
  actionbar-refresh: 20

death:
  # "YOU DIED" 는 한 번만 보인다 (5.6). 기본(false)은 리소스팩이 바꾼 사망 화면 제목 하나다 (가로 가운데, 늘 또렷한 생피색).
  # true 면 플러그인이 화면 제목으로 두 배 크게 띄운다 (단추 위, 일어설 때까지). 화면 제목은 사망 화면 덧칠 밑에 그려져
  # 조금 어둡고, 그림 한 칸이 GUI 2픽셀이라 단추·HUD 와 픽셀 크기가 섞인다 (16절 질문 4).
  # 팩은 이 값을 따라 만든다: python3 pack/gen_pack.py (또는 tools/make_dist.py) 가 이 파일의 death.title 을 읽어
  # true 면 팩의 사망 화면 제목을 비운다 (둘을 함께 쓰면 겹친다). 바꾼 뒤에는 팩과 jar 를 다시 만든다
  title: false
  # 화면 제목에 쓸 그림 글자 이름 (glyphs.yml). you_died_title 은 souls:hud 글꼴의 한 줄로, 사망 화면 판의 두 배 크기다
  # (그림 한 칸 = GUI 2픽셀). 빈칸으로 여러 개를 이어 쓴다. 하나라도 없으면 lang 의 death.title 을 아래 색 글씨로
  title-glyphs: "you_died_title"
  # 그림 글자가 없을 때의 글자색 (생피 가장 밝은 색, 10.1)
  fallback-color: "#cc2418"
  # 화면 제목을 쓸 때 일어설 때까지 남긴다 (일어서면 지운다)
  fade-in: 20
  stay: 6000
  fade-out: 10

pack:
  enabled: true
  # 팩 주소 틀. {sha1} 은 jar 안 pack.zip 의 SHA-1 로 채운다 (dist/packs/<sha1>.zip 을 올려 두면 된다)
  url: "https://raw.githubusercontent.com/Armgimozi/nai-cg-maker/claude/gallant-noether-j4j8t5/soulslike/dist/packs/{sha1}.zip"
  required: true
  # join: 접속하고 join-delay 틱 뒤에 보낸다 (검증됨)
  # configure: 세계가 보이기 전 설정 단계에서 보내고 답을 configure-timeout 초까지 기다린다 (실제 클라이언트로 확인했다.
  #            봇(mineflayer)은 이 단계에서 답하지 않아 기다리는 시간을 다 쓰므로 기본은 join)
  send-at: join
  join-delay: 20
  configure-timeout: 10
  # 켤 때 주소에서 팩을 받아 SHA-1 을 견준다. 다르거나 못 받으면 크게 알리고 팩을 선택으로 보낸다
  self-check: true
  # 0 보다 크면 jar 안 pack.zip 을 이 포트에서 직접 내보낸다 (로컬 시험용).
  # 이때 url 도 "http://127.0.0.1:<포트>/{sha1}.zip" 처럼 바꾼다. 터널(playit)은 25565 만 통하므로 실제 서버에서는 0
  serve-port: 0

debug:
  # 시험 명령어 /soulstest 와 시험 줄([T] ...)을 켠다. 봇 시험 서버에서만 켠다
  test-mode: false
  # 시험 줄을 서버 기록에도 남긴다
  log-test-lines: true
