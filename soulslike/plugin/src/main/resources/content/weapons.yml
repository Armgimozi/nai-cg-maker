# ─────────────────────────────────────────────────────────────
#  무기·방패·활·촉매 (맛보기판 20개, DESIGN 9.1, 9.2, 3.12.4, 9.8, 12.5). 모형과 쥐는 법은 pack/weapons/SPEC.md.
#  이름과 설명은 여기 쓰지 않는다: lang/ko.yml·en.yml 의 weapon.<id>.name (한 줄), weapon.<id>.lore (목록),
#  설명 칸 둘째 줄은 weapon.class.<class>, 수치 줄은 weapon.stat.* (플러그인이 아래 값으로 채운다).
#  /soulstest give <id|all> 이 아이템으로 만들어 준다 (시험 모드). 전투 동작 (약공격·강공격·왼손 공격) 은 M1 에 붙인다.
#
#  장비에는 능력치 보정도 요구 능력치도 없다 (DECISIONS 2026-10-10). 설명 칸의 수치는 한 줄: 제 값 하나와 무게.
#  근력은 모든 무기의 공격력을, 민첩은 모든 무기의 공격 속도를, 지력은 모든 촉매의 술법 세기를 똑같이 올린다 (config.yml stats.*).
#
#  보이는 값 (설명 칸)
#  attack    기본 물리 공격력 (+0, 3.7: 분류 값, 보스 무기는 ×1.25). 무기·활·패링 단검. 공격력 = attack × (1 + 근력 몫).
#            같은 분류의 무거운 것은 가벼운 것보다 +6~10% (보정 등급이 없으니 무게만 무겁고 같은 값이면 늘 손해다, 9.1)
#  guard     막기 (방패만): 막는 동안 (우클릭을 누르고 있는 동안) 막는 물리 피해 % (0..100). 불·술은 그 × combat.guard.non-physical,
#            막다가 맞으면 쓰는 스태미나도 이 값에서 셈한다 (combat.guard, 3.4)
#  spell     술법 세기 (촉매만, 3.12.4). 술법 세기 = spell × (1 + 지력 몫)
#  weight    무게 (5.8)
#
#  보이지 않는 값 (수치가 아니다)
#  class     분류 (lang weapon.class.<class>). 모형의 1인칭 자세, 패링 창 (combat.parry.windows: 다크 소울처럼 설명 칸에 없다),
#            양손 막기 (combat.guard.two-handed) 도 이 분류를 따른다. 방패는 small_shield (작은) | medium_shield (중형) | greatshield (대형)
#  hand      main (주손) | off (왼손에 드는 방패·패링 단검·촉매: 우클릭은 왼손에 든 것을 쓴다, DECISIONS 2026-10-10)
#  use       guard (막기 성분, 막는 모형 <id>_guard: 왼손이 비었을 때 주무기로 막는다) | block (방패 막기, <id>_block)
#            | bow (당기기, 사용 시간에 따라 당긴 모형) | none (촉매: 술법은 M5, 패링 단검: 우클릭은 왼손 공격 (M1), 막지 않는다)
#  walk      막는 동안 (또는 당기는 동안) 걸음 배율 (2.3.9)
# ─────────────────────────────────────────────────────────────

