# ─────────────────────────────────────────────────────────────
#  적 (DESIGN 6.1, 6.2, M1 의 시험 적). id 마다 몸 (바닐라 몹 종류, 보이지 않게 하는 것은 M2), 가상 체력, 방어력, 강인도, 두뇌,
#  흡수·약점, 동작.
#  M1 P1-0 은 빈 틀만 둔다. P1b 가 허수아비 (dummy), P2b 가 시험 말뚝 (post), P5a 가 이름 없는 시험 적 셋을 더한다.
#  이야기가 정해지기 전이라 id 는 일반 이름이고 보이는 이름은 없다 ([시험용] 표시는 lang 열쇠로만).
#
#  이 파일은 열쇠마다 jar 사본 위에 겹쳐 읽는다 (Content.merged): 여기서 지운 열쇠는 jar 의 기본값으로 읽고, 새 판의 플러그인이
#  열쇠를 더해도 여기서 맞춘 값은 그대로 남는다. 콘텐츠 판 (CONTENT_VERSION) 이 올라도 옛 폴더로 옮기지 않는다.
#  보이는 글은 쓰지 않는다 (12.5). 고친 뒤 /souls reload.
#  모든 적에 같은 값 (보는 거리, 따라오는 거리 …) 은 config.yml enemies.* (P5a). 도장의 자리·파도는 config.yml dojo.* (P1b, P5b).
#
#  P1-0 의 틀 (enemy/Foes) 이 읽는 열쇠: <id>.body (몹 종류, 기본 zombie), <id>.hp (가상 체력, 기본 100), <id>.def (방어력, 기본 20).
# ─────────────────────────────────────────────────────────────
