# ─────────────────────────────────────────────────────────────
#  반지 (DESIGN 9.4). 인벤토리 2×2 자리의 왼쪽 세로 두 칸에 끼는 아이템이다 (2026-10-08 사용자 결정 B 안, item/RingSlots).
#  이름과 설명은 여기 쓰지 않는다: lang/ko.yml·en.yml 의 ring.<id>.name (한 줄), ring.<id>.lore (목록). 효과 줄은 플러그인이
#  ring.effect.<효과> 에 값을 채워 설명 칸 맨 위에 붙인다.
#
#  model    팩의 아이템 모형 souls:<model> (pack/icons.py 의 RING_ART). 없으면 souls:<id>
#  test     true 면 시험 반지: /soulstest ring give <id> 로만 얻는다 (세계 어디에도 놓지 않는다)
#  effects  끼고 있는 동안의 효과. 반지 둘의 효과는 합친다 (배율은 곱하고 나머지는 더한다). 같은 반지 둘은 끼지 않는다.
#           모르는 효과는 서버 기록에 경고하고 버린다.
#    stamina-regen  스태미나 회복 배율 (1.20 = +20%, 0 보다 크고 10 이하). 지금 듣는다 (스태미나 회복, 능력치 창의 회복 값)
#    poise          강인도 덧셈 비율 (0.40 = +40%). 고리만 있다: 강인도 (3.8) 가 생기면 RingSlots.poiseBonus 를 부른다
#    parry-window   패링 창 덧셈 틱 (2 = +2틱 = 0.1초). 패링 (3.5) 이 F 를 누를 때 RingSlots.parryWindowBonus 로 창에 더한다.
#                   패링 판정 (적의 공격을 쳐내는 것) 은 M1 이라 아직 "듣지 않는다"
#    soul-guard     true 면 죽어도 소울을 한 번 잃지 않고 반지가 부서진다. 고리만 있다: 소울 잃기 (5.5, M2) 가
#                   RingSlots.consumeSoulGuard 를 부른다
#  고리만 있는 효과는 설명 칸에 "아직 이 효과를 받는 체계가 없다" 가 붙는다.
#  weight   무게 (없으면 0). 낀 반지만 장비 무게 (5.8) 에 들고, 0 보다 클 때만 설명 칸에 무게 줄이 붙는다. 반지 설명 칸에는 효과 줄과
#           설명만 있고 다른 수치는 없다 (장비에는 보정·요구 능력치가 없다, DECISIONS 2026-10-10)
#
#  이야기를 사용자가 정하기 전이라 (DECISIONS 2026-10-08) 이름 있는 반지는 넣지 않는다. 아래 셋은 시험용이고 이야기의 반지가
#  들어오면 지운다 (DESIGN 9.4 "시험 반지").
# ─────────────────────────────────────────────────────────────

test_stamina:
  model: ring_test_stamina
  test: true
  effects:
    stamina-regen: 1.20

test_poise:
  model: ring_test_poise
  test: true
  effects:
    poise: 0.40

test_parry:
  model: ring_test_parry
  test: true
  effects:
    parry-window: 2
