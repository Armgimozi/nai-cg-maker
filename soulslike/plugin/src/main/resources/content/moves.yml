# ─────────────────────────────────────────────────────────────
#  플레이어의 공격 동작 (DESIGN 3.6 의 무기 분류표, M1). 무기 분류 (weapons.yml class) 마다 약공격 1·2·3단, 강공격, 달리기 공격,
#  구르기 공격의 준비/판정/회복 틱, 판정 모양 (부채꼴·직선, 각도, 사거리), 스태미나, 강인도 피해.
#  M1 P1-0 은 빈 틀만 둔다. 값은 P1a (동작 실행기, combat/Moveset) 가 채우고, 사용자가 도장에서 직접 해 보고 맞춘다.
#
#  이 파일은 열쇠마다 jar 사본 위에 겹쳐 읽는다 (Content.merged): 여기서 지운 열쇠는 jar 의 기본값으로 읽고, 새 판의 플러그인이
#  열쇠를 더해도 여기서 맞춘 값은 그대로 남는다. 콘텐츠 판 (CONTENT_VERSION) 이 올라도 옛 폴더로 옮기지 않는다.
#  보이는 글은 쓰지 않는다 (12.5). 고친 뒤 /souls reload.
#  동작 배율 (약 1단 100 …), 입력 기억, 공격 중 느려짐은 config.yml combat.moves·combat.input (값 하나는 한 곳에만, R21).
