# 게임 안 문구, 한국어 원본 (10.3, 10.9, 12.5). 영어는 lang/en.yml 에 따로 쓴다. 두 파일의 열쇠는 똑같아야 한다.
# 짧고 건조하게. 느낌표, 설명문체("~할 수 있습니다"), 과장된 수식어를 쓰지 않는다 (tools/textlint.py 가 거른다).
#
# 꼴
#   열쇠: "<꼴>글 <자리>"
#   - 맨 앞의 MiniMessage 태그 하나 (또는 이어 붙인 몇 개) 가 그 열쇠의 꼴이다: <#rrggbb> (10.1 팔레트에서만), <gray> 같은
#     이름 색, <bold>, <!italic>. 꼴은 열쇠마다 하나뿐이다. 글 가운데에서 색을 바꾸지 않는다 (섞어야 하면 열쇠를 나눈다).
#     en.yml 의 같은 열쇠도 같은 꼴이어야 한다.
#   - <souls> 같은 자리는 플러그인이 채운다. 두 언어의 자리 이름이 같아야 한다 (차례는 달라도 된다).
#   - 목록은 아이템 설명처럼 여러 줄이고, 줄마다 열쇠 <열쇠>.1, .2 ... 가 된다. 두 언어의 줄 수가 같아야 한다.
#   - % 는 그대로 쓴다 (팩으로 옮길 때 %% 로 바뀐다).
# 가는 곳
#   pack/gen_pack.py 가 이 파일과 en.yml 을 리소스팩 언어 파일로 옮긴다: assets/souls/lang/ko_kr.json, en_us.json
#   (열쇠 앞에 souls. 를 붙이고, 꼴 태그를 떼고, 자리는 %1$s 꼴로). 다른 언어로 들어온 사람은 en_us 를 본다.
#   플러그인은 Component.translatable("souls.<열쇠>") 에 꼴을 입혀 보내고, 글은 클라이언트가 팩에서 고른다.
#   pack.prompt·pack.declined·pack.failed·build.refuse 는 팩을 싣기 전에 보이는 글이라 서버가 접속한 사람의 언어로 채운다.
#   vanilla 밑의 열쇠는 바닐라 열쇠를 덮어쓴다 (assets/minecraft/lang). 이름 색만 쓸 수 있다 (§ 코드로 바뀐다).
# 고친 뒤에는 팩과 jar 를 다시 만든다 (python3 tools/make_dist.py). 서버 폴더에는 꺼내 두지 않는다.

death:
  # 사망 화면 위 큰 제목. 그림 글자(glyphs.yml)가 없을 때만 이 글이 붉은 글씨로 나온다 (두 언어 모두 YOU DIED, 사용자 결정 3)
  title: "YOU DIED"

bonfire:
  lit: "<#9e7c44>화톳불을 밝혔다"
  enemies-back: "<#858079>적들이 되살아났다"
  refuse: "<#858079>적이 가까이 있다"
  # 이동은 처음부터 된다 (사용자 결정 4). 밝힌 화톳불이 여기뿐일 때 이동 창에 쓰는 글
  no-warp: "<#8f8164>아직 건널 불이 없다"
  # 휴식 창 (10.4). 단추는 양피지색 (바닐라 흰 글씨는 창에서 가장 밝아 제목보다 튄다). 단추 폭 160
  rest: "<#d1c3a0>쉰다"
  warp: "<#d1c3a0>불을 건넌다"
  leave: "<#d1c3a0>일어선다"
  status: "<#b3a37f>소울 <souls> · 레벨 <level>"
  # M0 의 시험 창(/soulstest dialog)에만 쓰는 이름. M2 에서 화톳불마다의 이름 (bonfire.<id>.name) 으로 바꾼다.
  # 화톳불 이름은 두 언어 모두 장소 이름만 쓴다 ("탑옥 아래", "Beneath the Gaol Tower". 창이 화톳불 창이라 "화톳불" 을 붙이지
  # 않는다. 창 제목 폭 300 에 "볼크 탑옥 ..." 같은 긴 이름이 들어가야 한다)
  test-name: "<#d1c3a0><font:souls:title>탑옥 아래"

boss:
  # 큰 글씨. 아랫줄에 보스 이름
  felled: "<#9e7c44>쓰러뜨렸다"
  hrolf:
    # 보스 막대의 이름 (화면 아래 가운데, 막대 왼쪽 끝 위, 제목 글꼴). 색은 HUD 글꼴 셰이더가 정한다
    name: "<#d1c3a0><font:souls:title>수문장 흐롤프"

souls:
  recovered: "<#b3a37f>소울을 되찾았다"

door:
  one-way: "<#858079>이쪽에서는 열 수 없다"
  locked: "<#858079>잠겨 있다"
  opened: "<#858079>문이 열렸다"
  sealed: "<#858079>봉인되어 있다"

bell:
  rung: "<#b3a37f>종소리가 멀리 퍼졌다"

taster:
  # 맛보기판 끝 (종을 울린 뒤, 큰 글씨)
  end: "<#b3a37f>길은 아직 닫혀 있다"

spell:
  # 술 (M5). 익혔을 때는 아랫줄에 술 이름
  learned: "<#b3a37f>술을 익혔다"
  # 기억 창 안 글
  no-slot: "<#8f8164>기억할 자리가 없다"
  # 든 촉매로 쓸 술이 없을 때 (부제목)
  none: "<#858079>기억한 술이 없다"

item:
  # 요구 능력치 미달 (아이템 설명). 설명 칸 바탕이 어두워 핏빛 글씨는 읽히지 않으므로 앞의 짧은 표시만 핏빛으로 한다.
  # 꼴이 둘이라 열쇠를 나눴다: 플러그인이 unfit-mark, 빈칸, unfit 을 이어 붙인다
  unfit-mark: "<#a8301f>×"
  unfit: "<#8f8164>제대로 다룰 수 없다"

weapon:
  # 무기·방패·촉매 (9.1, 9.2, 3.12.4, 9.7). 열쇠는 weapon.<id>.name (한 줄), weapon.<id>.lore (목록). id 와 모형 명세는
  # pack/weapons/SPEC.md. 이름은 바랜 양피지에 제목 글꼴 (<font:souls:title>, 로마 비문 대문자·무거운 명조), 분류 줄은 흐린 옛 금빛
  # (그을린 청동), 설명은 탁한 양피지 (9.7). 수치 표는 플러그인이 따로 붙인다
  class:
    # 설명 칸 둘째 줄 "분류 · 공격 종류" (9.7, 3.6 의 무기 분류표)
    straight_sword: "<#9e7c44>직검 · 베기/찌르기"
    dagger: "<#9e7c44>단검 · 베기/찌르기"
    greatsword: "<#9e7c44>대검 · 베기"
    axe: "<#9e7c44>도끼 · 베기"
    hammer: "<#9e7c44>망치 · 때리기"
    spear: "<#9e7c44>창 · 찌르기"
    halberd: "<#9e7c44>미늘창 · 베기/찌르기"
    bow: "<#9e7c44>활"
    small_shield: "<#9e7c44>작은 방패"
    shield: "<#9e7c44>방패"
    greatshield: "<#9e7c44>대방패"
    parrying_dagger: "<#9e7c44>쳐내기 단검"
    catalyst_kiln: "<#9e7c44>촉매 · 가마 술"
    catalyst_bell: "<#9e7c44>촉매 · 종 술"
  stat:
    # 설명 칸의 수치 표 (9.7, 다크 소울 3 처럼 두 열): 이름은 여기, 값은 플러그인 (item/StatTable) 이 content/weapons.yml
    # 에서 채워 값 열 끝에 오른쪽 맞춤으로 붙인다. 팩 (pack/typeset.py) 이 이름 뒤를 빈칸 글자로 채워 그 언어의 이름 열을
    # 맞춘다. 그래서 이름 사이 폭이 언어마다 달라도 값이 한 줄에 선다
    attack: "<#858079>공격력"
    weight: "<#858079>무게"
    bonus_str: "<#858079>근력 보정"
    bonus_dex: "<#858079>기량 보정"
    bonus_att: "<#858079>기억 보정"
    need_str: "<#858079>필요 근력"
    need_dex: "<#858079>필요 기량"
    need_att: "<#858079>필요 기억"
    absorb: "<#858079>물리 흡수"
    stability: "<#858079>안정성"
  # 수치 표와 설명 사이의 실선 (9.7). 글이 아니라 팩이 이 열쇠의 값을 실선 글자로 바꾼다 (pack/typeset.py: 그 언어의 무기 설명 칸
  # 글 열 폭만큼, 이름 밑 금실과 같은 색·굵기). 여기 글은 팩이 없을 때만 보이는 대체 글
  rule: "<#8f8164>—"
  redin_guard_sword:
    name: "<#d1c3a0><font:souls:title>레딘 경비대 직검"
    lore:
      - "<#8f8164>레딘 경비대가 차던 곧은 칼."
      - "<#8f8164>성벽 위의 병사들은 모두 안쪽을 보고 섰다."
      - "<#8f8164>칼끝이 어디를 향했는지는 적혀 있지 않다."
  volk_longsword:
    name: "<#d1c3a0><font:souls:title>볼크 가의 장검"
    lore:
      - "<#8f8164>볼크 가의 기사가 차던 긴 칼."
      - "<#8f8164>탑옥을 맡은 가문은 죄수보다 먼저 망자가 되었다."
      - "<#8f8164>자루 끝의 문장은 누군가 긁어 지웠다."
  alley_dagger:
    name: "<#d1c3a0><font:souls:title>레딘 뒷골목 단도"
    lore:
      - "<#8f8164>레딘 뒷골목에서 흔히 쓰던 짧은 칼."
      - "<#8f8164>성벽이 닫힌 뒤로 골목은 더 좁아졌다."
      - "<#8f8164>칼은 등 뒤에서 가장 잘 들었다."
  gaoler_greatsword:
    name: "<#d1c3a0><font:souls:title>탑옥 간수의 대검"
    lore:
      - "<#8f8164>탑옥 간수들이 들던 무거운 대검."
      - "<#8f8164>베기보다 때려눕히는 데 더 많이 썼다."
      - "<#8f8164>끝이 뭉툭하게 갈린 것은 그 때문이다."
  levy_hatchet:
    name: "<#d1c3a0><font:souls:title>레딘 징집병 손도끼"
    lore:
      - "<#8f8164>레딘이 징집병에게 나눠 준 손도끼."
      - "<#8f8164>장작 패던 연장에 쇠를 조금 더 댄 것이다."
      - "<#8f8164>받은 자들은 끝내 성벽 밖을 보지 못했다."
  sellsword_axe:
    name: "<#d1c3a0><font:souls:title>볼크 가 고용병 도끼"
    lore:
      - "<#8f8164>볼크 가가 삯을 주고 부린 자들의 도끼."
      - "<#8f8164>삯은 탑옥의 금고에서 나왔다."
      - "<#8f8164>금고가 빈 뒤에도 몇은 떠나지 않았다."
  gaoler_club:
    name: "<#d1c3a0><font:souls:title>볼크 간수의 곤봉"
    lore:
      - "<#8f8164>볼크 가의 간수가 허리에 걸고 다니던 곤봉."
      - "<#8f8164>쇠테를 두른 참나무다."
      - "<#8f8164>죽이지 않고 눕히는 데 썼다."
  penitent_mace:
    name: "<#d1c3a0><font:souls:title>오스윈 고행승의 철퇴"
    lore:
      - "<#8f8164>오스윈 교구의 고행승이 들던 철퇴."
      - "<#8f8164>그들은 남을 치기 전에 제 등부터 쳤다."
      - "<#8f8164>물이 찬 뒤로는 무엇을 뉘우쳤는지 잊었다."
  mathes_bell_mace:
    name: "<#d1c3a0><font:souls:title>마테스의 종 철퇴"
    lore:
      - "<#8f8164>안셀이 마테스의 소울을 쇠에 부어 만든 철퇴."
      - "<#8f8164>머리는 작은 종이다. 속을 납으로 채웠다."
      - "<#8f8164>마테스는 끝내 종을 놓지 않았다."
  redin_spear:
    name: "<#d1c3a0><font:souls:title>레딘 창병의 창"
    lore:
      - "<#8f8164>레딘 창병들이 방패 벽 뒤에서 내밀던 창."
      - "<#8f8164>창끝은 늘 도시 쪽을 향했다."
      - "<#8f8164>자루에 묶은 천은 본래 레딘의 붉은 천이었다."
  hrolf_halberd:
    name: "<#d1c3a0><font:souls:title>흐롤프의 미늘창"
    lore:
      - "<#8f8164>레딘의 마지막 수문장이 들던 미늘창."
      - "<#8f8164>성문은 밖이 아니라 안을 향해 닫혀 있었다."
      - "<#8f8164>흐롤프는 끝내 그 까닭을 묻지 않았다."
  warden_halberd:
    name: "<#d1c3a0><font:souls:title>교구 수호병의 미늘창"
    lore:
      - "<#8f8164>교구를 지키던 거구의 수호병들이 들던 미늘창."
      - "<#8f8164>오스윈이 종을 울려 부른 근위대의 남은 자들이라 한다."
      - "<#8f8164>그들은 아직 부름이 끝나지 않았다고 믿는다."
  wall_shortbow:
    name: "<#d1c3a0><font:souls:title>레딘 성벽 단궁"
    lore:
      - "<#8f8164>레딘 성벽의 궁수들이 쓰던 짧은 활."
      - "<#8f8164>성벽 아래까지만 닿으면 되었다."
      - "<#8f8164>화살은 대개 안쪽으로 날아갔다."
  plank_shield:
    name: "<#d1c3a0><font:souls:title>탑옥 판자 방패"
    lore:
      - "<#8f8164>탑옥 감방 문짝을 뜯어 만든 방패."
      - "<#8f8164>안쪽 면에는 손톱 자국이 남아 있다."
      - "<#8f8164>누가 긁었는지는 아무도 묻지 않는다."
  pilgrim_buckler:
    name: "<#d1c3a0><font:souls:title>오스윈 순례자의 버클러"
    lore:
      - "<#8f8164>오스윈을 찾아가던 순례자의 작은 방패."
      - "<#8f8164>가운데 징에 종 모양이 찍혀 있다."
      - "<#8f8164>길은 물에 잠겼고, 아무도 돌아가지 않았다."
  parrying_dagger:
    name: "<#d1c3a0><font:souls:title>레딘 결투 단검"
    lore:
      - "<#8f8164>레딘의 결투꾼들이 왼손에 쥐던 단검."
      - "<#8f8164>찌르기보다 칼을 받아 넘기는 데 썼다."
      - "<#8f8164>성벽이 닫힌 뒤로 결투는 끼니보다 잦았다."
  redin_guard_shield:
    name: "<#d1c3a0><font:souls:title>레딘 경비대 방패"
    lore:
      - "<#8f8164>레딘 경비대의 쇠테 두른 방패."
      - "<#8f8164>앞면의 성문 문장은 거의 벗겨졌다."
      - "<#8f8164>문장 속의 문은 닫혀 있다."
  volk_greatshield:
    name: "<#d1c3a0><font:souls:title>볼크 가의 대방패"
    lore:
      - "<#8f8164>볼크 가가 레딘 성문에 보낸 대방패."
      - "<#8f8164>흐롤프는 이것을 들고 성문 앞에 섰다."
      - "<#8f8164>무엇을 막으라고 보냈는지는 모른다."
  kiln_pot:
    name: "<#d1c3a0><font:souls:title>가마지기의 쇠단지"
    lore:
      - "<#8f8164>가마지기들이 남은 온기를 담아 다니던 쇠단지."
      - "<#8f8164>바닥에 불씨 몇 점이 아직 눌어붙어 있다."
      - "<#8f8164>가마는 식었어도 단지는 더디 식었다."
  pilgrim_handbell:
    name: "<#d1c3a0><font:souls:title>오스윈 순례자의 손종"
    lore:
      - "<#8f8164>오스윈 순례자들이 길에서 흔들던 손종."
      - "<#8f8164>교구의 큰 종소리를 흉내 낸 것이다."
      - "<#8f8164>작은 종으로는 아무도 불러들이지 못했다."

origin:
  title: "너는 누구였나"

ending:
  rekindle: "불을 잇는다"
  leave-cold: "식은 채로 둔다"

build:
  # 세계를 짓는 동안 접속을 거절할 때. 접속 전이라 언어를 몰라 두 언어를 두 줄로 함께 보인다
  refuse: "세계를 짓는 중이다. 잠시 뒤에 다시 오라."

pack:
  # 리소스팩 창에 뜨는 글과 쫓아낼 때의 글. 팩을 싣기 전이라 서버가 그 사람의 언어로 채운다
  prompt: "<#b3a37f>이 서버는 전용 리소스팩이 있어야 들어올 수 있다."
  declined: "<#b3a37f>리소스팩을 받지 않으면 들어올 수 없다."
  failed: "<#b3a37f>리소스팩을 받지 못했다. 다시 들어와 보라."
  # 팩 목록에 보이는 팩 설명 (pack.mcmeta). 게임 제목이다. 서버 목록 이름 (server.properties 의 motd) 도 이 글이다
  description: "스퀘어 소울"

test:
  # 시험 도구 이름과 설명 (debug.test-mode 의 /soulstest guard, swing). <ticks> 휘두름 틱.
  # <kind> 는 /soulstest guard 에 친 인수 그대로 (empty|control|bypass|strip) 다. 옮기지 않는 기계 글이라 [ ] 로 묶는다
  guard: "<#d1c3a0>시험 막기 [<kind>]"
  guard-lore:
    - "<#8f8164>막기 성분을 시험하는 도구."
    - "<#6b5f4a>들고 있으면 몸 앞을 가린다."
  swing: "<#d1c3a0>시험 휘두름 · <ticks>"

skill:
  # 스킬 이름과 설명은 content/skills.yml 이 아니라 여기 둔다 (열쇠는 skill.<id>.name, skill.<id>.desc)
  test_sweep:
    name: "<#d1c3a0>시험 휩쓸기"
    desc:
      - "<#8f8164>엔진 점검용."
  test_slam:
    name: "<#d1c3a0>시험 내려찍기"
    desc:
      - "<#8f8164>엔진 점검용."

hud:
  # 행동 막대 한 줄
  souls: "<#b3a37f>소울 <n>"
  # 술의 자원 (M5 의 첫 꼴, 10.2). <n> 지금, <m> 최대
  warmth: "<#b3a37f>마나 <n>/<m>"

admin:
  # 관리자 명령어 (/souls, /soulstest) 의 답. 점검 줄 ([CHECK], [T]) 은 봇이 읽는 기계 글이라 여기 두지 않는다
  players-only: "<#858079>플레이어가 쳐야 한다 (또는 /execute as)."
  reloaded: "<#858079>설정, 그림 글자, 콘텐츠를 다시 읽었다."
  no-anchor: "<#858079>그런 자리는 없다: <anchor>"
  no-world: "<#858079>게임 세계가 없다."
  room-built: "<#858079>시험 방을 지었다: <detail>"
  room-failed: "<#858079>시험 방을 짓지 못했다: <error>"

vanilla:
  # 일시 정지 화면 제목 (10.4). 창 제목 (menu.game, container.*) 은 팩 (pack/typeset.py) 이 제목 글꼴 글자로 바꾸고
  # 게임 메뉴 밑에는 금실을 단다. 글은 여기에만 있다
  menu:
    game: "게임 메뉴"
  # 바닐라 사망 화면 (5.6). deathScreen.title (YOU DIED 그림 글자) 은 gen_pack 이 넣는다.
  # <gray> 는 바닐라 흰 단추 글씨를 회색으로 낮춘다 (§7, 사망 화면 단추는 색을 고를 길이 이것뿐이다)
  # 설정 화면 제목 (10.4, 2026-10-08 비평: 제목 꼴이 셋이었다). 게임 메뉴처럼 팩이 제목 글꼴 글자로 바꾸고 밑에 금실을 단다.
  # 글은 바닐라 한국어와 같다. 단추 글 (options.video 같은 것) 이 아니라 화면 제목 열쇠만
  options:
    title: "설정"
    videoTitle: "비디오 설정"
    sounds:
      title: "음악 및 소리 설정"
    language:
      title: "언어"
    chat:
      title: "대화 설정"
    accessibility:
      title: "접근성 설정"
    skinCustomisation:
      title: "스킨 사용자 지정"
    online:
      title: "온라인 설정"
    mouse_settings:
      title: "마우스 설정"
    font:
      title: "글꼴 설정"
  controls:
    title: "조작"
    keybinds:
      title: "키 지정"
  deathScreen:
    respawn: "<gray>일어선다"
    titleScreen: "<gray>그만둔다"
    quit:
      confirm: "여기서 그만두겠나"
    score:
      value: ""
  # 창 제목 (10.4). 바닐라는 제목을 어두운 회색 (0x404040) 으로 쓰는데, 다시 그린 어두운 창 (인벤토리·제작대·상자) 에서는
  # 읽히지 않는다. <gray> (§7) 로 밝힌다. 글은 바닐라 한국어와 같다. 다시 그리지 않은 바닐라 창 (화로, 모루 …) 의
  # "보관함" 도 회색이 되지만, 그 창은 짓는 사람 (창작 모드) 만 연다 (Protection)
  container:
    crafting: "<gray>제작"
    chest: "<gray>상자"
    chestDouble: "<gray>큰 상자"
    enderchest: "<gray>엔더 상자"
    barrel: "<gray>통"
    inventory: "<gray>보관함"
