# 게임 안 문구, 한국어 원본 (10.3, 10.9, 12.5). 영어는 lang/en.yml 에 따로 쓴다. 두 파일의 열쇠는 똑같아야 한다.
# 말씨는 DESIGN.md 10.3 의 "UI 글 규칙" 을 따른다 (tools/textlint.py 가 거른다): 이야기 글 (무기·아이템 설명) 은 짧은 해라체,
# 단추·칸 이름은 명사형 (휴식, 되돌리기, 닫기), 설정 창·접속·시스템 글은 존댓말 (~합니다, ~하세요), 게임 안 알림은 짧은 평서문이나
# 명사형. 값은 " · " 로 잇지 않고 (칸 맞춤, 쉼표, 괄호), 한국어 글에 줄표 "—" 를 쓰지 않는다. 느낌표·과장 수식어도 쓰지 않는다.
#
# 꼴
#   열쇠: "<꼴>글 <자리>"
#   - 맨 앞의 MiniMessage 태그 하나 (또는 이어 붙인 몇 개) 가 그 열쇠의 꼴이다: <#rrggbb> (10.1 팔레트에서만), <gray> 같은
#     이름 색, <bold>, <!italic>. 꼴은 열쇠마다 하나뿐이다. 글 가운데에서 색을 바꾸지 않는다 (섞어야 하면 열쇠를 나눈다).
#     en.yml 의 같은 열쇠도 같은 꼴이어야 한다.
#   - <souls> 같은 자리는 플러그인이 채운다. 두 언어의 자리 이름이 같아야 한다 (차례는 달라도 된다).
#   - 목록은 아이템 설명처럼 여러 줄이고, 줄마다 열쇠 <열쇠>.1, .2 ... 가 된다. 두 언어의 줄 수가 같아야 한다.
#   - % 는 그대로 쓴다 (팩으로 옮길 때 %% 로 바뀐다).
# 가는 곳
#   pack/gen_pack.py 가 이 파일과 en.yml 을 리소스팩 언어 파일로 옮긴다: assets/souls/lang/ko_kr.json, en_us.json
#   (열쇠 앞에 souls. 를 붙이고, 꼴 태그를 떼고, 자리는 %1$s 꼴로). 다른 언어로 들어온 사람은 en_us 를 본다.
#   플러그인은 Component.translatable("souls.<열쇠>") 에 꼴을 입혀 보내고, 글은 클라이언트가 팩에서 고른다.
#   pack.prompt·pack.declined·pack.failed·build.refuse 는 팩을 싣기 전에 보이는 글이라 서버가 접속한 사람의 언어로 채운다.
#   vanilla 밑의 열쇠는 바닐라 열쇠를 덮어쓴다 (assets/minecraft/lang). 이름 색만 쓸 수 있다 (§ 코드로 바뀐다).
# 고친 뒤에는 팩과 jar 를 다시 만든다 (python3 tools/make_dist.py). 서버 폴더에는 꺼내 두지 않는다.

death:
  # 사망 화면 위 큰 제목. 그림 글자(glyphs.yml)가 없을 때만 이 글이 붉은 글씨로 나온다 (두 언어 모두 YOU DIED, 사용자 결정 3)
  title: "YOU DIED"

bonfire:
  lit: "<#9e7c44>화톳불을 밝혔다"
  enemies-back: "<#858079>적이 되살아났다"
  refuse: "<#858079>근처에 적이 있어 쉴 수 없다"
  # 이동은 처음부터 된다 (사용자 결정 4). 밝힌 화톳불이 여기뿐일 때 이동 창에 쓰는 글
  no-warp: "<#8f8164>이동할 수 있는 화톳불이 없다"
  # 휴식 창 (10.4). 단추는 양피지색 (바닐라 흰 글씨는 창에서 가장 밝아 제목보다 튄다). 단추 폭 160
  rest: "<#d1c3a0>휴식"
  warp: "<#d1c3a0>이동"
  leave: "<#d1c3a0>떠나기"
  # 휴식 창 본문은 레벨·보유 소울·필요 소울의 칸 맞춤 세 줄 (table.*, 레벨 올리기 창의 왼쪽 머리와 같다, 5.9)
  # 휴식 창의 새 단추 (4.1, 5.7, 5.9). 단추 폭 160
  levelup: "<#d1c3a0>레벨 업"
  stats: "<#d1c3a0>능력치"
  settings: "<#d1c3a0>세계 설정"
  repick: "<#d1c3a0>출신 변경"
  # 단추 설명 칸
  repick-tip: "<#8f8164>레벨 업 전에 한 번만 바꿀 수 있습니다.\n받은 시작 아이템은 회수됩니다."
  # M0 의 시험 창(/soulstest dialog)에만 쓰는 이름. M2 에서 화톳불마다의 이름 (bonfire.<id>.name) 으로 바꾼다.
  # 화톳불 이름은 두 언어 모두 장소 이름만 쓴다 ("탑옥 아래", "Beneath the Gaol Tower". 창이 화톳불 창이라 "화톳불" 을 붙이지
  # 않는다. 창 제목 폭 300 에 "볼크 탑옥 ..." 같은 긴 이름이 들어가야 한다)
  test-name: "<#d1c3a0><font:souls:title>탑옥 아래"

boss:
  # 큰 글씨. 아랫줄에 보스 이름
  felled: "<#9e7c44>적을 쓰러뜨렸다"
  hrolf:
    # 보스 막대의 이름 (화면 아래 가운데, 막대 왼쪽 끝 위, 제목 글꼴). 색은 HUD 글꼴 셰이더가 정한다
    name: "<#d1c3a0><font:souls:title>수문장 흐롤프"

souls:
  recovered: "<#b3a37f>소울을 되찾았다"

door:
  one-way: "<#858079>이쪽에서는 열 수 없다"
  locked: "<#858079>잠겨 있다"
  opened: "<#858079>문이 열렸다"
  sealed: "<#858079>봉인되어 있다"

bell:
  rung: "<#b3a37f>종소리가 멀리 퍼졌다"

taster:
  # 맛보기판 끝 (종을 울린 뒤, 큰 글씨)
  end: "<#b3a37f>길은 아직 닫혀 있다"

spell:
  # 술법 (M5). 익혔을 때는 아랫줄에 술법 이름. 게임 안 글은 "술" 이 아니라 "술법" (마실 것으로 읽히지 않게, DECISIONS 2026-10-10)
  learned: "<#b3a37f>술법을 익혔다"
  # 기억 창 안 글
  no-slot: "<#8f8164>기억 슬롯이 부족하다"
  # 든 촉매로 쓸 술법이 없을 때 (부제목)
  none: "<#858079>기억한 술법이 없다"

item:
  # 만능 열쇠 (9.5): 도적의 시작 아이템. 열쇠로 잠긴 문을 연다 (문은 M2·M3)
  master_key:
    name: "<#d1c3a0><font:souls:title>만능 열쇠"
    lore:
      - "<#8f8164>웬만한 자물쇠는 이것으로 열린다."
      - "<#8f8164>봉인된 문에는 소용없다."

ring:
  # 반지 (9.4, content/rings.yml). 인벤토리 2×2 자리의 왼쪽 세로 두 칸에 낀다 (item/RingSlots). 이름은 ring.<id>.name (제목 글꼴),
  # 설명 칸은 효과 줄 (플러그인이 ring.effect.* 에 값을 채운다) 다음에 ring.<id>.lore.
  # 이야기를 사용자가 정하기 전이라 이름 있는 반지는 없다. 아래 test_* 셋은 시험 반지 (/soulstest ring give) 이고 기능을 그대로 적은
  # 임시 이름이다. 이야기의 반지가 들어오면 지운다
  effect:
    # 효과 줄 (설명 칸 맨 위, 흐린 옛 금빛). <pct> 는 "+20" 꼴, <sec> 는 "+0.1" 꼴 (끝의 0 은 뗀다)
    stamina-regen: "<#9e7c44>스태미나 회복 <pct>%"
    poise: "<#9e7c44>강인도 <pct>%"
    parry-window: "<#9e7c44>패링 판정 <sec>초"
    soul-guard: "<#9e7c44>죽어도 소울을 잃지 않는다. 대신 반지가 부서진다"
    # 고리만 있는 효과 (그 체계가 아직 없다) 가 있으면 효과 줄 밑에 붙는다
    pending: "<#5c5955>아직 적용되지 않는 효과"
  # 무게가 있는 반지만 (효과 줄 밑). 지금 반지는 모두 무게가 없어 보이지 않는다. 반지 설명 칸에는 다른 수치가 없다
  weight: "<#858079>무게 <weight>"
  # 효과 줄과 설명 사이의 실선 (무기의 weapon.rule 과 같다). 팩이 반지마다 ring.rule.<id> 를 그 반지 설명 칸 폭으로 짠다 (pack/typeset.py).
  # 여기 글은 팩이 없을 때만 보이는 대체 글
  rule: "<#fefefe>—"
  test_stamina:
    name: "<#d1c3a0><font:souls:title>시험 반지: 스태미나 회복"
    lore:
      - "<#8f8164>[시험용]"
  test_poise:
    name: "<#d1c3a0><font:souls:title>시험 반지: 강인도"
    lore:
      - "<#8f8164>[시험용]"
  test_parry:
    name: "<#d1c3a0><font:souls:title>시험 반지: 패링"
    lore:
      - "<#8f8164>[시험용]"

container:
  # 제작대 창 제목 (item/RingSlots 가 제작대를 열 때 단다). 바닐라는 인벤토리 2×2 의 글과 제작대 제목에 같은 열쇠 container.crafting 을
  # 쓰는데, 인벤토리의 그 자리가 반지 칸이 되어 글을 지웠다 (vanilla.container.crafting 을 비움, 사용자 결정 "반지 글자는 넣지 않는다").
  # 제작대는 짓는 사람 (창작 모드) 만 연다. 바닐라 창 제목과 같은 꼴 (§7 회색 → 글꼴 셰이더가 흐린 옛 금빛, 제목 글꼴)
  workbench: "<gray><font:souls:title>제작"

weapon:
  # 무기·방패·촉매 (9.1, 9.2, 3.12.4, 9.7). 열쇠는 weapon.<id>.name (한 줄), weapon.<id>.lore (목록). id 와 모형 명세는
  # pack/weapons/SPEC.md. 이름은 바랜 양피지에 제목 글꼴 (<font:souls:title>, 로마 비문 대문자·무거운 명조), 분류 줄은 흐린 옛 금빛
  # (그을린 청동), 설명은 탁한 양피지 (9.7). 수치 표는 플러그인이 따로 붙인다
  class:
    # 설명 칸 둘째 줄 "분류 (공격 속성)" (9.7, 3.6 의 무기 분류표). 공격 속성은 소울류 한국어판 말: 참격·타격·찌르기
    straight_sword: "<#9e7c44>직검 (참격/찌르기)"
    dagger: "<#9e7c44>단검 (참격/찌르기)"
    greatsword: "<#9e7c44>대검 (참격)"
    axe: "<#9e7c44>도끼 (참격)"
    hammer: "<#9e7c44>망치 (타격)"
    spear: "<#9e7c44>창 (찌르기)"
    halberd: "<#9e7c44>미늘창 (참격/찌르기)"
    bow: "<#9e7c44>활"
    small_shield: "<#9e7c44>소형 방패"
    medium_shield: "<#9e7c44>중형 방패"
    greatshield: "<#9e7c44>대형 방패"
    parrying_dagger: "<#9e7c44>패링 단검 (찌르기)"
    catalyst_kiln: "<#9e7c44>촉매 (가마 술법)"
    catalyst_bell: "<#9e7c44>촉매 (종 술법)"
  stat:
    # 설명 칸의 수치 한 줄 (9.7): 제 값 하나와 무게 (장비에는 보정·요구 능력치가 없다, DECISIONS 2026-10-10). 이름은 여기, 값은
    # 플러그인 (item/StatTable) 이 content/weapons.yml 에서 채워 값 열 끝에 오른쪽 맞춤으로 붙인다. 팩 (pack/typeset.py) 이 이름
    # 뒤를 빈칸 글자로 채워 그 언어의 이름 열을 맞춘다. 무기·활·패링 단검은 공격력, 방패는 물리 컷률 (막는 동안 막는 물리 피해 %,
    # 다크 소울 한국어판의 "물리 컷률"), 촉매는 술법 위력
    attack: "<#858079>공격력"
    guard: "<#858079>물리 컷률"
    spell: "<#858079>술법 위력"
    weight: "<#858079>무게"
  # 수치 표와 설명 사이의 실선 (9.7). 글이 아니라 팩이 무기마다 weapon.rule.<id> 열쇠를 실선 그림 글자로 짠다 (pack/typeset.py:
  # 그 무기 설명 칸의 글 열 폭만큼, 이름 밑 금실과 같은 색·굵기·금빛 마름모). 여기 글은 팩이 없을 때만 보이는 대체 글.
  # 글자색 #fefefe 는 색 그림 글자를 그대로 보이게 하는 흰색 (셰이더가 순백 #ffffff 만 뼈빛으로 바꾼다)
  rule: "<#fefefe>—"
  redin_guard_sword:
    name: "<#d1c3a0><font:souls:title>레딘 경비대 직검"
    lore:
      - "<#8f8164>레딘 경비대가 차던 곧은 칼."
      - "<#8f8164>성벽 위의 병사들은 모두 안쪽을 보고 섰다."
      - "<#8f8164>칼끝이 어디를 향했는지는 적혀 있지 않다."
  volk_longsword:
    name: "<#d1c3a0><font:souls:title>볼크 가의 장검"
    lore:
      - "<#8f8164>볼크 가의 기사가 차던 긴 칼."
      - "<#8f8164>탑옥을 맡은 가문은 죄수보다 먼저 망자가 되었다."
      - "<#8f8164>자루 끝의 문장은 누군가 긁어 지웠다."
  alley_dagger:
    name: "<#d1c3a0><font:souls:title>레딘 뒷골목 단도"
    lore:
      - "<#8f8164>레딘 뒷골목에서 흔히 쓰던 짧은 칼."
      - "<#8f8164>성벽이 닫힌 뒤로 골목은 더 좁아졌다."
      - "<#8f8164>칼은 등 뒤에서 가장 잘 들었다."
  gaoler_greatsword:
    name: "<#d1c3a0><font:souls:title>탑옥 간수의 대검"
    lore:
      - "<#8f8164>탑옥 간수들이 들던 무거운 대검."
      - "<#8f8164>베기보다 때려눕히는 데 더 많이 썼다."
      - "<#8f8164>끝이 뭉툭하게 갈린 것은 그 때문이다."
  levy_hatchet:
    name: "<#d1c3a0><font:souls:title>레딘 징집병 손도끼"
    lore:
      - "<#8f8164>레딘이 징집병에게 나눠 준 손도끼."
      - "<#8f8164>장작 패던 연장에 쇠를 조금 더 댄 것이다."
      - "<#8f8164>받은 자들은 끝내 성벽 밖을 보지 못했다."
  sellsword_axe:
    name: "<#d1c3a0><font:souls:title>볼크 가 고용병 도끼"
    lore:
      - "<#8f8164>볼크 가가 삯을 주고 부린 자들의 도끼."
      - "<#8f8164>삯은 탑옥의 금고에서 나왔다."
      - "<#8f8164>금고가 빈 뒤에도 몇은 떠나지 않았다."
  gaoler_club:
    name: "<#d1c3a0><font:souls:title>볼크 간수의 곤봉"
    lore:
      - "<#8f8164>볼크 가의 간수가 허리에 걸고 다니던 곤봉."
      - "<#8f8164>쇠테를 두른 참나무다."
      - "<#8f8164>죽이지 않고 눕히는 데 썼다."
  penitent_mace:
    name: "<#d1c3a0><font:souls:title>오스윈 고행승의 철퇴"
    lore:
      - "<#8f8164>오스윈 교구의 고행승이 들던 철퇴."
      - "<#8f8164>그들은 남을 치기 전에 제 등부터 쳤다."
      - "<#8f8164>물이 찬 뒤로는 무엇을 뉘우쳤는지 잊었다."
  mathes_bell_mace:
    name: "<#d1c3a0><font:souls:title>마테스의 종 철퇴"
    lore:
      - "<#8f8164>안셀이 마테스의 소울을 쇠에 부어 만든 철퇴."
      - "<#8f8164>머리는 작은 종이다. 속을 납으로 채웠다."
      - "<#8f8164>마테스는 끝내 종을 놓지 않았다."
  redin_spear:
    name: "<#d1c3a0><font:souls:title>레딘 창병의 창"
    lore:
      - "<#8f8164>레딘 창병들이 방패 벽 뒤에서 내밀던 창."
      - "<#8f8164>창끝은 늘 도시 쪽을 향했다."
      - "<#8f8164>자루에 묶은 천은 본래 레딘의 붉은 천이었다."
  hrolf_halberd:
    name: "<#d1c3a0><font:souls:title>흐롤프의 미늘창"
    lore:
      - "<#8f8164>레딘의 마지막 수문장이 들던 미늘창."
      - "<#8f8164>성문은 밖이 아니라 안을 향해 닫혀 있었다."
      - "<#8f8164>흐롤프는 끝내 그 까닭을 묻지 않았다."
  warden_halberd:
    name: "<#d1c3a0><font:souls:title>교구 수호병의 미늘창"
    lore:
      - "<#8f8164>교구를 지키던 거구의 수호병들이 들던 미늘창."
      - "<#8f8164>오스윈이 종을 울려 부른 근위대의 남은 자들이라 한다."
      - "<#8f8164>그들은 아직 부름이 끝나지 않았다고 믿는다."
  wall_shortbow:
    name: "<#d1c3a0><font:souls:title>레딘 성벽 단궁"
    lore:
      - "<#8f8164>레딘 성벽의 궁수들이 쓰던 짧은 활."
      - "<#8f8164>성벽 아래까지만 닿으면 되었다."
      - "<#8f8164>화살은 대개 안쪽으로 날아갔다."
  plank_shield:
    name: "<#d1c3a0><font:souls:title>탑옥 판자 방패"
    lore:
      - "<#8f8164>탑옥 감방 문짝을 뜯어 만든 방패."
      - "<#8f8164>안쪽 면에는 손톱 자국이 남아 있다."
      - "<#8f8164>누가 긁었는지는 아무도 묻지 않는다."
  pilgrim_buckler:
    name: "<#d1c3a0><font:souls:title>오스윈 순례자의 버클러"
    lore:
      - "<#8f8164>오스윈을 찾아가던 순례자의 작은 방패."
      - "<#8f8164>가운데 징에 종 모양이 찍혀 있다."
      - "<#8f8164>길은 물에 잠겼고, 아무도 돌아가지 않았다."
  parrying_dagger:
    name: "<#d1c3a0><font:souls:title>레딘 결투 단검"
    lore:
      - "<#8f8164>레딘의 결투꾼들이 왼손에 쥐던 단검."
      - "<#8f8164>찌르기보다 칼을 받아 넘기는 데 썼다."
      - "<#8f8164>성벽이 닫힌 뒤로 결투는 끼니보다 잦았다."
  redin_guard_shield:
    name: "<#d1c3a0><font:souls:title>레딘 경비대 방패"
    lore:
      - "<#8f8164>레딘 경비대의 쇠테 두른 방패."
      - "<#8f8164>앞면의 성문 문장은 거의 벗겨졌다."
      - "<#8f8164>문장 속의 문은 닫혀 있다."
  volk_greatshield:
    name: "<#d1c3a0><font:souls:title>볼크 가의 대방패"
    lore:
      - "<#8f8164>볼크 가가 레딘 성문에 보낸 대방패."
      - "<#8f8164>흐롤프는 이것을 들고 성문 앞에 섰다."
      - "<#8f8164>무엇을 막으라고 보냈는지는 모른다."
  kiln_pot:
    name: "<#d1c3a0><font:souls:title>가마지기의 쇠단지"
    lore:
      - "<#8f8164>가마지기들이 남은 온기를 담아 다니던 쇠단지."
      - "<#8f8164>바닥에 불씨 몇 점이 아직 눌어붙어 있다."
      - "<#8f8164>가마는 식었어도 단지는 더디 식었다."
  pilgrim_handbell:
    name: "<#d1c3a0><font:souls:title>오스윈 순례자의 손종"
    lore:
      - "<#8f8164>오스윈 순례자들이 길에서 흔들던 손종."
      - "<#8f8164>교구의 큰 종소리를 흉내 낸 것이다."
      - "<#8f8164>작은 종으로는 아무도 불러들이지 못했다."

origin:
  # 출신 창 (5.10). 제목은 제목 글꼴, 밑에 금실 (팩)
  title: "<#d1c3a0><font:souls:title>출신 선택"
  # 출신 창 머리줄의 칸 (팩이 출신 줄과 같은 열 폭으로 채운다: head-name 은 출신 이름 칸, head-level 은 오른쪽 맞춤 칸,
  # head-kit 은 시작 아이템 칸)
  head-name: "<#858079>출신"
  head-level: "<#858079>레벨"
  head-kit: "<#858079>시작 아이템"
  # 나가기 동작 (Esc 와 같다)
  later: "<#d1c3a0>나중에 고르기"
  # 확인 창
  choose: "<#d1c3a0>이 출신으로 시작"
  back: "<#d1c3a0>뒤로"
  # 확인 창의 능력치 표 (왼쪽 능력치 여섯, 오른쪽 최대 HP·마나·스태미나·장비 중량·공격력·방어력) 는 stat.*·derived.* 칸으로 짠다
  # 촉매를 들고 시작하는 출신 (지금은 마법사뿐) 의 확인 창 한 줄. 술법은 M5 에 들어온다
  no-rites: "<#8f8164>아직 익힌 술법이 없어 지금은 단도로 싸운다."
  # 확인 창의 제목 (제목 글꼴, 밑에 금실: 팩이 출신마다 origin.confirm-title.<id> 로 짠다)
  confirm-title: "<#d1c3a0><font:souls:title><name>"
  # 출신을 고르지 않고 창을 닫았을 때 (부제목 둘을 잇달아, 둘째는 채팅에도. <bind> 는 그 사람의 웅크리기 키 이름 (키 묶음 글),
  # 키 이름 뒤에 토씨를 붙이지 않는다 (조작 안내 꼴 "할 일: 키 누르기"). roll-key: f 면 none-hint-f 로 F 키)
  none: "<#858079>아직 출신을 고르지 않았습니다"
  none-hint: "<#858079>출신 고르기: <bind> 짧게 누르기"
  none-hint-f: "<#858079>출신 고르기: <bind> 누르기"
  # 출신 여섯 (5.1, content/origins.yml). name 은 출신 창의 칸, desc 는 누구인지 한 줄 (출신 창의 설명 칸과 확인 창), style 은
  # 확인 창의 둘째 줄 (어떻게 싸우는지), kit 은 출신 창의 짧은 시작 아이템 글 (쉼표로 나열). 평서문 한두 줄, 문장 틀을 서로 다르게
  knight:
    name: "<#d1c3a0>기사"
    desc: "<#8f8164>직검과 방패를 갖춘 기사."
    style: "<#b3a37f>생명력이 높고, 방패를 들고 버티는 싸움에 강하다."
    kit: "<#b3a37f>직검, 방패"
  warrior:
    name: "<#d1c3a0>전사"
    desc: "<#8f8164>대검을 양손으로 휘두르는 전사."
    style: "<#b3a37f>근력이 높아 한 방이 크지만 방패가 없다."
    kit: "<#b3a37f>대검"
  thief:
    name: "<#d1c3a0>도적"
    desc: "<#8f8164>만능 열쇠를 지닌 도적."
    style: "<#b3a37f>민첩이 높고, 왼손의 결투 단검으로 패링한다."
    kit: "<#b3a37f>단도, 결투 단검, 열쇠"
  archer:
    name: "<#d1c3a0>궁수"
    desc: "<#8f8164>활로 먼저 공격하는 궁수."
    style: "<#b3a37f>멀리서 활을 쏘다가 적이 다가오면 손도끼를 든다."
    kit: "<#b3a37f>단궁, 손도끼"
  sorcerer:
    name: "<#d1c3a0>마법사"
    desc: "<#8f8164>촉매를 지닌 마법사."
    style: "<#b3a37f>지력이 높지만 HP가 낮다."
    kit: "<#b3a37f>촉매, 단도"
  deprived:
    name: "<#d1c3a0>빈털터리"
    desc: "<#8f8164>곤봉과 판자 방패만 들고 시작한다."
    style: "<#b3a37f>모든 능력치가 10이라 원하는 쪽으로 키우기 좋다."
    kit: "<#b3a37f>곤봉, 판자 방패"

start:
  # 세계 설정 창 (5.7). 처음 들어온 사람 (또는 관리자) 이 한 번. 설정 창이라 존댓말
  title: "<#d1c3a0><font:souls:title>세계 설정"
  body: "<#b3a37f>처음 한 번 정하면 관리자만 바꿀 수 있습니다."
  pvp: "<#d1c3a0>PvP"
  pvp-hit: "<#8f8164>PvP를 켜면 플레이어끼리 공격할 수 있습니다."
  pvp-sweep: "<#8f8164>휘두르는 공격에는 옆에 있는 플레이어도 맞습니다."
  # 난이도 단추 (폭 250). <name> 난이도 이름만 (설명과 배율은 단추의 설명 칸). 기본 난이도에는 choice-default
  choice: "<#d1c3a0><name>"
  choice-default: "<#d1c3a0><name> (권장)"
  later: "<#d1c3a0>나중에 정하기"
  # "나중에 정하기" 의 설명 칸: 그동안 쓰는 잠정 설정
  later-tip: "<#8f8164>정하기 전까지: <difficulty>, <pvp>"
  # 알림 (부제목과 채팅, 출신 창 앞)
  notice: "<#b3a37f>세계 설정: <difficulty>, <pvp>"
  changed: "<#b3a37f>세계 설정이 바뀌었습니다: <difficulty>, <pvp>"
  provisional: "<#858079>세계 설정이 아직 정해지지 않았습니다"
  provisional-chat: "<#858079>다시 접속하거나 화톳불에서 쉴 때 다시 묻습니다."
  waiting: "<#858079>다른 플레이어가 세계 설정 중입니다"
  op-only: "<#858079>세계 설정은 관리자만 바꿀 수 있습니다"
  # 세계 설정 창·휴식 창의 단추를 눌렀는데 그 사이 다른 사람 (관리자) 이 정했을 때 (채팅)
  already-set: "<#858079>세계 설정이 이미 정해졌습니다"

difficulty:
  # 난이도 넷 (5.7). 이름은 단추, desc 는 단추 설명 칸의 첫 줄 (설정 창이라 존댓말). 지금 듣는 것 (적이 주는 피해, 적 체력) 만 적는다:
  # 에스트·패링 창은 그 체계가 생기는 M1 에 보통과 다를 때만 더한다 (검토 difficulty-promises-unbuilt)
  easy:
    name: "<#d1c3a0>쉬움"
    desc: "<#8f8164>적이 약합니다."
  normal:
    name: "<#d1c3a0>보통"
    desc: "<#8f8164>기본 난이도입니다."
  hard:
    name: "<#d1c3a0>어려움"
    desc: "<#8f8164>적이 더 세고 단단합니다."
  very_hard:
    name: "<#d1c3a0>아주 어려움"
    desc: "<#8f8164>적이 훨씬 세고 단단합니다."
  # 난이도 단추의 설명 칸 둘째 줄: 배율 (내가 받는 피해, 적 체력)
  summary: "<#b3a37f>받는 피해 ×<damage>, 적 HP ×<health>"

pvp:
  "on": "<#b3a37f>PvP 켬"
  "off": "<#b3a37f>PvP 끔"

stat:
  # 능력치 여섯 (5.2, DECISIONS 2026-10-10: 생명력·정신력·지구력·근력·민첩·지력). name 은 레벨 올리기·능력치·출신 확인 창의 능력치
  # 목록 (왼쪽 열, 팩이 table.* 와 같은 폭으로 채운 칸) 과 레벨 올리기의 "+" 단추, short 는 출신 창의 머리줄 (오른쪽 맞춤 칸).
  # 한국어는 줄이지 않는다 (short 도 같은 이름)
  vig:
    name: "<#d1c3a0>생명력"
    short: "<#858079>생명력"
  mnd:
    name: "<#d1c3a0>정신력"
    short: "<#858079>정신력"
  end:
    name: "<#d1c3a0>지구력"
    short: "<#858079>지구력"
  str:
    name: "<#d1c3a0>근력"
    short: "<#858079>근력"
  dex:
    name: "<#d1c3a0>민첩"
    short: "<#858079>민첩"
  int:
    name: "<#d1c3a0>지력"
    short: "<#858079>지력"

table:
  # 레벨 올리기·능력치 창의 왼쪽 열 머리 (5.9): 이름 왼쪽, 값 오른쪽. 팩이 stat.*.name 과 같은 폭으로 채운다 (table.*.cell).
  # blank 는 빈 칸 (왼쪽 열이 비는 줄): 글이 없고 폭만 있다
  level: "<#858079>레벨"
  held: "<#858079>보유 소울"
  need: "<#858079>필요 소울"
  origin: "<#858079>출신"
  blank: ""

derived:
  # 레벨 올리기·능력치 창의 오른쪽 열 (5.9). 팩이 그 언어의 가장 긴 이름 폭까지 채워 칸을 맞춘다 (derived.*.cell). blank 는 빈 칸
  max-hp: "<#858079>최대 HP"
  defense: "<#858079>방어력"
  max-mana: "<#858079>최대 마나"
  magic-res: "<#858079>마법 방어력"
  max-stamina: "<#858079>최대 스태미나"
  regen: "<#858079>스태미나 회복"
  attack: "<#858079>공격력"
  attack-2h: "<#858079>공격력 (양손)"
  # 장비 무게 / 한도 ("4.5 / 40.0")
  load: "<#858079>장비 중량"
  move: "<#858079>이동 속도"
  attack-speed: "<#858079>공격 속도"
  spell: "<#858079>술법 위력"
  ailment: "<#858079>상태 이상 내성"
  blank: ""

load:
  # 장비 중량 단계 (5.8). 소울류 한국어판처럼 마지막 단계는 과적
  light: "<#b3a37f>가벼움"
  medium: "<#b3a37f>보통"
  heavy: "<#b3a37f>무거움"
  over: "<#b3a37f>과적"

burden:
  # 무게 단계가 바뀔 때 (부제목, 한 번, 5.8). "단계 이름: 그 단계의 구르기·이동" (명사형, 어느 쪽으로 바뀌어도 맞게)
  light: "<#858079>가벼움: 구르기가 빠름"
  medium: "<#858079>보통: 구르기가 조금 느림"
  heavy: "<#858079>무거움: 구르기와 이동이 느림"
  over: "<#858079>과적: 구를 수 없음"

levelup:
  # 레벨 업 창 (5.9)
  title: "<#d1c3a0><font:souls:title>레벨 업"
  # 본문은 표 (5.9): 왼쪽 열 레벨·보유 소울·필요 소울 (table.*) 과 능력치 여섯 (stat.*.name), 오른쪽 열 derived.*.
  # 능력치 단추 (폭 64, 한 줄에 여섯) 는 능력치 이름 (stat.*.name) 뒤에 플러그인이 "+" 를 붙인다 (소울이 모자라면 흐리게)
  undo: "<#d1c3a0>되돌리기"
  confirm: "<#d1c3a0>결정"
  cancel: "<#d1c3a0>취소"
  # 능력치 단추의 설명 칸: 그 능력치의 두 효과를 한 점 더했을 때 (다음 한 점의 비용은 표의 필요 소울)
  tip: "<#b3a37f><first> <firstv>\n<second> <secondv>"
  short: "<#8f8164>소울이 부족합니다"
  # 아직 적용되지 않는 값 (술법이 생기는 M5 전의 최대 마나·술법 위력, 흐리게). <what> 은 그 값의 이름 (derived.*)
  later: "<#6b5f4a><what> (미적용)"
  # 근력 단추의 셋째 줄: 한 점 더해 무게 단계가 바뀔 때만 (둘째 줄이 "장비 중량 4.5 / 40.0 → 41.4")
  load-change: "<#8f8164><from> → <to>"
  # 지력의 상태 이상 내성을 길이로 (불에 타는 3초가 몇 초가 되나. 같으면 보이지 않는다)
  burn: "<#8f8164>불에 타는 시간 <from>초 → <to>초"

stats:
  # 능력치 창 (5.9, /stats)
  title: "<#d1c3a0><font:souls:title>능력치"
  # 본문은 레벨 올리기 창과 같은 표 (왼쪽 출신·레벨·보유 소울과 능력치 여섯, 오른쪽 derived.* 와 장비 중량 밑의 무게 단계)
  no-origin: "<#858079>출신 없음"
  burn: "<#8f8164>불에 타는 시간 <from>초 → <to>초"
  close: "<#d1c3a0>닫기"

controls:
  # 조작 알림 (2.1): "할 일: 키 누르기" 꼴. <bind> 는 그 사람이 정한 키 이름 (키 묶음 글). 키 이름 뒤에 토씨를 붙이지 않는다
  hint:
    roll: "<#8f8164>구르기: <bind> 짧게 누르기"
    roll-f: "<#8f8164>구르기: <bind>"
    # 패링 (F: 왼손에 든 것으로 쳐낸다). 출신 확인 창에서 그 출신의 왼손 물건이 패링할 수 있을 때만. roll-key: f·both 면 웅크리기 키 + F
    parry: "<#8f8164>패링: <bind>"
    parry-sneak: "<#8f8164>패링: <sneak> + <bind>"

ending:
  rekindle: "불을 잇는다"
  leave-cold: "식은 채로 둔다"

build:
  # 세계를 짓는 동안 접속을 거절할 때. 접속 전이라 언어를 몰라 두 언어를 두 줄로 함께 보인다. 접속·팩 글은 존댓말
  refuse: "세계를 만드는 중입니다. 잠시 후 다시 접속해 주세요."

pack:
  # 리소스팩 창에 뜨는 글과 쫓아낼 때의 글. 팩을 싣기 전이라 서버가 그 사람의 언어로 채운다
  prompt: "<#b3a37f>이 서버는 전용 리소스팩이 필요합니다."
  declined: "<#b3a37f>리소스팩을 받지 않으면 접속할 수 없습니다."
  failed: "<#b3a37f>리소스팩을 받지 못했습니다. 다시 접속해 주세요."
  # 팩 목록에 보이는 팩 설명 (pack.mcmeta). 게임 제목이다. 서버 목록 이름 (server.properties 의 motd) 도 이 글이다
  description: "블록 소울"

test:
  # 시험 도구 이름과 설명 (debug.test-mode 의 /soulstest guard, swing). <ticks> 휘두름 틱.
  # <kind> 는 /soulstest guard 에 친 인수 그대로 (empty|control|bypass|strip) 다. 옮기지 않는 기계 글이라 [ ] 로 묶는다.
  # 시험 도구·시험 반지의 설명 칸 표시는 "[시험용]" 하나 (개발 메모를 설명 칸에 쓰지 않는다, DECISIONS 2026-10-10)
  guard: "<#d1c3a0>시험 가드 [<kind>]"
  guard-lore:
    - "<#8f8164>[시험용]"
    - "<#6b5f4a>들고 있으면 몸 앞을 막는다."
  swing: "<#d1c3a0>시험 휘두르기 (<ticks>틱)"

skill:
  # 스킬 이름과 설명은 content/skills.yml 이 아니라 여기 둔다 (열쇠는 skill.<id>.name, skill.<id>.desc)
  test_sweep:
    name: "<#d1c3a0>시험 휩쓸기"
    desc:
      - "<#8f8164>[시험용]"
  test_slam:
    name: "<#d1c3a0>시험 내려찍기"
    desc:
      - "<#8f8164>[시험용]"

hud:
  # 행동 막대 한 줄
  souls: "<#b3a37f>소울 <n>"
  # 술의 자원 (M5 의 첫 꼴, 10.2). <n> 지금, <m> 최대
  warmth: "<#b3a37f>마나 <n>/<m>"

admin:
  # 관리자 명령어 (/souls, /soulstest) 의 답 (시스템 글이라 존댓말). 점검 줄 ([CHECK], [T]) 은 봇이 읽는 기계 글이라 여기 두지 않는다
  players-only: "<#858079>플레이어만 쓸 수 있는 명령어입니다 (콘솔에서는 /execute as)."
  reloaded: "<#858079>설정, 글리프, 콘텐츠를 다시 불러왔습니다."
  no-anchor: "<#858079>없는 위치입니다: <anchor>"
  no-world: "<#858079>게임 세계가 없습니다."
  room-built: "<#858079>시험 방을 지었습니다: <detail>"
  room-failed: "<#858079>시험 방을 짓지 못했습니다: <error>"
  # 1.3판 (5.4, 5.7, 5.10)
  settings-busy: "<#858079>다른 플레이어가 세계 설정 창을 열어 두었습니다."
  settings-unknown: "<#858079>알 수 없는 값: <value>"
  settings-set: "<#858079>세계 설정을 바꿨습니다: <difficulty>, <pvp>"
  origin-reset: "<#858079><player>: 출신을 초기화했습니다 (회수한 아이템 <items>개)"
  souls-set: "<#858079><player>: 보유 소울 <souls>"
  no-player: "<#858079>플레이어를 찾을 수 없습니다: <player>"

vanilla:
  # 일시 정지 화면 제목 (10.4). 창 제목 (menu.game, container.*) 은 팩 (pack/typeset.py) 이 제목 글꼴 글자로 바꾸고
  # 게임 메뉴 밑에는 금실을 단다. 글은 여기에만 있다
  menu:
    game: "게임 메뉴"
  # 바닐라 사망 화면 (5.6). deathScreen.title (YOU DIED 그림 글자) 은 gen_pack 이 넣는다.
  # <gray> 는 바닐라 흰 단추 글씨를 회색으로 낮춘다 (§7, 사망 화면 단추는 색을 고를 길이 이것뿐이다)
  # 설정 화면 제목 (10.4, 2026-10-08 비평: 제목 꼴이 셋이었다). 게임 메뉴처럼 팩이 제목 글꼴 글자로 바꾸고 밑에 금실을 단다.
  # 글은 바닐라 한국어와 같다. 단추 글 (options.video 같은 것) 이 아니라 화면 제목 열쇠만
  options:
    title: "설정"
    videoTitle: "비디오 설정"
    sounds:
      title: "음악 및 소리 설정"
    language:
      title: "언어"
    chat:
      title: "대화 설정"
    accessibility:
      title: "접근성 설정"
    skinCustomisation:
      title: "스킨 사용자 지정"
    online:
      title: "온라인 설정"
    mouse_settings:
      title: "마우스 설정"
    font:
      title: "글꼴 설정"
  controls:
    title: "조작"
    keybinds:
      title: "키 지정"
  deathScreen:
    respawn: "<gray>다시 일어서기"
    titleScreen: "<gray>타이틀 화면으로"
    quit:
      confirm: "타이틀 화면으로 나갈까요?"
    score:
      value: ""
  # 창 제목 (10.4). 바닐라는 제목을 어두운 회색 (0x404040) 으로 쓰는데, 다시 그린 어두운 창 (인벤토리·제작대·상자) 에서는
  # 읽히지 않는다. <gray> (§7) 로 밝힌다. 글은 바닐라 한국어와 같다. 다시 그리지 않은 바닐라 창 (화로, 모루 …) 의
  # "보관함" 도 회색이 되지만, 그 창은 짓는 사람 (창작 모드) 만 연다 (Protection)
  container:
    # 인벤토리 2×2 자리의 글 "제작": 그 자리가 반지 칸이 되었고 반지 칸에는 글을 넣지 않는다 (2026-10-08 사용자 결정 B 안). 같은 열쇠를
    # 쓰는 제작대 창 제목은 플러그인이 container.workbench 로 단다
    crafting: ""
    chest: "<gray>상자"
    chestDouble: "<gray>큰 상자"
    enderchest: "<gray>엔더 상자"
    barrel: "<gray>통"
    inventory: "<gray>보관함"
