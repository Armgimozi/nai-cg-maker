# 게임 안 시스템 문구 (10.3). 모든 문구는 이 파일 한 곳에 있고 글 검사기(tools/textlint.py)를 지난다.
# 짧고 건조하게. 느낌표, 설명문체("~할 수 있습니다"), 과장된 수식어를 쓰지 않는다.
# 글자색은 10.1 팔레트에서만 고른다 (MiniMessage <#rrggbb>). <n> 같은 자리는 플러그인이 채운다.

death:
  # 사망 화면 위 큰 제목. 그림 글자(glyphs.yml)가 없을 때만 이 글이 붉은 글씨로 나온다
  title: "YOU DIED"

bonfire:
  lit: "<#9e7c44>화톳불을 밝혔다"
  enemies-back: "<#858079>적들이 되살아났다"
  refuse: "<#858079>적이 가까이 있다"
  # 이동은 처음부터 된다 (사용자 결정 4). 밝힌 화톳불이 여기뿐일 때 이동 창에 쓰는 글
  no-warp: "<#8f8164>아직 건널 불이 없다"
  # 휴식 창 (10.4). 단추는 양피지색 (바닐라 흰 글씨는 창에서 가장 밝아 제목보다 튄다)
  rest: "<#d1c3a0>쉰다"
  warp: "<#d1c3a0>불을 건넌다"
  leave: "<#d1c3a0>일어선다"
  status: "<#b3a37f>소울 <souls> · 레벨 <level>"
  # M0 의 시험 창(/soulstest dialog)에만 쓰는 이름. M2 에서 화톳불마다의 이름으로 바꾼다
  test-name: "<#d1c3a0>탑옥 아래 화톳불"

boss:
  felled: "<#9e7c44>쓰러뜨렸다"

souls:
  recovered: "<#b3a37f>소울을 되찾았다"

door:
  one-way: "<#858079>이쪽에서는 열 수 없다"
  locked: "<#858079>잠겨 있다"
  opened: "<#858079>문이 열렸다"
  sealed: "<#858079>봉인되어 있다"

bell:
  rung: "<#b3a37f>종소리가 멀리 퍼졌다"

taster:
  # 맛보기판 끝 (종을 울린 뒤, 큰 글씨)
  end: "<#b3a37f>길은 아직 닫혀 있다"

spell:
  # 술 (M5). 익혔을 때는 아랫줄에 술 이름
  learned: "<#b3a37f>술을 익혔다"
  # 기억 창 안 글
  no-slot: "<#8f8164>기억할 자리가 없다"
  # 든 촉매로 쓸 술이 없을 때 (부제목)
  none: "<#858079>기억한 술이 없다"

item:
  # 설명 칸 바탕이 어두워 핏빛 글씨는 읽히지 않는다. 앞의 짧은 표시만 핏빛으로
  unfit: "<#a8301f>× <#8f8164>제대로 다룰 수 없다"

origin:
  title: "너는 누구였나"

ending:
  rekindle: "불을 잇는다"
  leave-cold: "식은 채로 둔다"

build:
  # 세계를 짓는 동안 접속을 거절할 때
  refuse: "세계를 짓는 중이다. 잠시 뒤에 다시 오라."

pack:
  # 리소스팩 창에 뜨는 글
  prompt: "<#b3a37f>이 서버는 전용 리소스팩이 있어야 들어올 수 있다."
  declined: "<#b3a37f>리소스팩을 받지 않으면 들어올 수 없다."
  failed: "<#b3a37f>리소스팩을 받지 못했다. 다시 들어와 보라."

hud:
  # 행동 막대 한 줄
  souls: "<#b3a37f>소울 <n>"
  # 술의 자원 (M5 의 첫 꼴, 10.2). <n> 지금, <m> 최대
  warmth: "<#b3a37f>온기 <n>/<m>"
