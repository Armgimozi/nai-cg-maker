# 고유 이름과 용어의 영어 표기 (부록 B, ART_DIRECTION.md "영어판"). 한 번 정하면 바꾸지 않는다.
# 사람·장소의 소리 이름은 소리대로 옮기되 영어로 읽기 쉬운 철자로 (흐롤프 → Hrolf). 뜻으로 지은 이름은 뜻으로 옮긴다
# (식은 가마 → the Cold Kiln, 탑옥 → Gaol Tower).
# tools/textlint.py 가 본다: ko.yml 의 한 열쇠에 왼쪽 이름이 있으면 en.yml 의 같은 열쇠에 오른쪽 이름이 있어야 한다
# (대소문자는 가리지 않는다). 긴 이름이 먼저 맞는다 (오스윈의 저녁 종 → Oswin's Evening Bell, 그다음 오스윈).
# 플러그인은 이 파일을 읽지 않는다.

