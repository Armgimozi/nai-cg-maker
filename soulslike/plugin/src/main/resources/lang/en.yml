  rest: "<#d1c3a0>Rest"
  warp: "<#d1c3a0>Cross the Fire"
  leave: "<#d1c3a0>Rise"
  status: "<#b3a37f>Souls <souls> · Level <level>"
  test-name: "<#d1c3a0>Bonfire Beneath the Gaol Tower"

