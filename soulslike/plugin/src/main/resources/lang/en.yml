# In-game text, English (10.3, 10.9, 12.5). Korean (lang/ko.yml) is the source; this file is written apart from it,
# not translated line by line. The keys must be the same as in ko.yml, with the same style tag and the same <slots>.
#
# Voice: terse, dry, a little archaic. No exclamation marks, no hype words (legendary, ultimate, epic, mighty ...),
# no modern slang, no "you can ..." explanations. tools/textlint.py checks this.
# Names are fixed in lang/names.yml (Hrolf, Redin, Oswin ...). Terms: bonfire, Estus, souls, warmth (the resource of
# rites), rite (술), memory (기억 칸), catalyst, bloodstain, fog gate, parry, roll, foe (적), guard (막기).
# One word, one thing: "fires" (plural, lower case) are the bonfires as a network (Pass Between Fires); "the Fire"
# (capital) is the kiln's great fire and is used only in ending.*.
# Big titles are in capitals, as YOU DIED is. Menu buttons are in title case. Mind the width of each slot
# (tools/langcheck.py measures every line against its slot, e.g. a title must stay under 104 pixels).

