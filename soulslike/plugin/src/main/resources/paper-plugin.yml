name: Soulslike
version: '${version}'
main: kr.souls.Souls
bootstrapper: kr.souls.SoulsBootstrap
api-version: '1.21.11'
description: 소울류 서버 (가제 식은 가마)
authors: [souls]
# 명령어는 paper-plugin.yml 에 적지 않는다. Brigadier(LifecycleEvents.COMMANDS)로 등록한다
permissions:
  souls.admin:
    description: /souls 관리자 명령어
    default: op
  souls.test:
    description: /soulstest 시험 명령어 (config 의 debug.test-mode 가 켜졌을 때만)
    default: op
  souls.build:
    description: 창작 모드에서 souls_world 의 블록을 고칠 수 있다
    default: op
