# 식은 가마 서버 설정 (마인크래프트 1.21.11 / Paper). 값은 DESIGN.md 12.7 그대로다.
# 서버를 처음 켜면 마인크래프트가 이 파일을 다시 쓴다 (값은 남고 이 주석은 사라진다).
# 1.21.11 에는 pvp 와 allow-nether 가 없다. 플러그인이 게임 규칙(pvp=false 등)으로 건다.
# 리소스팩도 여기가 아니라 플러그인이 보낸다 (plugins/Soulslike/config.yml 의 pack).
gamemode=adventure
force-gamemode=true
# normal 이 중요하다 (피격 대기열, 3.9). 플러그인이 켤 때 확인하고 다르면 바꾼다
difficulty=normal
spawn-protection=0
view-distance=10
simulation-distance=6
# 구르기 속도가 '비행' 추방에 걸리지 않게 켠다
allow-flight=true
# 정품 계정만 들어온다
online-mode=true
enforce-secure-profile=false
generate-structures=false
# 로비(world)는 빈 공허다. 게임 세계 souls_world 는 플러그인이 코드로 짓는다
level-type=minecraft\:flat
generator-settings={"layers"\:[{"block"\:"minecraft\:air","height"\:1}],"biome"\:"minecraft\:the_void","features"\:false,"lakes"\:false,"structure_overrides"\:[]}
max-players=4
# 아무도 없으면 60초 뒤 서버가 쉰다 (1.21.11 기본값). 세계를 짓는 동안만 플러그인이 막는다
pause-when-empty-seconds=60
# 아래 셋은 12.7 밖의 기본값. 로비 세계 폴더 이름은 플러그인이 기대하는 world 그대로 둔다
level-name=world
server-port=25565
# 서버 목록에 보이는 이름: 식은 가마 (회색). 한글은 \u 로 적어 메모장으로 고쳐도 깨지지 않게 한다
motd=\u00a77\uc2dd\uc740 \uac00\ub9c8
