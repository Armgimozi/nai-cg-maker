<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- clover: lucky four-leaf clover with a curly stem, leaf seams, veins and a shine. -->
  <defs>
    <path id="leaf" d="M0,-4 C-12,-14 -46,-30 -42,-58 C-39,-78 -12,-80 0,-60 C12,-80 39,-78 42,-58 C46,-30 12,-14 0,-4 Z"/>
    <g id="clo">
      <use href="#leaf" transform="translate(124,112) rotate(0)"/>
      <use href="#leaf" transform="translate(124,112) rotate(90)"/>
      <use href="#leaf" transform="translate(124,112) rotate(180)"/>
      <use href="#leaf" transform="translate(124,112) rotate(270)"/>
    </g>
    <path id="stem" fill="none" stroke-linecap="round" d="M130,120 Q150,170 190,190 Q206,198 204,214"/>
    <mask id="cm"><use href="#clo" fill="#fff"/></mask>
  </defs>
  <g transform="rotate(-10 128 128)">
    <g fill="#1E1B2E" stroke="#1E1B2E" stroke-linejoin="round">
      <g transform="translate(0,7)"><use href="#clo" stroke-width="24"/><use href="#stem" fill="none" stroke-width="38"/></g>
      <use href="#clo" stroke-width="24"/>
      <use href="#stem" fill="none" stroke-width="38"/>
    </g>
    <use href="#stem" stroke="#2E9E45" stroke-width="14"/>
    <path d="M136,134 Q150,166 180,182" fill="none" stroke="#7EE893" stroke-width="4" stroke-linecap="round"/>
    <use href="#clo" fill="#2E9E45"/>
    <g mask="url(#cm)"><use href="#clo" transform="translate(-6,-8)" fill="#4CD964"/></g>
    <!-- seams between leaves (thin ink, same as inner detail lines elsewhere) -->
    <g fill="none" stroke="#1E1B2E" stroke-width="5" stroke-linejoin="round">
      <use href="#leaf" transform="translate(124,112) rotate(0)"/>
      <use href="#leaf" transform="translate(124,112) rotate(90)"/>
      <use href="#leaf" transform="translate(124,112) rotate(180)"/>
      <use href="#leaf" transform="translate(124,112) rotate(270)"/>
    </g>
    <!-- veins: light, short, not touching the centre -->
    <g stroke="#2E9E45" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M124,96 V74"/>
      <path d="M140,112 H162"/>
      <path d="M124,128 V150"/>
      <path d="M108,112 H86"/>
    </g>
    <!-- shine -->
    <path d="M92,48 A30,30 0 0 0 86,74" fill="none" stroke="#DFFFE4" stroke-width="9" stroke-linecap="round"/>
    <path d="M46,94 A26,26 0 0 1 60,76" fill="none" stroke="#DFFFE4" stroke-width="8" stroke-linecap="round"/>
  </g>
  <path d="M206,28 Q209,46 226,50 Q209,54 206,72 Q203,54 186,50 Q203,46 206,28 Z" fill="#fff" stroke="#1E1B2E" stroke-width="7" stroke-linejoin="round"/>
</svg>
