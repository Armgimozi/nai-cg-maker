<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- sunburst: 12 wide + 12 thin white rays, fading out toward the edge. Tint with ImageColor3,
       rotate slowly behind a reveal. Rotationally symmetric every 30 degrees. -->
