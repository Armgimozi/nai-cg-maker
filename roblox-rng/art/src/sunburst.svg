    <path d="M256,256 L321.4,-36.8 L345.7,-30.3 Z M256,256 L459.1,35.2 L476.8,52.9 Z M256,256 L542.3,166.3 L548.8,190.6 Z M256,256 L548.8,321.4 L542.3,345.7 Z M256,256 L476.8,459.1 L459.1,476.8 Z M256,256 L345.7,542.3 L321.4,548.8 Z M256,256 L190.6,548.8 L166.3,542.3 Z M256,256 L52.9,476.8 L35.2,459.1 Z M256,256 L-30.3,345.7 L-36.8,321.4 Z M256,256 L-36.8,190.6 L-30.3,166.3 Z M256,256 L35.2,52.9 L52.9,35.2 Z M256,256 L166.3,-30.3 L190.6,-36.8 Z" opacity=".7"/>
