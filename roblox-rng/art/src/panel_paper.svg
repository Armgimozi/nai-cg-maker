<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- panel_paper: 9-slice window background - cream passport paper. SliceCenter (64,64,192,192).
       Thick Ink outline (12px), faint dot grain, warm bottom edge, thin dashed stitch border inset 28px. -->
  <defs>
    <mask id="paper"><rect x="14" y="14" width="228" height="228" rx="34" fill="#fff"/></mask>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
      <g fill="#D9C094" opacity=".38">
        <circle cx="4" cy="6" r="1.3"/><circle cx="19" cy="3" r="1"/><circle cx="27" cy="14" r="1.4"/>
        <circle cx="11" cy="17" r="1"/><circle cx="6" cy="27" r="1.2"/><circle cx="22" cy="25" r="1.1"/>
        <circle cx="15" cy="10" r=".8"/><circle cx="30" cy="30" r=".9"/>
      </g>
    </pattern>
  </defs>
  <rect x="2" y="2" width="252" height="252" rx="46" fill="#1E1B2E"/>
  <rect x="14" y="14" width="228" height="228" rx="34" fill="#FFF4DC"/>
  <g mask="url(#paper)">
    <rect x="0" y="0" width="256" height="256" fill="url(#grain)"/>
    <!-- warm bottom edge + light top edge (inside the top/bottom slices) -->
    <rect x="0" y="228" width="256" height="28" fill="#F2DDB0"/>
    <rect x="0" y="0" width="256" height="22" fill="#FFFBF0"/>
  </g>
  <rect x="30" y="30" width="196" height="196" rx="20" fill="none" stroke="#E0BE86" stroke-width="4" stroke-dasharray="12 8" stroke-linecap="round"/>
</svg>
