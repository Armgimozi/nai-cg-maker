<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- tag: 9-slice small label / badge. SliceCenter (64,64,192,192). White-grey, tint with ImageColor3.
       Flatter than button_face: thin gloss, thin lip, slightly squarer corners (radius 34 inside). -->
  <defs>
    <mask id="body"><rect x="14" y="14" width="228" height="228" rx="32" fill="#fff"/></mask>
  </defs>
  <rect x="2" y="2" width="252" height="252" rx="44" fill="#1E1B2E"/>
  <rect x="14" y="14" width="228" height="228" rx="32" fill="#EDEDED"/>
  <g mask="url(#body)">
    <rect x="0" y="0" width="256" height="40" fill="#FFFFFF"/>
    <rect x="0" y="222" width="256" height="34" fill="#C8C8C8"/>
  </g>
</svg>
