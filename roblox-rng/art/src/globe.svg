<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- globe: desk globe (지구본) - blue sphere, green continents, gold meridian arc + stand. -->
  <defs>
    <path id="base" stroke-linejoin="round" d="M70,226 C70,206 94,198 128,198 C162,198 186,206 186,226 Z"/>
    <path id="arc" fill="none" stroke-linecap="round" d="M102.1,25.2 A80,80 0 0 1 129.9,182.8"/>
    <mask id="sph"><circle cx="116" cy="104" r="64" fill="#fff"/></mask>
    <mask id="shade">
      <circle cx="116" cy="104" r="64" fill="#fff"/>
      <circle cx="104" cy="92" r="64" fill="#000"/>
    </mask>
    <mask id="basem"><use href="#base" fill="#fff" stroke="#fff" stroke-width="8"/></mask>
  </defs>
  <!-- outline + depth -->
  <g fill="#1E1B2E" stroke="#1E1B2E">
    <g transform="translate(0,7)">
      <use href="#base" stroke-width="32"/>
      <rect x="116" y="170" width="28" height="40" stroke-width="0"/>
    </g>
    <use href="#base" stroke-width="32"/>
    <rect x="110" y="170" width="40" height="40" rx="6" stroke-width="0"/>
    <use href="#arc" fill="none" stroke-width="40"/>
    <circle cx="116" cy="104" r="76" stroke-width="0"/>
  </g>
  <!-- stand -->
  <rect x="121" y="178" width="18" height="28" fill="#D9900F"/>
  <use href="#base" fill="#D9900F" stroke="#D9900F" stroke-width="8"/>
  <g mask="url(#basem)"><use href="#base" transform="translate(-3,-6)" fill="#FFC53D" stroke="#FFC53D" stroke-width="8"/></g>
  <path d="M92,212 C98,206 108,204 118,204" fill="none" stroke="#FFF6D6" stroke-width="7" stroke-linecap="round"/>
  <!-- meridian arc -->
  <use href="#arc" stroke="#D9900F" stroke-width="16"/>
  <path d="M109,26 A80,80 0 0 1 192,82" fill="none" stroke="#FFC53D" stroke-width="8" stroke-linecap="round" transform="translate(-2,-2)"/>
  <!-- sphere -->
  <circle cx="116" cy="104" r="64" fill="#39A0FF"/>
  <g mask="url(#sph)" fill="#4CD964">
    <!-- americas-ish -->
    <path d="M58,62 C72,50 96,52 102,64 C108,76 94,82 96,94 C98,108 112,112 108,128 C104,146 92,160 84,170 C78,150 70,136 58,128 C46,112 44,76 58,62 Z"/>
    <!-- europe/africa-ish -->
    <path d="M128,52 C140,44 164,46 172,58 C178,70 166,74 170,86 C176,102 188,112 176,132 C166,150 150,154 144,142 C138,128 144,116 134,106 C124,98 118,84 124,74 C128,66 120,58 128,52 Z"/>
    <path d="M150,160 C160,156 172,160 170,168 C160,174 150,170 150,160 Z"/>
  </g>
  <!-- shade crescent -->
  <circle cx="116" cy="104" r="64" fill="#10306E" opacity=".38" mask="url(#shade)"/>
  <!-- highlight -->
  <path d="M68,92 A50,50 0 0 1 100,54" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".9"/>
  <circle cx="114" cy="48" r="6" fill="#fff" opacity=".9"/>
  <!-- axle pin -->
  <circle cx="129.9" cy="182.8" r="8" fill="#FFC53D" stroke="#1E1B2E" stroke-width="5"/>
</svg>
