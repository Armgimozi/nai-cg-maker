<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- star_empty: unearned star slot. Same silhouette as star.svg, dark sunken fill. -->
  <defs>
    <polygon id="s" stroke-linejoin="round" points="128,44 155.2,99.6 216.6,108.4 172.3,151.6 182.7,212.8 128,184 73.3,212.8 83.7,151.6 39.4,108.4 100.8,99.6"/>
    <mask id="m"><use href="#s" fill="#fff" stroke="#fff" stroke-width="24"/></mask>
  </defs>
  <g fill="#1E1B2E" stroke="#1E1B2E" stroke-width="48">
    <use href="#s" transform="translate(0,7)"/>
    <use href="#s"/>
  </g>
  <!-- sunken: dark rim on the TOP-left (inverse of star), lighter body -->
  <use href="#s" fill="#2E2A44" stroke="#2E2A44" stroke-width="24"/>
  <g mask="url(#m)">
    <use href="#s" transform="translate(5,8)" fill="#57527A" stroke="#57527A" stroke-width="24"/>
  </g>
  <path d="M150,190 L178,206" fill="none" stroke="#7D77A6" stroke-width="9" stroke-linecap="round"/>
</svg>
