<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- star: rating star, gold. Rounded points come from a same-colour round-join stroke. -->
  <defs>
    <polygon id="s" stroke-linejoin="round" points="128,44 155.2,99.6 216.6,108.4 172.3,151.6 182.7,212.8 128,184 73.3,212.8 83.7,151.6 39.4,108.4 100.8,99.6"/>
    <mask id="m"><use href="#s" fill="#fff" stroke="#fff" stroke-width="24"/></mask>
  </defs>
  <g fill="#1E1B2E" stroke="#1E1B2E" stroke-width="48">
    <use href="#s" transform="translate(0,7)"/>
    <use href="#s"/>
  </g>
  <use href="#s" fill="#D9900F" stroke="#D9900F" stroke-width="24"/>
  <g mask="url(#m)">
    <use href="#s" transform="translate(-6,-9)" fill="#FFC53D" stroke="#FFC53D" stroke-width="24"/>
  </g>
  <!-- highlight: streak up the left arm + glint dot -->
  <path d="M58,114 L96,108" fill="none" stroke="#FFF6D6" stroke-width="11" stroke-linecap="round"/>
  <path d="M110,84 L121,62" fill="none" stroke="#FFF6D6" stroke-width="10" stroke-linecap="round"/>
  
</svg>
