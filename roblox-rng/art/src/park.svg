<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- park: grassy mound with a big round tree, a small bush and flowers. -->
  <defs>
    <path id="mound" d="M20,216 C28,176 76,160 128,160 C180,160 228,176 236,216 Q236,224 228,224 H28 Q20,224 20,216 Z"/>
    <g id="crown">
      <circle cx="104" cy="84" r="50"/>
      <circle cx="70" cy="112" r="34"/>
      <circle cx="142" cy="108" r="38"/>
      <circle cx="104" cy="124" r="38"/>
    </g>
    <g id="bush">
      <circle cx="184" cy="162" r="26"/>
      <circle cx="210" cy="172" r="20"/>
      <circle cx="162" cy="176" r="18"/>
    </g>
    <mask id="crm"><use href="#crown" fill="#fff"/></mask>
    <mask id="bm"><use href="#bush" fill="#fff"/></mask>
    <mask id="mm"><use href="#mound" fill="#fff"/></mask>
  </defs>
  <g fill="#1E1B2E" stroke="#1E1B2E" stroke-width="24" stroke-linejoin="round">
    <g transform="translate(0,7)"><use href="#mound"/></g>
    <use href="#mound"/>
    <rect x="92" y="120" width="28" height="70" rx="6"/>
    <use href="#crown"/>
    <use href="#bush"/>
  </g>
  <!-- mound -->
  <use href="#mound" fill="#2E9E45"/>
  <g mask="url(#mm)"><use href="#mound" transform="translate(0,-10)" fill="#4CD964"/></g>
  <!-- trunk -->
  <rect x="92" y="120" width="28" height="70" rx="6" fill="#A65E22"/>
  <rect x="92" y="120" width="16" height="70" rx="6" fill="#D98A3D"/>
  <!-- bush -->
  <use href="#bush" fill="#2E9E45"/>
  <g mask="url(#bm)"><use href="#bush" transform="translate(-4,-6)" fill="#4CD964"/></g>
  <!-- crown -->
  <use href="#crown" fill="#2E9E45"/>
  <g mask="url(#crm)"><use href="#crown" transform="translate(-7,-10)" fill="#4CD964"/></g>
  <path d="M68,70 A44,44 0 0 1 104,42" fill="none" stroke="#B8F5C3" stroke-width="10" stroke-linecap="round"/>
  <circle cx="118" cy="44" r="5.5" fill="#B8F5C3"/>
  <path d="M176,150 A18,18 0 0 1 190,142" fill="none" stroke="#B8F5C3" stroke-width="7" stroke-linecap="round"/>
  <!-- fruit / blossoms -->
  <g fill="#FF5E5B" stroke="#1E1B2E" stroke-width="4">
    <circle cx="134" cy="92" r="7"/>
    <circle cx="82" cy="120" r="7"/>
    <circle cx="118" cy="130" r="6"/>
  </g>
  <!-- flowers on mound -->
  <g fill="#FFF4DC" stroke="#1E1B2E" stroke-width="4">
    <circle cx="48" cy="198" r="6"/>
    <circle cx="150" cy="206" r="6"/>
    <circle cx="206" cy="204" r="6"/>
  </g>
  <g fill="#FFC53D"><circle cx="48" cy="198" r="2.5"/><circle cx="150" cy="206" r="2.5"/><circle cx="206" cy="204" r="2.5"/></g>
</svg>
