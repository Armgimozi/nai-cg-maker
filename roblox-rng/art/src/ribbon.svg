<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- ribbon: 9-slice title banner with folded, notched tails. SliceCenter (64,64,192,192).
       White/grey so ImageColor3 sets the colour: band #E6E6E6, gloss #FFFFFF, lip #C4C4C4,
       tails #BDBDBD, folds #A8A8A8. Tails + folds live entirely in the left/right slices.
       Use SliceScale = height/256 so it only stretches sideways (band = y 40..160 of 256). -->
  <defs>
    <path id="tailL" stroke-linejoin="round" d="M64,92 H6 L30,144 L6,196 H64 Z"/>
    <path id="tailR" stroke-linejoin="round" d="M192,92 H250 L226,144 L250,196 H192 Z"/>
    <rect id="band" x="52" y="40" width="152" height="120" rx="14"/>
    <mask id="bm"><use href="#band" fill="#fff"/></mask>
  </defs>
  <g fill="#1E1B2E" stroke="#1E1B2E" stroke-width="20" stroke-linejoin="round">
    <use href="#tailL"/><use href="#tailR"/><use href="#band"/>
  </g>
  <use href="#tailL" fill="#BDBDBD"/>
  <use href="#tailR" fill="#BDBDBD"/>
  <path d="M16,100 H44" stroke="#D9D9D9" stroke-width="6" stroke-linecap="round"/>
  <path d="M212,100 H240" stroke="#D9D9D9" stroke-width="6" stroke-linecap="round"/>
  <!-- folds -->
  <path d="M52,160 H64 V196 Z" fill="#A8A8A8" stroke="#1E1B2E" stroke-width="5" stroke-linejoin="round"/>
  <path d="M204,160 H192 V196 Z" fill="#A8A8A8" stroke="#1E1B2E" stroke-width="5" stroke-linejoin="round"/>
  <!-- band -->
  <use href="#band" fill="#E6E6E6"/>
  <g mask="url(#bm)">
    <rect x="0" y="0" width="256" height="60" fill="#FFFFFF"/>
    <rect x="0" y="144" width="256" height="30" fill="#C4C4C4"/>
  </g>
</svg>
