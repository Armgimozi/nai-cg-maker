<svg xmlns="http://www.w3.org/2000/svg" width="224" height="200" viewBox="0 0 56 50">
  <!-- ribbon_tail_r: right V-notched tail (mirror of ribbon_tail_l) behind the code-drawn title plate (Ui.ribbon). Not 9-sliced:
       shown at a fixed 56:50 ratio, so the notch never gets squashed. Grey so ImageColor3 (plate face colour)
       sets the colour: tail #C8C8C8, gloss #FFFFFF, fold #7D7D7D. The left ~20 units hide behind the plate. -->
  <g transform="translate(56,0) scale(-1,1)">
  <g stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round">
    <path d="M54,5 H3 L16,23 L3,41 H54 Z" fill="#C8C8C8"/>
    <path d="M34,33 H54 V47 Z" fill="#7D7D7D"/>
  </g>
  <path d="M9,10 H34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
