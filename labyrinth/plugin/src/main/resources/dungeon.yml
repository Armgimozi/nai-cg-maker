# ─────────────────────────────────────────────────────────────
#  미궁 진행 설정 (dungeon+party 모듈) — plugins/Labyrinth/dungeon.yml
#  수정 후 /labadmin reload 로 다시 읽는다 (진행 중인 인스턴스는 다음 입장부터 적용).
#  서버 난이도·파티 인원 배율은 config.yml (difficulty / party) 에 있다.
# ─────────────────────────────────────────────────────────────
version: 1

# 블록 배치/정리 틱당 상한 (서버가 약하면 낮춘다)
blocks_per_tick: 4000
# 동시에 열 수 있는 인스턴스 수
max_instances: 32
# 서버 시작 때 labyrinth_world 의 지역 파일을 비운다 (이전 세션이 남긴 층 블록 정리). 공허 월드 전용 — 다른 월드는 절대 건드리지 않음
reset_world_on_startup: true
# 지하 1층 바닥 높이와 층 사이 간격 (B1 → B10 으로 갈수록 실제로 내려간다)
top_floor_y: 280
floor_spacing: 30
# 온라인 파티원이 하나도 없는 인스턴스는 이 시간(초) 뒤 정리
empty_instance_timeout: 30
# 층 시작 카운트다운(초)
start_countdown: 3
# 전투방 문이 닫히기 전 대기(초)
room_lock_delay: 2
# 전투방 몹 수 = floors.yml mob_density × party_mob_count[인원] × (1 + mob_count_per_member × (인원−1)), 최대 max_mobs_per_room
mob_count_per_member: 0.15
max_mobs_per_room: 14
# 솔로·2인 전투방 몹 수 배율 (인원: 배율, 없는 인원은 1.0). 정예방 호위도 같은 배율(최소 1마리)
#   이 묶음이 없거나 비어 있으면 아래 값을 쓴다 (예전 dungeon.yml 도 적용). 끄려면 enabled: false
party_mob_count:
  enabled: true
  1: 0.7
  2: 0.9
# 줄어든 만큼 그 방 몹 한 마리당 경험치·골드·드롭 확률 보정 (배율 없이 나왔을 수 ÷ 실제 수 → 방 하나의 보상은 그대로)
party_mob_reward: true
# 전투방·정예방을 정리하면 살아 있는 파티원 HP 를 최대 HP 의 이 비율만큼 회복 (0 = 끔)
room_clear_heal: 0.15
# 휴식방 도착 시 HP/MP 회복 비율
rest_heal: 0.5
# 층 첫 돌파 보너스 경험치: 그 층을 처음 깬 파티원에게 한 번, 그 층 레벨 구간(floors.yml level_range) 필요 경험치 합 × 이 값
#   (난이도 배율 없음, 0 = 끔)
first_clear_bonus: 0.4
# 보스 구현이 아직 없는 층: 그 층 정예 몹을 보스 배율로 대신 세운다
boss_fallback:
  hp_mult: 6.0
  damage_mult: 1.25
# 보스 처치 후 계단을 안 내려온 파티원을 자동으로 내려보내기까지(초)
stairs_wait_seconds: 120
# 마지막 층(지하 10층) 클리어 후 귀환까지(초)
final_floor_return_seconds: 25
# 전멸 후 귀환까지(초)
wipe_return_seconds: 5
# 보물방 (+ 미로 상자 미믹 — 막다른 길 상자의 미믹 확률은 floors.yml chests.mimic)
treasure:
  chests: 3
  mimic_chance: 0.3
  mimic_mobs: 2              # 미믹이 부르는 몹 수 (미로 상자는 + 층/4)
  mimic_lock_seconds: 30     # 미로 미믹 상자가 잠겨 있는 최대 초 (몹을 다 잡으면 바로 풀림 → 한 단계 좋은 상자)
# 미로 함정 (층별 종류·밀도는 floors.yml traps, GDD §5.5)
traps:
  disarm_seconds: 3          # 함정 칸 옆에서 웅크린 채 이만큼 → 해제
  shadow_disarm_seconds: 1   # 그림자 직업 해제 시간
  shadow_sense_radius: 10    # 그림자 직업이 함정 윤곽을 보는 거리
  disarm_gold: 6             # 해제 보상 골드 × 층 (난이도·인원 골드 배율 적용)
  disarm_xp: 0.5             # 해제 보상 경험치 = 층 일반 몹 평균 경험치 × 이 값
# 관전자가 살아 있는 파티원에게서 벗어날 수 있는 거리
spectator_leash: 28
# 도랑(물/용암)에 빠지거나 바닥 아래로 떨어지면 최대 HP 비율 피해 + 근처 바닥으로 이동
fall_damage: 0.10
# 입장 시 파티원이 입구 근처에 있어야 하는가 (반경은 config.yml entrance.radius)
require_near_entrance: true
