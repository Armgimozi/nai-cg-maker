# ─────────────────────────────────────────────────────────────
#  미궁 라비린스 (Labyrinth) — 서버 설정
#  수정 후 /labadmin reload 로 다시 읽는다 (진행 중인 인스턴스는 다음 입장부터 적용).
# ─────────────────────────────────────────────────────────────

# 서버 난이도: easy | normal | hard | nightmare
# 비어 있으면 처음 접속한 관리자에게 초기 설정 안내가 뜨고, 정하기 전까지 미궁 입장이 막힌다.
# 콘솔: /labadmin setup <난이도>   변경: /labadmin difficulty <난이도>
difficulty: ""

# 난이도 프리셋 — hp/damage: 몹·보스 배율, drop: 드롭 확률, xp: 경험치, telegraph: 경고 시간(windup) 배율
#   난이도마다 배율 한 벌 — 1층부터 마지막 층까지 같은 값 (보스 패턴 배율도 난이도마다 하나).
#   어려움·악몽은 밸런스 시뮬레이터로 고른 값: 악몽 1층 솔로(숙련) 클리어율 약 50%, 깊은 층일수록 여전히 가장 어렵다.
#   0.3.2 에서 그대로 둔 값(어려움 1.5/1.4/0.85 · 악몽 2.4/2.0/0.7 과 그때의 ramp 묶음)은 자동으로 위 새 값으로 바뀐다
#   (예전 값을 1층부터 그대로 쓰려면 그 줄에 ramp: false 를 함께 적는다).
#   0.3.5: 어려움 HP 1.4 → 1.45 (공격 게이지가 없어져 1층이 쉬워진 만큼). 0.3.4 의 1.4 를 그대로 둔 서버는 자동으로 1.45 가 된다.
#   (선택) ramp: {from_floor: 1, full_floor: 5, start: {hp: 1.2, damage: 1.1, telegraph: 0.95}} 처럼 직접 적으면 층 램프를 쓸 수 있다
#         — from_floor 층에서 start 값으로 시작해 full_floor 층부터 위의 값 (hp·damage·telegraph 와 보스 패턴 배율만, 보상은 1층부터).
difficulties:
  easy:      {name: "쉬움",   hp: 0.7, damage: 0.6, drop: 1.0, xp: 1.0, telegraph: 1.3}
  normal:    {name: "보통",   hp: 1.0, damage: 1.0, drop: 1.0, xp: 1.0, telegraph: 1.0}
  hard:      {name: "어려움", hp: 1.45, damage: 1.3, drop: 1.0, xp: 1.0, telegraph: 0.9}
  nightmare: {name: "악몽",   hp: 1.8, damage: 1.6, drop: 1.0, xp: 1.0, telegraph: 0.85}

# 파티 — 인원 n 명일 때 몹 HP ×(1 + hp_per_member×(n−1)), 피해 ×(1 + dmg_per_member×(n−1)),
#         골드·드롭 ×(1 + reward_per_member×(n−1))
#   솔로(1명)일 때만 몹·보스 HP ×solo_hp, 피해 ×solo_damage (보상은 그대로). 끄려면 둘 다 1.0
party:
  max_size: 5               # 최대 인원 (0.3.5.1 부터 5 — 예전 기본값 10 이 남아 있으면 5 로 읽음)
  hp_per_member: 0.6
  dmg_per_member: 0.08
  reward_per_member: 0.05
  solo_hp: 0.85
  solo_damage: 0.85
  invite_timeout: 60        # 초

# 미궁 전용 공허 월드 (기존 지형은 절대 건드리지 않는다)
world:
  name: labyrinth_world

# 오버월드 입구 — /labadmin setentrance 로 지정. mode: block(작은 입구 구조물) | npc(NPC 만, 블록 변경 0)
#   | village(미리 지은 마을의 게이트 — 마을 월드를 처음 켤 때 자동으로 정해짐)
entrance:
  mode: ""
  world: ""
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0
  radius: 8                 # 파티 입장 시 파티원이 입구 근처에 있어야 하는 반경(블록)

# 미리 지은 마을 (VILLAGE.md) — 주 월드 폴더에 labyrinth-village.yml 이 있을 때만 켜진다 (서버팩의 world 폴더)
village:
  teleport_command: true     # /미궁 마을 로 광장 텔레포트
  block_mob_spawns: true     # 마을 둘레(반경 + 8칸) 적대 몹 자연 스폰 막기 — 아래 wild.spawns 가 monsters·all 이면 그쪽이 마을 월드 전체를 막는다
  blocks_per_tick: 4000      # village build 속도 (개발용)

# 야생 막기 (0.3.5.1) — 마을 밖 바닐라 요소를 막아 마을과 미궁에서 노는 서버로. 마을이 있는 world 폴더에서만 켜진다.
#   마을 월드 = 서버팩 world 폴더(마을이 지어진 주 월드). 미궁 월드는 이 설정과 상관없다.
#   키가 없으면 아래 값으로 켜지고, 통째로 끄려면 wild: false (바닐라 그대로). 고친 뒤 /labadmin reload · 상태는 /labadmin wild
wild:
  border: true          # 마을 둘레에 바닐라 월드 경계 (마을 + 보호 구역을 감싸는 정사각형). 경계 밖에 있던 사람은 광장으로 옮긴다
                        #   끄면(false) 플러그인이 정한 경계를 예전 경계로 되돌린다. /worldborder 로 직접 정한 경계는 건드리지 않는다
                        #   (기록: world 폴더 안 labyrinth-wild-border.yml). 플러그인을 빼거나 예전 판으로 내리기 전에 false 로 한 번 켜 둘 것
  border_margin: 30     # 마을 가장자리에서 몇 칸 더 (0 ~ 1000). 이 바깥에 지은 건물·상자는 갈 수 없게 되니 먼저 옮기세요
  spawns: all           # 마을 월드 자연 스폰 막기: all(적대 몹 + 동물) | monsters(적대 몹만) | none(막지 않음)
                        #   플레이어가 만든 것(번식·알·스폰 알·골렘 쌓기·명령)은 막지 않고, 이미 있는 동물은 그대로 둔다.
                        #   있던 바닐라 적대 몹은 켤 때와 청크를 불러올 때 치운다 (이름표·길들임·끈·알로 들인 몹은 그대로)
#   네더·엔드는 막지 않는다 (바닐라 그대로, 스폰도 그대로). 차원문·엔드에서 돌아올 때 경계 밖이면 광장으로 옮긴다.
#   예전 village.block_mob_spawns 는 spawns: none 일 때만 따로 쓰인다 (all·monsters 가 이미 마을 월드 전체를 막음)

# 초기 설정 — true 면 op 가 아니어도 서버 난이도를 정하거나 바꿀 수 있다 (/미궁 난이도, 처음 접속 시 설정 창).
setup:
  everyone_can_set_difficulty: true

# UI — HUD 바·메뉴 배경을 리소스팩 커스텀 폰트로 그린다.
# 화면 아래에 네모 박스(□□□)가 보이면 false 로 바꾸고 /labadmin reload 하세요 (글자 HUD 로 대체).
ui:
  use_glyphs: true

# 화면 글 — 스킬을 쓸 때 화면 아래에 뜨는 알림 줄
hud:
  skill_messages: false     # true 면 시전 성공·보호막·표식·도발 수 같은 알림도 띄움 (쿨다운·MP 부족·기절·침묵 같은 경고는 늘 보임)
  skill_bar_on_swap: false  # true 면 미궁 무기로 바꿔 들 때마다 스킬 키 줄을 띄움 (꺼도 /직업 스킬 로 언제든 볼 수 있음)

# 서버 목록 화면 아이콘 (jar 안 미궁 석문 아이콘). 설명 글은 server.properties 의 motd 를 그대로 쓴다.
server_list:
  icon: true

# 리소스팩 — 내장 HTTP 서버가 plugins/Labyrinth/pack/labyrinth-pack.zip 을 서빙한다.
pack:
  enabled: true
  same_port: true           # 리소스팩을 게임 포트(25565)로도 보낸다 → playit 같은 터널·포트포워딩은 게임 포트 하나면 충분
  port: 8163                # 같은 PC·와이파이용 내장 서버 (same_port 를 끄면 친구들도 이 포트로 받으니 열어야 함)
  bind: "0.0.0.0"
  public_host: ""           # 비우면 각 플레이어가 접속한 주소(도메인/IP)를 그대로 사용
  public_port: 0            # playit.gg 같은 터널: 8163 용 TCP 터널을 하나 더 만들고 그 주소를 public_host, 포트를 여기에
                            #   (같은 PC·와이파이로 들어온 사람은 자동으로 내장 주소를 씀)
  url: ""                   # 외부 호스팅 URL 을 쓰려면 여기에 (내장 서버를 끈다)
  sha1: ""                  # 외부 URL 일 때 SHA-1 (비우면 로컬 zip 으로 계산 시도)
  required: true
  kick_on_decline: false
  update_from_jar: true     # 플러그인 jar 에 들어 있는 팩이 더 새로우면 자동으로 꺼내 쓴다
  prompt: "<gradient:#c9a2ff:#7fd8ff>미궁 라비린스</gradient> <gray>전용 리소스팩입니다. 무기·몬스터·UI 가 모두 이 팩으로 보입니다.</gray>"

# 플레이어 데이터
data:
  autosave_minutes: 5

# 전투
combat:
  damage_numbers: true
  damage_number_ticks: 16
  base_crit_chance: 0.05
  base_crit_damage: 1.5
  # 낙하·불·익사·바닐라 몹 등 바닐라 피해를 '최대 HP 20 기준 비율'로 환산 (HP 가 커져도 바닐라처럼 위험하게)
  scale_vanilla_damage: true
  # 0.3.5 — 공격 게이지 없음: 서버가 무기마다 공격 간격을 지키고, 맞으면 언제나 온전한 피해 (무기 간격은 items.yml attack.interval)
  attack_interval_min: 0.25    # 민첩·공속을 다 쌓아도 이보다 빠르지 않다 (초)
  early_click_buffer: 0.35     # 간격이 끝나기 이 시간 안의 클릭은 기억했다가 끝나는 순간 넣는다 (0 = 끔)
  early_click_sound: true      # 너무 이른 클릭에 작은 '휙' 소리 (본인만)
  click_tolerance_ms: 50       # 이만큼 이른 클릭은 그냥 통과 (지연 보정)
  jump_crit: 1.2               # 떨어지며 친 근접 공격
  bow_full_draw_cue: true      # 활을 끝까지 당기면 작은 '탁' 소리 (본인만)

# 방어구 겉모습 장단점 (0.3.5) — 판금·가죽·천이 부위마다 같은 숨은 효과를 갖는다 (굴리지 않음, 희귀도·레벨·강화와 상관없음).
#   두 부위면 두 배, 판금 2 + 가죽 2 처럼 섞으면 반씩. 요구 능력치를 못 맞춘 부위는 숨은 효과도 4부위 수도 없다.
#   머리·몸·다리·발이 모두 같은 겉모습이면 4부위 효과 (방패는 판금 한 부위지만 4부위 수에는 안 든다).
#   수련생·길잡이 옷은 평상복 — 겉모습 효과가 없다. 악몽의 왕관은 어느 겉모습과도 4부위를 이룬다.
#   piece 키: 장비 스탯 키(더하기, 상한 그대로) 또는 defense_pct · hp_pct · mana_regen_pct · cooldown_pct (× (1 + 합)).
#   키가 없으면 아래 값. false 로 두면 겉모습 효과·4부위 효과가 모두 꺼진다 (요구 능력치는 그대로).
armor_looks:
  enabled: true
  full_pieces: 4
  shield_counts_as: heavy
  heavy:
    name: "판금"
    color: "#b8c4d6"
    piece:
      defense_pct: 0.04          # 최종 방어 × (1 + 합)
      damage_reduction: 0.005    # 받는 피해 감소 (상한 50% 그대로)
      move_speed: -0.02          # 이동 속도
      evasion: -0.01             # 회피 (0 아래로 안 내려감)
      cooldown_pct: 0.02         # 직업·무기 스킬 재사용 대기 × (1 + 합) — 재사용 감소와 따로 곱함
    full:
      name: "버팀"
      knockback_resist: 0.60     # 몬스터·함정·다른 플레이어에게 밀려나는 세기 −60% (힘의 저항과 더함, 상한 85%, 보스는 그대로)
      cc_resist: 0.40            # 기절·속박·빙결 시간 −40% (보스가 건 것은 그대로)
  light:
    name: "가죽"
    color: "#c9a46a"
    piece:
      evasion: 0.015
      crit_chance: 0.01
      attack_speed: 0.015        # 공격 속도 (합계 상한 +75% 안)
      move_speed: 0.01
      defense_pct: -0.06
    full:
      name: "구르기"
      double_tap: 0.30           # 웅크리기 키를 이 시간 안에 두 번 (누름-뗌-누름)
      distance: 3.5              # 움직이던 방향으로 (블록)
      back_distance: 2.0         # 방향 키를 안 누르고 있으면 뒤로
      iframe: 0.40               # 이 시간 동안 피할 수 있는 공격은 모두 회피 (보스 패턴·지속 피해는 못 피함)
      cooldown: 5.0              # 재사용 대기 (초)
      combo_guard: 0.40          # 웅크리기 조합 스킬을 쓴 뒤 이 시간 안이면 안 구름
      ready_sound: true          # 다시 쓸 수 있으면 본인에게만 작은 소리
  cloth:
    name: "천"
    color: "#b99cff"
    piece:
      skill_damage: 0.02
      cooldown_pct: -0.015
      mana_regen_pct: 0.06       # 초당 MP 재생 × (1 + 합)
      hp_pct: -0.02              # 최대 HP × (1 + 합)
    full:
      name: "마나 보호막"
      absorb: 0.20               # 받는 최종 피해의 20% 를 MP 가 대신 받는다 (지속 피해·고정 피해도)
      damage_per_mp: 2.0         # MP 1 = 피해 2
      off_below: 0.20            # MP 가 최대의 20% 아래면 쉰다 (스킬 쓸 MP 를 남김)

# 플레이어끼리 싸우기 (PvP) — 따로 신청하는 대전 없이 규칙 하나:
#   같은 파티원끼리는 야생·마을·미궁 어디서든 서로 피해를 줄 수 없고, 그 밖의 플레이어끼리는 피해를 줄 수 있다.
#   근접·화살·삼지창·직업 스킬·무기 스킬·장판·투척/잔류 물약·불·TNT·엔드 수정·길들인 늑대·낚싯대 모두 같은 규칙.
#   플러그인이 켤 때 모든 월드의 바닐라 PvP 규칙(게임 규칙 pvp)을 enabled 값으로 맞춘다 (server.properties 와 무관).
pvp:
  enabled: true
  # ── 피해 (0.3.5, pvp_spec) ─────────────────────────────────────────────────────
  # 플레이어 → 다른 파티 플레이어 피해 = 원피해 × 기준 배율 m(L) × 직업 보정 × 스킬 pvp_mult × (1 − 강인함) × HP ÷ (HP + 완충)
  #   L = 두 사람 중 높은 레벨. 방어 대신 강인함, 치명 추가 피해 × crit_damage_scale. 한 바퀴(스킬을 몰아 쓰기)로 쓰러뜨릴 수 있다.
  # 기본 대비 배율. 1.0 = 명세의 균형. 0.3.4 config 의 0.7(안 고친 값)은 1.0 으로, 고친 값 v 는 v ÷ 0.7 로 읽는다 (파일은 그대로).
  damage_multiplier: 1.0
  # 레벨 곡선: 기준 배율 = base × min(1, (ref_level ÷ L)^exponent) — Lv20 까지 2.0, Lv35 0.54, Lv50 0.23
  #   (공격 쪽은 레벨²보다 빨리 크고 HP 는 레벨에 비례해서, 그대로 두면 Lv50 한 바퀴가 Lv20 의 3~4배가 된다)
  level_curve: {base: 2.0, ref_level: 20, exponent: 2.35}
  # 완충 체력 B(L) — 모두에게 같은 양 (HP 가 적은 사람과 많은 사람의 차이를 줄임). Lv20 까지 레벨마다 42, 그 위 레벨마다 +12
  buffer_hp: {per_level_low: 42, knee_level: 20, per_level_high: 12}
  # 피해 공식의 방어를 PvP 에서 얼마나 셀지 (0 = 방어 대신 아래 강인함)
  defense_weight: 0.0
  # 강인함 R = cap × S ÷ (S + per_level × 대상 레벨), S = 체력(VIT) + 방어 → 받는 PvP 피해 × (1 − R). 최대 40%
  resilience: {cap: 0.40, per_level: 8}
  crit_damage_scale: 0.6       # 치명 '추가' 피해 × 0.6 (치명 피해 2.5 → 1.9)
  # 한 방 상한 (관리자용) = 맞는 사람 최대 HP × 이 값. 1.0 = 없음. 0.3.4 의 안 고친 0.35 는 1.0 으로 읽는다
  max_hit_ratio: 1.0
  # 직업 보정 (플레이어에게 주는 피해). 적지 않은 직업 = 1.0. 레벨대마다 따로: arcanist: {low: 1.2, mid: 1.1, high: 1.2}
  class_damage: {hunter: 0.9, arcanist: 1.2, shadow: 1.2}
  # 레벨대 경계 (두 사람 중 높은 레벨): mid 부터 mid, high 부터 high (그 아래 low)
  class_damage_levels: {mid: 28, high: 43}
  # ── 회복 · 보호막 ('PvP 전투 중' = 다른 파티 플레이어와 피해를 주고받은 지 combat_seconds 초 안) ──────────
  combat_seconds: 8
  healing: 0.6                 # 받는 모든 회복 (스킬·물약·장비·재생)
  potion: 0.6                  # 물약은 한 번 더 (0.6 × 0.6 = 36%)
  lifesteal: 0.5               # 플레이어를 때려 얻는 흡혈 — healing 대신 이 값
  shield: 0.8                  # 새로 얻는 보호막
  flat_heal_by_pool: true      # 고정량 회복(치유력·흡혈·재생)은 × 최대 HP ÷ (최대 HP + 완충) — 피해와 같은 단위로
  # 긴 싸움: 전투가 start 초 넘게 이어지면 받는 회복·보호막이 초마다 per_second 씩 줄어든다 (floor 까지)
  long_fight: {start: 20, per_second: 0.025, floor: 0.10}
  # ── 상태이상 (플레이어가 다른 파티 플레이어에게 건 것만. 몹·보스가 건 것은 그대로) ──────────────────────
  # 기절은 기절 그대로 — 시간만: 정신 감소 다음 × duration → max_seconds 까지 → 줄어듦 → 면역
  cc:
    duration: {stun: 0.8, frozen: 1.0, root: 0.8, silence: 0.8, blind: 0.7, slow: 1.0, cooldown_slow: 0.5}
    max_seconds: {stun: 1.0, frozen: 1.5, root: 1.5, silence: 1.5, blind: 1.5, slow: 3.0, cooldown_slow: 2.0}
    slow_max_potency: 0.5      # 플레이어에게 거는 둔화 세기 상한 (몹에게는 0.85)
    diminishing:
      window: 8                # 같은 분류를 이 시간(초) 안에 다시 맞으면
      steps: [1.0, 0.5, 0.25, 0.0]   # 첫 번째 100% → 50% → 25% → 면역 (window 동안 안 맞으면 처음으로)
      groups: {control: [stun, frozen], root: [root], silence: [silence], blind: [blind]}
    control_immunity: 2.0      # 기절·빙결이 끝난 뒤 이 시간(초) 동안 기절·빙결 면역
    min_seconds: 0.2           # 줄여서 이보다 짧으면 걸지 않는다 (그래도 횟수는 센다)
  # ── 그 밖 ─────────────────────────────────────────────────────────────────────
  # 마을 안은 PvP 금지 — 주 월드 폴더의 labyrinth-village.yml(마을 기능이 만든다) 중심에서 반경 radius + safe_zone_margin 칸.
  # 마을 파일이 없으면 이 설정은 아무 일도 하지 않는다.
  safe_zone_village: true
  safe_zone_margin: 8
  # 내 화면에서 파티원 이름표(·탭 목록 이름)를 초록색으로 (사람마다 자기 파티원이 초록)
  party_name_color: true

# 레벨 — 필요 경험치(L) = round(xp_a × L^xp_exp + xp_b)
level:
  max: 50
  start_points: 5         # Lv.1 에서 받는 스탯 포인트 (레벨업 전에도 /스탯 분배 가능). 이미 플레이하던 사람도 한 번 받는다
  points_per_level: 5
  xp_a: 40
  xp_exp: 1.6
  xp_b: 60

# 시작 꾸러미 — 직업을 처음 고를 때 플레이어당 한 번 (시작 무기와 함께). 직업을 바꿔도 다시 주지 않는다.
#   이미 직업이 있던 사람은 다음 접속 때 받되, Lv.5 이하이고 지하 1층을 깬 적이 없을 때만 (그 밖에는 받은 것으로 기록).
#   목록을 늘리면 이미 받은 사람(같은 조건)에게는 모자란 만큼만 더 준다. item 이 minecraft: 로 시작하면 바닐라 아이템.
#   키가 없으면 아래 기본 목록이 쓰이고, 끄려면 enabled: false
starter_kit:
  enabled: true
  gold: 300
  items:
    - {item: novice_cap, amount: 1}
    - {item: novice_tunic, amount: 1}
    - {item: novice_trousers, amount: 1}
    - {item: novice_boots, amount: 1}
    - {item: minor_healing_potion, amount: 10}
    - {item: minor_mana_potion, amount: 5}
    - {item: return_scroll, amount: 2}
    - {item: copper_pickaxe, amount: 1}

# 직업 변경 (최상위 키) — 첫 직업 선택은 무료. 그 뒤로 바꿀 때마다:
#   require_item: true 면 item(전직의 두루마리, 떠돌이 상인 핀이 판다) 1장이 사라진다.
#   cooldown_hours: 직업을 바꾼 뒤 이 시간 동안은 다시 바꿀 수 없다 (실제 시간 기준, 0 = 대기 없음). 첫 선택(무료)은 세지 않는다.
#   미궁 공략 중에는 언제나 바꿀 수 없다. 관리자 /labadmin setclass <플레이어> <직업|none> 은 이 제한을 받지 않는다.
#   키가 없으면 아래 기본값이 쓰이고, 끄려면 class_change: false
class_change:
  require_item: true
  item: class_change_scroll
  cooldown_hours: 24

# 죽을 때 (인벤세이브) — 야생·마을·네더·엔드 어디서 죽든 (PvP 포함)
#   keep_inventory: 소지품을 그대로 지니고 아무것도 떨구지 않는다. keep_level: 바닐라 경험치 레벨 유지 (경험치 구슬도 안 떨굼).
#   false 면 그 부분만 바닐라(게임 규칙 keepInventory)대로. 미궁 안에서는 이 값과 상관없이 떨구지 않는다 (아래 penalty 만 있음).
#   키가 없으면 둘 다 true.
# penalty — 죽음 페널티 (0.3.6.1). 이 블록이 없어도 아래 값으로 켜진다. 모두 끄기: penalty: false
#   xp_progress_reset: 어디서 죽든 지금 레벨에서 모은 경험치가 0 으로 (레벨은 안 내려감, 최고 레벨이면 그대로)
#   dungeon_item_loss: 미궁 공략 중 쓰러지면 가방(단축 칸 포함) slots_min ~ slots_max 칸을 통째로 잃는다. 떨어뜨리지 않고 사라진다.
#     손에 든 칸·입은 갑옷·장신구·보조손은 안전. 열쇠·문장·광산 곡괭이도 잃지 않는다. 끄기: dungeon_item_loss: false
#     safe_items: 잃지 않을 아이템을 더 적는다 (items.yml id 나 바닐라 이름, 예: [return_scroll, totem_of_undying])
#   combat_exit_seconds: 미궁 공략 중 싸우는 중(10초 안에 맞음)에 /미궁 퇴장·메뉴 '귀환' 을 쓰면 이 초만큼 기다렸다 나간다.
#     그동안 맞으면 끊긴다 (귀환 주문서와 같음). 죽기 직전에 나가서 페널티를 피하지 못하게. 0 = 예전처럼 바로 나감.
death:
  keep_inventory: true
  keep_level: true
  penalty:
    xp_progress_reset: true
    combat_exit_seconds: 5
    dungeon_item_loss:
      enabled: true
      slots_min: 2
      slots_max: 3
      safe_items: []

# 맨손 공격 속도 (초당 횟수). 0.3.5 부터 무기는 저마다 items.yml attack.interval 을 쓰고, 이 표는 none(맨손)만 읽는다.
#   공격 속도 스탯 = 민첩 0.5%/점(최대 +45%) + 장비·버프, 합계 최대 +75% — 간격 ÷ (1 + 공격 속도).
weapon_attack_speed:
  none: 1.6

# 강화 — 대장장이 두르간의 [강화] (GDD §11.13). 미궁 무기·방어구·방패만 (장신구·바닐라 장비는 강화 불가).
# 목록은 목표 단계 +1, +2, … 순서. 모자라면 마지막 값을 계속 쓴다.
enhance:
  enabled: true
  max_level: 10
  # 성공 확률 (+1 ~ +10). 기본: +1~+4 확정, 그 뒤로 점점 줄어드는 '매운 맛'
  chances: [1.0, 1.0, 1.0, 1.0, 0.90, 0.80, 0.65, 0.50, 0.35, 0.20]
  # 현재 단계가 이 값 이상일 때 실패하면 한 단계 내려간다 (파괴는 없음). 0 = 하락 없음.
  # 실패하면 골드·강화석·재료는 언제나 사라진다. 보호 주문서를 켜 두면 하락 대신 주문서 1장만 사라진다.
  downgrade_from: 7
  protection_item: enhance_protection_scroll
  # 능력치 배율 = 기본 굴림값 × (1 + stat_bonus[단계−1]) — 단계별 '누적' 보너스 (+1 ~ +10).
  #   높은 단계일수록 한 단계 상승폭이 커진다: 4·4·5·6·7·9·11·14·18·22 % → +5 ×1.26 · +8 ×1.6 · +10 ×2.0
  #   max_level 을 올리면 목록도 늘릴 것 (모자라면 마지막 값). 이 키가 없으면 위 기본 곡선.
  #   (예전 키 stat_per_level — 단계마다 같은 % — 는 더 읽지 않는다. 남아 있어도 무시)
  stat_bonus: [0.04, 0.08, 0.13, 0.19, 0.26, 0.35, 0.46, 0.60, 0.78, 1.00]
  weapon_stats: [damage]          # 무기에서 배율이 곱해지는 스탯
  armor_stats: [defense, hp]      # 방어구·방패에서 배율이 곱해지는 스탯
  # 골드 = gold_base × (장비 요구 레벨 + gold_level_offset) × 희귀도 배율 × 단계 배율
  gold_base: 3.0
  gold_level_offset: 4
  gold_rarity: {common: 1.0, uncommon: 1.15, rare: 1.35, epic: 1.6, legendary: 2.0, mythic: 2.6}
  gold_steps: [1.0, 1.2, 1.4, 1.7, 2.0, 2.4, 2.9, 3.5, 4.2, 5.0]
  craft_discount: true            # 제작 할인(craft_discount 스탯, 최대 30%)을 강화 골드에도 적용
  # 강화석 개수 (+1 ~ +10) — 모든 장비 공용. 그 위에 장비마다 다른 재료(그 장비의 제작 재료, 제작법이 없으면 그 장비를 주는
  #   몬스터·보스의 드롭)가 content/enhance.yml 에 있다 (low +1~+3 · mid +4~+6 · high +7~+10, 없으면 강화석·골드만).
  #   골드·강화석·재료는 전부 있어야 시작하고, 실패해도 모두 사라진다.
  stone_counts: [1, 1, 1, 1, 2, 2, 2, 3, 3, 4]
  # 장비 단계(items.yml tier, 없으면 요구 레벨로 추정) → 쓰는 강화석 (max_floor = 그 돌을 쓰는 가장 높은 단계). 드롭은 loot.yml 의 enhance_* 테이블.
  stones:
    - {item: lesser_enhance_stone, max_floor: 3}
    - {item: greater_enhance_stone, max_floor: 7}
    - {item: supreme_enhance_stone, max_floor: 10}
  broadcast_from: 8               # 이 단계 이상 성공은 서버 전체 방송
  glint_from: 7                   # 이 단계부터 이름 금빛 + 인챈트 광택
  glow_interval: 10               # 최대 단계 장비의 은은한 빛 입자 간격(틱, 0 = 끔). 아우라 무기는 링도 더 밝아진다.

# 판매 — 떠돌이 상인 핀의 상점 [물건 팔기] · /미궁 판매 (미궁 공략 중에는 불가). 가방에서 클릭해 올리고 [판매] 로 한꺼번에.
#   재료  = materials[희귀도] × (1 + material_floor_bonus × 층)        (층 = items.yml floor, 정수·강화석처럼 층이 없으면 0)
#   장비  = gear[희귀도] × (1 + gear_floor_bonus × 장비 단계) × (1 + enhance_bonus × 강화 단계)   (무기·방어구·방패·장신구, 단계 = items.yml tier)
#   소모품 = 핀이 파는 것이면 산 값 × consumable_shop_ratio, 아니면 재료 값
#   핀이 파는 물건은 무엇이든 산 값 × shop_item_cap 이하이고, 언제나 산 값보다 싸다 (사서 되팔아 골드를 불릴 수 없음).
#   팔 수 없음: 시작 지급품 · 열쇠·직업 문장(type: key) · 전직의 두루마리(class_change.item) · unsellable 목록.
#   confirm_rarity 이상이거나 강화 confirm_enhance 이상인 물건이 섞이면 [판매] 를 두 번 눌러야 판다 (0 = 강화로는 묻지 않음).
#   키가 없으면 아래 기본값이 쓰이고, 끄려면 enabled: false (또는 다른 섹션처럼 sell: false)
sell:
  enabled: true
  materials: {common: 2, uncommon: 5, rare: 15, epic: 40, legendary: 120, mythic: 300}
  material_floor_bonus: 0.15
  gear: {common: 10, uncommon: 25, rare: 60, epic: 150, legendary: 400, mythic: 1000}
  gear_floor_bonus: 0.10
  enhance_bonus: 0.25
  consumable_shop_ratio: 0.25
  shop_item_cap: 0.5
  confirm_rarity: epic
  confirm_enhance: 1
  unsellable: [class_change_scroll]
  # 광산 재료 (0.3.6) — 값 = 반올림(기본값 × (1 + rank_bonus × (광물 등급 − 1))), 최소 1. 등급은 items.yml mine_level (구리·석영 1 … 오리하르콘·용혈석 6).
  # 주괴를 녹여 팔면 언제나 손해다 (주괴 값 < 광석 2개 + 제련 골드). 곡괭이(도구)는 팔 수 없다.
  mine: {ore: 1, ingot: 3, gem: 6, rank_bonus: 0.35}

# 몬스터
mobs:
  # 미궁 안 일반 몹이 정예 변종(HP·피해 강화 + 추가 스킬 + 금빛 발광)으로 나올 확률 (0 = 끔)
  elite_variant_chance: 0.06
  # 3D 모델 파트 방향 보정(도). 모델이 옆/뒤를 보고 있으면 90 / 180 / -90 으로 맞춘다. 기본 0.
  model_yaw_offset: 0.0

# 점진 힌트 — 보스·시련은 글로 정답을 알려 주지 않는다. 같은 보스/시련에서 실패(전멸·시련 실패)가 쌓이면
# 다음 도전 때 보스바 아래·휴식방 이야기 NPC·시련 안내에 단서가 한 단계씩 또렷해진다.
#   mode: progressive(실패 횟수만큼) | none(단서 없음) | full(처음부터 가장 분명한 단서)
#   thresholds: 실패 횟수 경계 — [2, 4, 6] 이면 0~1회 없음, 2회 흐릿한 단서, 4회 조금 더 분명, 6회 거의 정답
#   파티 기준: 함께 있는 파티원 중 가장 많이 실패한 사람의 횟수를 쓴다.
hints:
  mode: progressive
  thresholds: [2, 4, 6]


# 광산 (0.3.6) — 따로 된 광산 월드 + 승강기. 층·광석·보석·블록·바이옴·캐는 초는 content/mine.yml (자동 갱신), 여기는 손잡이만.
#   층 6개는 모두 처음부터 열려 있다 (레벨 조건 없음). 곡괭이는 캘 수 있는 광석(단단함)과 빠르기만 정한다.
#   광맥은 모두가 함께 쓴다: 누가 캐면 모두에게 빈 광맥이 되고 regen_minutes 뒤 다시 찬다.
#   광산 월드에 사람이 많을수록 빨리 찬다: 다시 차는 시간 = regen_minutes ÷ min(광산 사람 수, regen_players_cap).
#   서버를 다시 켜면 모든 광맥이 다 찬 상태로 시작한다. 광산 안은 피해 없음 · PvP 끔 · 몹 없음 · 어드벤처 모드.
#   키가 없으면 아래 기본값. 끄려면 enabled: false (또는 mine: false).
mine:
  enabled: true
  world: labyrinth_mine
  teleport_command: auto          # /미궁 광산 · 메인 메뉴 "광산" — auto = village.teleport_command 를 따름 · true · false (관리자는 늘 됨)
  lift_seconds: 2.0               # 승강기 타는 시간 (움직이면 멈춤)
  regen_minutes: [8, 9, 9, 10, 10, 10]   # 층마다 광맥이 다시 차는 분 (혼자일 때) — 얕은 갱도 … 용의 심연
  gem_node_regen_minutes: 30      # 보석 노드가 다시 차는 분
  regen_players_cap: 4            # 사람 수로 빨라지는 최대 배수 (4 = 넷 이상이면 4배)
  gem_chance: 0.022               # 광석 블록마다 같은 등급 보석이 나올 확률
  rich: {chance: 0.04, multiplier: 3}    # 다시 찰 때 풍부한 광맥(반짝임)이 될 확률 · 다음에 캔 사람 수확 배수
  fx: {pop: true}                 # 광석 날아오기 연출
  no_hunger: true                 # 광산 안에서 배고픔이 줄지 않음
  safe: true                      # 광산 안 피해 0


# 도안 (0.3.6) — 희귀 이상 장비(무기·방어구·방패·장신구)는 도안을 배워야 대장간에서 만든다. 일반·고급은 처음부터 안다.
#   도안은 우클릭하면 영구히 배운다 (한 장 소모, 이미 알면 그대로 — 남에게 주거나 판다).
#   나오는 곳: 정예 · 보스 · 금·철 상자 · 보물방 · 금고·미믹 · 특별 시련 (loot.yml {blueprint: …}) + 상인 핀(희귀만, 날마다 바뀜)
#   enabled: false 면 도안 없이 모두 만든다 (예전처럼)
#   상인 값 = shop_price_base + shop_price_step × 장비 단계 (팔 때는 재료 희귀 값 — 사서 되팔기로 골드가 늘지 않는다)
blueprints:
  enabled: true
  shop_count: 3
  shop_price_base: 200
  shop_price_step: 40
