# ─────────────────────────────────────────────────────────────
#  미궁 라비린스 (Labyrinth) — 서버 설정
#  수정 후 /labadmin reload 로 다시 읽는다 (진행 중인 인스턴스는 다음 입장부터 적용).
# ─────────────────────────────────────────────────────────────

# 서버 난이도: easy | normal | hard | nightmare
# 비어 있으면 처음 접속한 관리자에게 초기 설정 안내가 뜨고, 정하기 전까지 미궁 입장이 막힌다.
# 콘솔: /labadmin setup <난이도>   변경: /labadmin difficulty <난이도>
difficulty: ""

# 난이도 프리셋 — hp/damage: 몹·보스 배율, drop: 드롭 확률, xp: 경험치, telegraph: 경고 시간(windup) 배율
#   ramp: 층 램프 — from_floor 층에서 start 값으로 시작해 full_floor 층부터 위의 원래 값 (그 사이는 층마다 고르게).
#         hp·damage·telegraph 와 보스 패턴 배율(쿨다운·추가 개수·속도·오브젝트 HP·제한 시간)만 램프한다.
#         drop·xp(보상)는 1층부터 원래 값. ramp 키가 없으면 아래 기본값이 쓰이고, 끄려면 ramp: {enabled: false}
difficulties:
  easy:      {name: "쉬움",   hp: 0.7, damage: 0.6, drop: 0.8, xp: 0.8, telegraph: 1.3}
  normal:    {name: "보통",   hp: 1.0, damage: 1.0, drop: 1.0, xp: 1.0, telegraph: 1.0}
  hard:      {name: "어려움", hp: 1.5, damage: 1.4, drop: 1.3, xp: 1.3, telegraph: 0.85,
              ramp: {from_floor: 1, full_floor: 4, start: {hp: 1.2, damage: 1.15, telegraph: 0.95}}}
  nightmare: {name: "악몽",   hp: 2.4, damage: 2.0, drop: 1.8, xp: 1.7, telegraph: 0.7,
              ramp: {from_floor: 1, full_floor: 6, start: {hp: 1.8, damage: 1.6, telegraph: 0.85}}}

# 파티 — 인원 n 명일 때 몹 HP ×(1 + hp_per_member×(n−1)), 피해 ×(1 + dmg_per_member×(n−1)),
#         골드·드롭 ×(1 + reward_per_member×(n−1))
#   솔로(1명)일 때만 몹·보스 HP ×solo_hp, 피해 ×solo_damage (보상은 그대로). 끄려면 둘 다 1.0
party:
  max_size: 10
  hp_per_member: 0.6
  dmg_per_member: 0.08
  reward_per_member: 0.05
  solo_hp: 0.85
  solo_damage: 0.85
  invite_timeout: 60        # 초

# 미궁 전용 공허 월드 (기존 지형은 절대 건드리지 않는다)
world:
  name: labyrinth_world

# 오버월드 입구 — /labadmin setentrance 로 지정. mode: block(작은 입구 구조물) | npc(NPC 만, 블록 변경 0)
#   | village(미리 지은 마을의 게이트 — 마을 월드를 처음 켤 때 자동으로 정해짐)
entrance:
  mode: ""
  world: ""
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0
  radius: 8                 # 파티 입장 시 파티원이 입구 근처에 있어야 하는 반경(블록)

# 미리 지은 마을 (VILLAGE.md) — 주 월드 폴더에 labyrinth-village.yml 이 있을 때만 켜진다 (서버팩의 world 폴더)
village:
  teleport_command: true     # /미궁 마을 로 광장 텔레포트
  block_mob_spawns: true     # 마을 안 적대 몹 자연 스폰 막기
  blocks_per_tick: 4000      # village build 속도 (개발용)

# 초기 설정 — true 면 op 가 아니어도 서버 난이도를 정하거나 바꿀 수 있다 (/미궁 난이도, 처음 접속 시 설정 창).
setup:
  everyone_can_set_difficulty: true

# UI — HUD 바·메뉴 배경을 리소스팩 커스텀 폰트로 그린다.
# 화면 아래에 네모 박스(□□□)가 보이면 false 로 바꾸고 /labadmin reload 하세요 (글자 HUD 로 대체).
ui:
  use_glyphs: true

# 서버 목록 화면 아이콘 (jar 안 미궁 석문 아이콘). 설명 글은 server.properties 의 motd 를 그대로 쓴다.
server_list:
  icon: true

# 리소스팩 — 내장 HTTP 서버가 plugins/Labyrinth/pack/labyrinth-pack.zip 을 서빙한다.
pack:
  enabled: true
  port: 8163                # 서버 방화벽/공유기에서 이 TCP 포트를 열어야 친구들이 받을 수 있다
  bind: "0.0.0.0"
  public_host: ""           # 비우면 각 플레이어가 접속한 주소(도메인/IP)를 그대로 사용
  public_port: 0            # playit.gg 같은 터널: 8163 용 TCP 터널을 하나 더 만들고 그 주소를 public_host, 포트를 여기에
                            #   (같은 PC·와이파이로 들어온 사람은 자동으로 내장 주소를 씀)
  url: ""                   # 외부 호스팅 URL 을 쓰려면 여기에 (내장 서버를 끈다)
  sha1: ""                  # 외부 URL 일 때 SHA-1 (비우면 로컬 zip 으로 계산 시도)
  required: true
  kick_on_decline: false
  update_from_jar: true     # 플러그인 jar 에 들어 있는 팩이 더 새로우면 자동으로 꺼내 쓴다
  prompt: "<gradient:#c9a2ff:#7fd8ff>미궁 라비린스</gradient> <gray>전용 리소스팩입니다. 무기·몬스터·UI 가 모두 이 팩으로 보입니다.</gray>"

# 플레이어 데이터
data:
  autosave_minutes: 5

# 전투
combat:
  damage_numbers: true
  damage_number_ticks: 16
  base_crit_chance: 0.05
  base_crit_damage: 1.5
  # 낙하·불·익사·바닐라 몹 등 바닐라 피해를 '최대 HP 20 기준 비율'로 환산 (HP 가 커져도 바닐라처럼 위험하게)
  scale_vanilla_damage: true

# 플레이어끼리 싸우기 (PvP) — 따로 신청하는 대전 없이 규칙 하나:
#   같은 파티원끼리는 야생·마을·미궁 어디서든 서로 피해를 줄 수 없고, 그 밖의 플레이어끼리는 피해를 줄 수 있다.
#   근접·화살·삼지창·직업 스킬·무기 스킬·장판·투척/잔류 물약·불·TNT·엔드 수정·길들인 늑대·낚싯대 모두 같은 규칙.
#   플러그인이 켤 때 모든 월드의 바닐라 PvP 규칙(게임 규칙 pvp)을 enabled 값으로 맞춘다 (server.properties 와 무관).
pvp:
  enabled: true
  # 플레이어 → 다른 플레이어 피해 배율. 미궁 피해 공식(공격력 × 주스탯 × 치명타)은 몹 HP 기준이라 그대로 쓰면 고레벨이 너무 세다.
  # 근거 (GDD §3·§16.4 공식, 같은 레벨 광전사 → 사냥꾼, 희귀 장비 기준) — 배율 1.0 일 때 기본 공격 한 대가 상대 최대 HP 의
  #   Lv1 8% · Lv20 9% · Lv30 13% · Lv44 19%, 궁극기(공격력 ×3.5) 치명타는 Lv44 에서 98% (= 한 방).
  # 0.7 → 기본 공격으로 Lv1 18대 · Lv20 16대 · Lv30 11대 · Lv44 8대. 0.6 이하는 저레벨 싸움이 20대 넘게 늘어져서 0.7 로 둔다.
  damage_multiplier: 0.7
  # 한 번의 피해 상한 = 맞는 사람 최대 HP × 이 값. 0.35 → 체력이 가득하면 최소 3번은 맞아야 쓰러진다
  # (위 배율만으로는 Lv44 치명타 궁극기가 69% 라 두 방이면 끝 — 그 순삭만 막는다). 1.0 = 상한 없음.
  max_hit_ratio: 0.35
  # 마을 안은 PvP 금지 — 주 월드 폴더의 labyrinth-village.yml(마을 기능이 만든다) 중심에서 반경 radius + safe_zone_margin 칸.
  # 마을 파일이 없으면 이 설정은 아무 일도 하지 않는다.
  safe_zone_village: true
  safe_zone_margin: 8
  # 내 화면에서 파티원 이름표(·탭 목록 이름)를 초록색으로 (사람마다 자기 파티원이 초록)
  party_name_color: true

# 레벨 — 필요 경험치(L) = round(xp_a × L^xp_exp + xp_b)
level:
  max: 50
  start_points: 5         # Lv.1 에서 받는 스탯 포인트 (레벨업 전에도 /스탯 분배 가능). 이미 플레이하던 사람도 한 번 받는다
  points_per_level: 5
  xp_a: 40
  xp_exp: 1.6
  xp_b: 60

# 시작 꾸러미 — 직업을 처음 고를 때 플레이어당 한 번 (시작 무기와 함께). 직업을 바꿔도 다시 주지 않는다.
#   이미 직업이 있던 사람은 다음 접속 때 받되, Lv.5 이하이고 지하 1층을 깬 적이 없을 때만 (그 밖에는 받은 것으로 기록).
#   목록을 늘리면 이미 받은 사람(같은 조건)에게는 모자란 만큼만 더 준다. item 이 minecraft: 로 시작하면 바닐라 아이템.
#   키가 없으면 아래 기본 목록이 쓰이고, 끄려면 enabled: false
starter_kit:
  enabled: true
  gold: 300
  items:
    - {item: novice_cap, amount: 1}
    - {item: novice_tunic, amount: 1}
    - {item: novice_trousers, amount: 1}
    - {item: novice_boots, amount: 1}
    - {item: minor_healing_potion, amount: 10}
    - {item: minor_mana_potion, amount: 5}
    - {item: return_scroll, amount: 2}
    - {item: "minecraft:bread", amount: 16}

# 직업 변경 (최상위 키) — 첫 직업 선택은 무료. 그 뒤로 바꿀 때마다:
#   require_item: true 면 item(전직의 두루마리, 떠돌이 상인 핀이 판다) 1장이 사라진다.
#   cooldown_hours: 직업을 바꾼 뒤 이 시간 동안은 다시 바꿀 수 없다 (실제 시간 기준, 0 = 대기 없음). 첫 선택(무료)은 세지 않는다.
#   미궁 공략 중에는 언제나 바꿀 수 없다. 관리자 /labadmin setclass <플레이어> <직업|none> 은 이 제한을 받지 않는다.
#   키가 없으면 아래 기본값이 쓰이고, 끄려면 class_change: false
class_change:
  require_item: true
  item: class_change_scroll
  cooldown_hours: 24

# 죽을 때 (인벤세이브) — 야생·마을·네더·엔드 어디서 죽든 (PvP 포함)
#   keep_inventory: 소지품을 그대로 지니고 아무것도 떨구지 않는다. keep_level: 바닐라 경험치 레벨 유지 (경험치 구슬도 안 떨굼).
#   false 면 그 부분만 바닐라(게임 규칙 keepInventory)대로. 미궁 안에서 죽으면 이 값과 상관없이 언제나 잃지 않는다.
#   키가 없으면 둘 다 true.
death:
  keep_inventory: true
  keep_level: true

# 무기 타입별 기본 공격 속도(초당 공격 횟수). attack_speed 스탯이 % 로 곱해진다.
weapon_attack_speed:
  none: 1.6
  sword_shield: 1.5
  greatsword: 0.95
  dagger: 2.2
  bow: 1.2
  staff: 1.1
  scepter: 1.3

# 강화 — 대장장이 두르간의 [강화] (GDD §11.13). 미궁 무기·방어구·방패만 (장신구·바닐라 장비는 강화 불가).
# 목록은 목표 단계 +1, +2, … 순서. 모자라면 마지막 값을 계속 쓴다.
enhance:
  enabled: true
  max_level: 10
  # 성공 확률 (+1 ~ +10). 기본: +1~+4 확정, 그 뒤로 점점 줄어드는 '매운 맛'
  chances: [1.0, 1.0, 1.0, 1.0, 0.90, 0.80, 0.65, 0.50, 0.35, 0.20]
  # 현재 단계가 이 값 이상일 때 실패하면 한 단계 내려간다 (파괴는 없음). 0 = 하락 없음.
  # 실패하면 골드·강화석·재료는 언제나 사라진다. 보호 주문서를 켜 두면 하락 대신 주문서 1장만 사라진다.
  downgrade_from: 7
  protection_item: enhance_protection_scroll
  # 능력치 배율 = 기본 굴림값 × (1 + stat_bonus[단계−1]) — 단계별 '누적' 보너스 (+1 ~ +10).
  #   높은 단계일수록 한 단계 상승폭이 커진다: 4·4·5·6·7·9·11·14·18·22 % → +5 ×1.26 · +8 ×1.6 · +10 ×2.0
  #   max_level 을 올리면 목록도 늘릴 것 (모자라면 마지막 값). 이 키가 없으면 위 기본 곡선.
  #   (예전 키 stat_per_level — 단계마다 같은 % — 는 더 읽지 않는다. 남아 있어도 무시)
  stat_bonus: [0.04, 0.08, 0.13, 0.19, 0.26, 0.35, 0.46, 0.60, 0.78, 1.00]
  weapon_stats: [damage]          # 무기에서 배율이 곱해지는 스탯
  armor_stats: [defense, hp]      # 방어구·방패에서 배율이 곱해지는 스탯
  # 골드 = gold_base × (장비 요구 레벨 + gold_level_offset) × 희귀도 배율 × 단계 배율
  gold_base: 3.0
  gold_level_offset: 4
  gold_rarity: {common: 1.0, uncommon: 1.15, rare: 1.35, epic: 1.6, legendary: 2.0, mythic: 2.6}
  gold_steps: [1.0, 1.2, 1.4, 1.7, 2.0, 2.4, 2.9, 3.5, 4.2, 5.0]
  craft_discount: true            # 제작 할인(craft_discount 스탯, 최대 30%)을 강화 골드에도 적용
  # 강화석 개수 (+1 ~ +10) — 모든 장비 공용. 그 위에 장비마다 다른 재료(그 장비의 제작 재료, 제작법이 없으면 그 장비를 주는
  #   몬스터·보스의 드롭)가 content/enhance.yml 에 있다 (low +1~+3 · mid +4~+6 · high +7~+10, 없으면 강화석·골드만).
  #   골드·강화석·재료는 전부 있어야 시작하고, 실패해도 모두 사라진다.
  stone_counts: [1, 1, 1, 1, 2, 2, 2, 3, 3, 4]
  # 장비가 속한 층(items.yml floor, 없으면 요구 레벨로 추정) → 쓰는 강화석. 드롭은 loot.yml 의 enhance_* 테이블.
  stones:
    - {item: lesser_enhance_stone, max_floor: 3}
    - {item: greater_enhance_stone, max_floor: 7}
    - {item: supreme_enhance_stone, max_floor: 10}
  broadcast_from: 8               # 이 단계 이상 성공은 서버 전체 방송
  glint_from: 7                   # 이 단계부터 이름 금빛 + 인챈트 광택
  glow_interval: 10               # 최대 단계 장비의 은은한 빛 입자 간격(틱, 0 = 끔). 아우라 무기는 링도 더 밝아진다.

# 판매 — 떠돌이 상인 핀의 상점 [물건 팔기] · /미궁 판매 (미궁 공략 중에는 불가). 가방에서 클릭해 올리고 [판매] 로 한꺼번에.
#   재료  = materials[희귀도] × (1 + material_floor_bonus × 층)        (층 = items.yml floor, 정수·강화석처럼 층이 없으면 0)
#   장비  = gear[희귀도] × (1 + gear_floor_bonus × 층) × (1 + enhance_bonus × 강화 단계)   (무기·방어구·방패·장신구)
#   소모품 = 핀이 파는 것이면 산 값 × consumable_shop_ratio, 아니면 재료 값
#   핀이 파는 물건은 무엇이든 산 값 × shop_item_cap 이하이고, 언제나 산 값보다 싸다 (사서 되팔아 골드를 불릴 수 없음).
#   팔 수 없음: 시작 지급품 · 열쇠·직업 문장(type: key) · 전직의 두루마리(class_change.item) · unsellable 목록.
#   confirm_rarity 이상이거나 강화 confirm_enhance 이상인 물건이 섞이면 [판매] 를 두 번 눌러야 판다 (0 = 강화로는 묻지 않음).
#   키가 없으면 아래 기본값이 쓰이고, 끄려면 enabled: false
sell:
  enabled: true
  materials: {common: 2, uncommon: 5, rare: 15, epic: 40, legendary: 120, mythic: 300}
  material_floor_bonus: 0.15
  gear: {common: 10, uncommon: 25, rare: 60, epic: 150, legendary: 400, mythic: 1000}
  gear_floor_bonus: 0.10
  enhance_bonus: 0.25
  consumable_shop_ratio: 0.25
  shop_item_cap: 0.5
  confirm_rarity: epic
  confirm_enhance: 1
  unsellable: [class_change_scroll]

# 몬스터
mobs:
  # 미궁 안 일반 몹이 정예 변종(HP·피해 강화 + 추가 스킬 + 금빛 발광)으로 나올 확률 (0 = 끔)
  elite_variant_chance: 0.06
  # 3D 모델 파트 방향 보정(도). 모델이 옆/뒤를 보고 있으면 90 / 180 / -90 으로 맞춘다. 기본 0.
  model_yaw_offset: 0.0

# 점진 힌트 — 보스·시련은 글로 정답을 알려 주지 않는다. 같은 보스/시련에서 실패(전멸·시련 실패)가 쌓이면
# 다음 도전 때 보스바 아래·휴식방 이야기 NPC·시련 안내에 단서가 한 단계씩 또렷해진다.
#   mode: progressive(실패 횟수만큼) | none(단서 없음) | full(처음부터 가장 분명한 단서)
#   thresholds: 실패 횟수 경계 — [2, 4, 6] 이면 0~1회 없음, 2회 흐릿한 단서, 4회 조금 더 분명, 6회 거의 정답
#   파티 기준: 함께 있는 파티원 중 가장 많이 실패한 사람의 횟수를 쓴다.
hints:
  mode: progressive
  thresholds: [2, 4, 6]
