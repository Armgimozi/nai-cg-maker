# ─────────────────────────────────────────────────────────────────────────────
# enhance.yml — 장비별 강화 재료 (GDD §11.13). tools/gen_enhance.py 가 만든 파일 — 손으로 고쳐도 된다.
#
# 강화 한 번 비용 = 골드 + 강화석(config.yml enhance: — 장비 층 구간별 1종, 모든 장비 공용) + 아래 그 장비만의 재료.
# 실패해도 셋 다 사라진다 (보호 주문서는 하락만 막는다). 가방에 전부 있어야 시작하고, 하나라도 모자라면 아무것도 안 가져간다.
#
# 형식: <장비 id>: {low: {재료: 개수}, mid: {...}, high: {...}}   — 구간은 아래 bands (목표 단계 기준).
#   개수 = 숫자 하나(구간 전체 같은 개수) 또는 목록(구간 안 목표 단계 순: low [+1, +2, +3]). 모자란 목록은 마지막 값, 0 = 그 단계엔 필요 없음.
#   재료 순서 = 강화 창 표시 순서이고, 툴팁에는 첫 재료만 보인다. 여기 없는 장비(새로 넣은 장비)는 강화석·골드만 든다(시작 때 경고).
#   없는 재료 id 는 시작 때 경고하고 그 줄만 무시한다.
#
# ── 재료를 고르는 규칙 — "그 장비를 얻는 곳에서 강화 재료도 얻는다" ─────────────────
#   ① 제작법이 있는 장비 (recipes.yml 결과 = 그 장비) → 그 제작 재료로 강화한다.
#      low  (+1~+3) : 주 재료 P = 레시피에서 가장 많이 드는 재료
#      mid  (+4~+6) : P + 보조 S = 레시피의 두 번째 재료
#      high (+7~+10): P + S + 귀한 재료 R = 레시피에서 가장 귀한 재료 (정예 재료 > 정수)
#      레시피가 일반 재료 2종뿐이면 R 은 그 장비가 나오는 곳(정예·몬스터·상자)의 귀한 드롭 (정예 재료 > 정수).
#   ② 제작법이 없는 장비 → 그 장비를 떨어뜨리는 곳의 드롭 재료로 강화한다.
#      low = 그 층 일반 재료 중 장비 종류에 맞는 쪽 (검방·대검·단검·흉갑·신발 = 단단한 재료, 활·지팡이·홀·투구·하의 = 부드러운 재료)
#      mid = + 나오는 곳이 같이 떨어뜨리는 다른 일반 재료 (몬스터·상자·정예·보스 모두 그 층 일반 재료 2종을 준다)
#      high = + 나오는 곳의 귀한 드롭 (정예 재료 > 정수)
#      집: 층 공용 무기 = 그 층 몬스터·상자 · 보스 고유 = 그 보스 ·
#          시작 지급(수련생) = 1층 몬스터·상자 · 칭호 보상(악몽의 왕관) = 그 칭호를 주는 10층 보스 (핵 포함)
#   → 어느 장비든 mid 까지는 일반 재료 2종, 정수·정예 재료는 high 의 R 에만 — 낮은 장비의 mid 가 보스 장비보다 귀해지지 않는다.
#   ③ 보스 장비 (보스 고유 · 보스가 주는 칭호 보상) — 제작법이 있으면 ①, 없으면 ② 에 더해 (신화 무기는 레시피가 있어도 ②+③ — 0.3.7):
#      +7·+8 의 R 은 정예 재료만 — 레시피의 정예 재료, 없으면 그 보스 드롭의 정예 재료 (보스 드롭마다 1회 0.5개). 정수로 내려가지 않는다.
#      +9·+10 은 R 대신 그 보스의 핵.
#      그리고 단계마다 같은 층·같은 분류(무기 / 방패 / 흉갑·하의 / 투구·신발) 일반 장비 중 가장 비싼 것보다 싸지 않게
#      (재료 개수 ÷ 그 재료 1회 공급량으로 환산) P·S 개수를 가장 적게 더한다 — 아래 "검사" 참고.
#   ④ 같은 층에 재료 구성(개수까지)이 똑같은 장비가 생기면, 원칙에서 덜 벗어나는 것부터 차례로:
#      1단계 (원칙 재료 그대로) R 을 같은 원칙 안의 다른 귀한 재료로(환산해 싼 쪽부터) → P·S 순서 바꿈 → S +1 → S +2 → P +1 …
#      2단계 (원칙 밖, 1단계로 안 될 때만) 나오는 곳의 다른 귀한 드롭·윗 등급 정수 → 3단계 그 정수를 대장간에서 정제한 윗 등급 정수
#      일반 장비는 낮은 레벨·등급부터 원칙 그대로 받고 변형은 높은 장비가 받는다. S 를 먼저 늘리는 것은 S 가 mid·high 에만 들어 싸서.
#   결과: 장비 370종 (제작 재료 165 · 드롭 재료 205) — 원칙 그대로 89종 · R 바꿈 0종 · P·S 순서 바꿈 100종 · 일반 장비 S +n 114종 · P +n 72종 · 원칙 밖 R 0종 (겹칠 수 있음)
#         보스 장비 60종 중 개수를 더한 장비 56종. 같은 층에서 구성이 똑같은 장비 0쌍.
#   강화석(하급·상급·최상급)은 그대로 모든 장비에 공용으로 든다 — 장비 재료는 그 위에 더하는 몫.
#   ⑤ 0.3.6 (광산 · 몹 몸에 맞는 드롭): 위 ①②의 보조 S 는 그 장비의 주 금속 주괴다 (레시피에서 가장 많이 드는 주괴, 같으면 윗 금속 ·
#      드롭 장비는 장비 힘으로 고른 금속). 주괴 개수 = S 기본 × 층 상수 1층 0.5 · 2층 0.625 · 3층 0.625 · 4층 0.625 · 5층 0.75 · 6층 0.875 · 7층 0.875 · 8층 0.875 · 9층 1 · 10층 1.
#      P 는 몬스터 재료 — 드롭 장비는 단단한 장비(근접·판금·방패·가죽 흉갑·신발) 1층 돌갑충 껍질 · 2층 갱도 송곳니 · 3층 포자 갓 · 4층 녹물 비늘 · 5층 잿불 비늘 · 6층 서리 발톱 · 7층 공명 힘줄 · 8층 바랜 책장 · 9층 태엽 기름 · 10층 심연 비늘,
#      부드러운 장비 1층 이끼 섬유 · 2층 갱도 거미줄 · 3층 균사 실 · 4층 소금물 진주 · 5층 불씨 혼 · 6층 묘지 뼈 · 7층 공명 힘줄 · 8층 먹물 정수 · 9층 시간 가루 · 10층 스컬크 촉수.
#      겹치면 P 를 레시피의 다른 부위 → 그 층 반대쪽 부위 → (부위 하나뿐인 층) 주괴를 P 로. R 은 지난 판 enhance.yml 의 R 을 먼저 쓴다.
#
# ── 개수 (시도 1번당) ─────────────────────────────────────────────────────────
#   P (일반 재료, low · mid · high)  무기 [2, 2, 3] · [3, 3, 4] · [4, 5, 6, 7] | 방패 [2, 3, 3] · [3, 4, 4] · [4, 5, 6, 7]
#                                    흉갑·하의 [2, 2, 3] · [3, 3, 4] · [4, 4, 5, 6] | 투구·신발 [2, 2, 2] · [2, 3, 3] · [3, 4, 5, 6]
#   S (mid · high)  일반 재료: 무기·방패 [2, 2, 3] · [3, 3, 4, 5] | 흉갑·하의 [2, 2, 2] · [2, 3, 3, 4] | 투구·신발 [1, 2, 2] · [2, 2, 3, 4]
#                   일반 재료 P·S 는 그 재료 1회 공급량 ÷ 40 (0.25 단위, ×1.0 ~ ×2.0) 을 곱하고 .5 는 올린다 — 깊은 층일수록 많이 떨어지고 많이 든다.
#   R (+7~+10)      정예 재료 [1, 1, 2, 2] · 정수 [2, 3, 3, 4] · 윗 등급 정수 [1, 1, 1, 2]   (보스 장비는 +7·+8 만: 정예 재료 [1, 2, 0, 0])
#   보스 핵 K       [0, 0, 1, 2] (+9·+10 시도만)   — 상승폭이 커져(+10 ×2) +8~+10 개수를 예전보다 조금 올렸다.
#
# ── 근거: 1회 클리어 공급량 (보통·솔로·1인, LUK 0 — loot.yml 을 펼쳐 계산) ──────────
#   가정: 몹 수 GDD §16.1 (1층 24 … 10층 60), 미로 상자 나무 4~6 · 철 2~3 · 금 3~4, 보물방 상자 3개 × 방 수, 기믹방 1, 정예 1~2, 보스 1.
