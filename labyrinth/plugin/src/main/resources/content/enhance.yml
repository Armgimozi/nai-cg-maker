# ─────────────────────────────────────────────────────────────────────────────
# enhance.yml — 장비별 강화 재료 (GDD §11.13). tools/gen_enhance.py 가 만든 파일 — 손으로 고쳐도 된다.
#
# 강화 한 번 비용 = 골드 + 강화석(config.yml enhance: — 장비 층 구간별 1종) + 아래 그 장비만의 재료.
# 실패해도 셋 다 사라진다 (보호 주문서는 하락만 막는다). 가방에 전부 있어야 시작하고, 하나라도 모자라면 아무것도 안 가져간다.
#
# 형식: <장비 id>: {low: {재료: 개수}, mid: {...}, high: {...}}   — 구간은 아래 bands (목표 단계 기준).
#   개수 = 숫자 하나(구간 전체 같은 개수) 또는 목록(구간 안 목표 단계 순: low [+1, +2, +3]). 모자란 목록은 마지막 값, 0 = 그 단계엔 필요 없음.
#   재료 순서 = 강화 창 표시 순서이고, 툴팁에는 첫 재료만 보인다. 여기 없는 장비(새로 넣은 장비)는 강화석·골드만 든다(시작 때 경고).
#   없는 재료 id 는 시작 때 경고하고 그 줄만 무시한다.
#
# ── 재료를 고르는 규칙 (생성기) ─────────────────────────────────────────────
#   low  (+1~+3) : 주 재료 P = 그 장비 층의 일반 재료 2종 중 하나 — 근접 날붙이(검방·대검·단검)·흉갑·신발·방패는 단단한 쪽
#                  (껍질·금속·뼈·비늘·톱니), 활·지팡이·홀·투구·하의는 부드러운/마법 쪽(섬유·실·진주·결정·체액).
#   mid  (+4~+6) : P + 보조 S = 그 층 정예급 재료 — 정예 재료 E(볏·휘장·핵…) 또는 그 층 등급 정수.
#   high (+7~+10): P + S + 희귀 R = E·정수·한 등급 위 정수 중 S 와 다른 것. 보스 고유 장비는 R 대신 그 보스의 핵(+9·+10 시도).
#   같은 층·같은 종류(부위) 장비는 (S, R) 짝을 (E, 정수) → (정수, E) → (E, 윗 정수) 순으로 번갈아 써서 구성이 겹치지 않는다.
#   P 개수는 그 재료 1회 공급량 ÷ 40 (0.25 단위, ×1.0 ~ ×2.0) 을 곱한다 — 깊은 층일수록 많이 떨어지고 많이 든다.
#
# ── 근거: 1회 클리어 공급량 (보통·솔로·1인, LUK 0 — loot.yml 을 펼쳐 계산) ──────────
#   가정: 몹 수 GDD §16.1 (1층 24 … 10층 60), 미로 상자 나무 4~6 · 철 2~3 · 금 3~4, 보물방 상자 3개 × 방 수, 기믹방 1, 정예 1~2, 보스 1.
#   계산한 콘텐츠: content/ — 장비 226종 · 루팅 테이블 184개
#    1층  P 돌갑충 껍질 36 · 이끼 섬유 45  | E 우두머리 이끼 볏 3.3  | 정수 희미한 미궁 정수 9.2 · 윗 정수 0.6  | 핵 파수꾼의 심재 1
#    2층  P 녹슨 철괴 46 · 갱도 거미줄 38  | E 감독관의 휘장 3.3  | 정수 희미한 미궁 정수 9.1 · 윗 정수 0.6  | 핵 여왕의 방적돌기 1
#    3층  P 포자 갓 46 · 균사 실 39  | E 군락체의 핵 3.3  | 정수 희미한 미궁 정수 9.2 · 윗 정수 0.6  | 핵 균사의 왕관 1
#    4층  P 녹물 장어 비늘 45 · 소금물 진주 48  | E 녹청 등판 3.3  | 정수 미궁 정수 9.3 · 윗 정수 0.6  | 핵 수문의 열쇠 1
#    5층  P 슬래그 주괴 54 · 불씨 조각 47  | E 집행관의 칼날 3.3  | 정수 미궁 정수 9.3 · 윗 정수 0.6  | 핵 용광로 핵 1
#    6층  P 묘지 뼈 52 · 서리 결정 53  | E 장송종 파편 3.3  | 정수 미궁 정수 9.3 · 윗 정수 0.6  | 핵 얼음관 조각 1
#    7층  P 자수정 파편 62 · 프리즘 가루 55  | E 조율 소리굽쇠 3.3  | 정수 찬란한 미궁 정수 10.0 · 윗 정수 0.6  | 핵 양극의 심장 1
#    8층  P 바랜 책장 62 · 먹물 정수 70  | E 금서의 봉인 3.8  | 정수 찬란한 미궁 정수 11.5 · 윗 정수 0.7  | 핵 사서의 깃펜 1
#    9층  P 놋쇠 톱니 80 · 태엽 용수철 60  | E 조속 진자 4.9  | 정수 태고의 미궁 정수 12.2  | 핵 태엽 심장 1
#   10층  P 스컬크 촉수 71 · 심연의 체액 77  | E 문지기의 룬 4.9  | 정수 태고의 미궁 정수 12.2  | 핵 심연 심장 파편 1
#   (정수는 대장간에서 5:1 로 윗 등급으로 정제할 수 있다. 일반 재료는 대장간 제작에도 10~24개씩 든다.)
#
# ── 근거: 시도 수 (config chances · downgrade_from 그대로, 정확한 기대값) ─────────
#   +5 까지 1.00 + 1.00 + 1.00 + 1.00 + 1.11 = 5.1회 (하락 없음)
#   +10 까지 (주문서 없이) +7 17.4 · +8 20.6 · +9 14.3 · +10 5.0  합 63.6회 — 대부분 +7·+8 하락 고리
#   +10 까지 (하락을 전부 주문서로 막으면) 17.8회 · 주문서 6.9장
#   보스 핵을 high 구간 모든 시도에 넣으면 +10 까지 핵 57개(= 그 보스 57번) — 강화석 병목(장비 하나 +10 ≈ 강화석 168개)의 3배라서, +9·+10 시도에만 1개씩 (+10 까지 핵 19개) 로 맞췄다.
#
# ── 결과: 예상 클리어 수 (그 층만 돌고, 그 재료를 강화에만 쓸 때) ─────────────────
#   층  | 장비 1개 +5 | 대표 한 벌(무기+방어구 4+방패) +5 (병목) | +10 장비 1개 (재료 병목 / 강화석)
#    1층 | 0.6회 | 3.6회 (하급 강화석) | E+정수 20회(우두머리 이끼 볏) · 정수+E 19회(우두머리 이끼 볏) · E+윗정수 23회(미궁 정수) · 보스(E) 20회(우두머리 이끼 볏) · 보스(정수) 19회(파수꾼의 심재) / 강화석 16회
#    2층 | 0.6회 | 3.6회 (하급 강화석) | E+정수 20회(감독관의 휘장) · 정수+E 19회(감독관의 휘장) · E+윗정수 23회(미궁 정수) · 보스(E) 20회(감독관의 휘장) · 보스(정수) 19회(여왕의 방적돌기) / 강화석 16회
#    3층 | 0.6회 | 3.6회 (하급 강화석) | E+정수 20회(군락체의 핵) · 정수+E 19회(군락체의 핵) · E+윗정수 23회(미궁 정수) · 보스(E) 20회(군락체의 핵) / 강화석 16회
#    4층 | 0.6회 | 3.5회 (상급 강화석) | E+정수 20회(녹청 등판) · 정수+E 19회(녹청 등판) · E+윗정수 23회(찬란한 미궁 정수) · 보스(E) 20회(녹청 등판) · 보스(정수) 19회(수문의 열쇠) / 강화석 16회
#    5층 | 0.6회 | 3.4회 (상급 강화석) | E+정수 20회(집행관의 칼날) · 정수+E 19회(집행관의 칼날) · E+윗정수 23회(찬란한 미궁 정수) · 보스(E) 20회(집행관의 칼날) · 보스(정수) 19회(용광로 핵) / 강화석 15회
#    6층 | 0.6회 | 3.4회 (상급 강화석) | E+정수 20회(장송종 파편) · 정수+E 19회(장송종 파편) · E+윗정수 23회(찬란한 미궁 정수) · 보스(E) 20회(장송종 파편) · 보스(정수) 19회(얼음관 조각) / 강화석 15회
#    7층 | 0.6회 | 2.3회 (상급 강화석) | E+정수 20회(조율 소리굽쇠) · 정수+E 19회(조율 소리굽쇠) · E+윗정수 22회(태고의 미궁 정수) · 보스(E) 20회(조율 소리굽쇠) · 보스(정수) 19회(양극의 심장) / 강화석 13회
#    8층 | 0.6회 | 2.5회 (최상급 강화석) | E+정수 18회(금서의 봉인) · 정수+E 17회(금서의 봉인) · E+윗정수 19회(태고의 미궁 정수) · 보스(E) 19회(사서의 깃펜) · 보스(정수) 19회(사서의 깃펜) / 강화석 11회
#    9층 | 0.4회 | 2.0회 (최상급 강화석) | E+정수 14회(조속 진자) · 정수+E 13회(조속 진자) · 보스(E) 19회(태엽 심장) · 보스(정수) 19회(태엽 심장) / 강화석 11회
#   10층 | 0.4회 | 2.4회 (최상급 강화석) | E+정수 14회(문지기의 룬) · 정수+E 13회(문지기의 룬) · 보스(E) 19회(심연 심장 파편) · 보스(정수) 19회(심연 심장 파편) / 강화석 11회
#   → +5 는 장비 하나가 1회 안팎, 한 벌이 3~5회 (강화석·정예 재료가 병목 — 제작에도 쓰므로 실제로는 조금 더).
#   → +10 은 장기 목표: 일반 장비 15~25회, 보스 장비는 핵 때문에 그 보스 20회 안팎 (보호 주문서를 쓰면 크게 준다).
#   1~3층 하급 강화석은 떠돌이 상인 핀에게서 살 수 있어 병목이 아니다.
# ─────────────────────────────────────────────────────────────────────────────
version: 1

