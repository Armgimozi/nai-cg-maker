# ── 검사: 보스 장비 vs 같은 층·같은 분류(무기 / 방패 / 흉갑·하의 / 투구·신발) 일반 장비 ─────────
#   +7·+8 귀한 재료가 정예 재료인 보스 장비 60/60종 · 단계마다 재료 등급(일반 < 정수 < 정예 < 핵)이 같은 분류 일반 장비 최고 등급보다 낮은 경우 0건
#   1회 공급량 환산(개수 ÷ 그 재료 1회 공급량, 윗 등급 정수는 정제분 포함)이 같은 분류 일반 장비 중 가장 비싼 것보다 싼 보스 장비 수 (비교 58종 — 그 층에 일반 방패가 없는 방패는 빠짐):
