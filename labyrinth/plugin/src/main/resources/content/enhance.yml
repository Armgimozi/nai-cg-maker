#    4층  녹물 비늘 38 · 소금물 진주 53  | 정예 녹청 등판 3.3  | 정수 미궁 정수 9.5 · 윗 정수 0.6  | 핵 수문의 열쇠 1
#    5층  잿불 비늘 31 · 불씨 혼 46  | 정예 집행관의 칼날 3.3  | 정수 미궁 정수 9.5 · 윗 정수 0.6  | 핵 용광로 핵 1
