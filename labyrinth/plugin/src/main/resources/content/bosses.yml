        - {name: mantle, form: leaf_cluster, size: [26, 10, 18], pivot: [0, 2.1, -0.05], anim: body}
        - {name: head, form: box, size: [9, 9, 9], pivot: [0, 2.25, 0.15], anim: head}
        - {name: arm_left, form: arm, size: [8, 24, 8], pivot: [0.82, 2.05, 0], anim: arm_left}
        - {name: arm_right, form: arm, size: [8, 24, 8], pivot: [-0.82, 2.05, 0], anim: arm_right}
        - {name: legs, form: leg_pair, size: [14, 14, 7], pivot: [0, 0.9, 0], anim: legs_walk}
