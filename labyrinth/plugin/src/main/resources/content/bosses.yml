    arena: {radius: 14, theme: clockwork, shape: clock_face, height: 14, seal_ring_radius: 12}
    lines:
      intro: "<gold>테오라</gold><gray>: 늦었군. 너희에게 남은 시간은 정확히 4분이다.</gray>"
      phase2: "<gold>테오라</gold><gray>: 초침을 서두르겠다. 따라올 수 있겠나?</gray>"
      phase3: "<gold>테오라</gold><gray>: 시간이여, 거꾸로 흘러라!</gray>"
      death: "<gold>테오라</gold><gray>: 시계가... 멈춘다... 처음으로... 평온하군...</gray>"
      doom: "<gold>테오라</gold><gray>: 시간이 다 되었다. 처음으로 돌아가라.</gray>"
    # 점진 힌트 (core/Hints): 흐릿 → 조금 분명 → 거의 정답
    hints:
      - "간수의 봉인은 바늘이 스치는 짧은 순간에만 눈을 뜬다. 잠든 봉인을 깨우려 드는 자는 시간에게 되돌려진다."
      - "금빛으로 깨어난 봉인 위에서 잠시 숨을 고르면 종말의 시계가 한 걸음 물러서고 간수가 휘청인다. 바늘의 끝을 보고 다음 봉인으로 먼저 가 있어라 — 언젠가 바늘은 거꾸로 돈다."
      - "바늘이 봉인석에 닿기 직전 그 위로 가서, 금색으로 빛나는 동안 1.5초 서 있어라(종말 시계 +20초·보스 HP 3%·기절 2초). 어두운 봉인석을 밟으면 5초 전 자리로 끌려가고 시계 −10초. 되감기 메아리는 6초 전 자리에서 터지니 왔던 길로 돌아가지 말고, 진자·톱니는 붉은 선 밖으로."
    rotation:
      1: [hand_strike, pendulum_sweep, rewind_echo]
      2: [hand_strike, pendulum_sweep, rewind_echo, gear_storm]
      3: [hand_strike, pendulum_sweep, rewind_echo, gear_storm]
    patterns:
      hand_strike: {damage: 1.4, angle: 90, length: 5, windup: 0.9, cooldown: 6}
      # 종말 시계(엔레이지): 보스바 아래 카운트다운(난이도 제한 시간 배율). 0 = 전원 최대 HP × zero_damage_pct, 살아남으면 reset_seconds 로 다시.
      # 1분마다 보스 피해 +damage_ramp_per_minute. 이 보스는 기본 광폭화 타이머 대신 이것을 쓴다(enrage 키를 적으면 둘 다).
      doom_clock: {start_seconds: 240, solo_start_seconds: 270, seal_bonus: 20, wrong_penalty: 10, zero_damage_pct: 9.99, reset_seconds: 60, damage_ramp_per_minute: 0.10}
      # 시간 봉인(핵심): 바늘 = 중앙→가장자리, hand_period 초에 한 바퀴(시계 방향, 3페이즈 반대 — reverse_pause 초 멈칫 + fx_hand_reverse 색).
      # 봉인석(seal_ring_radius 링, 반경 seal_radius) 은 바늘이 지날 때 ±window 초 열림(fx_seal_open 금색). 열린 봉인석에 stand_time 초 =
      # 시계 +seal_bonus · 보스 최대 HP × seal_damage_pct · seal_stun 초 기절. 닫힌 봉인석에 closed_grace 초 넘게 = 시간 역류
      # (rewind_seconds 초 전 자리 + rewind_damage 배 + 시계 −wrong_penalty, 사람마다 reversal_cooldown 초). 솔로: 창·서기 시간 완화.
      timed_seals: {seals_base: 4, seals_at_six_or_more: 6, hand_period: 24, p2_hand_period: 16, p3_reverse: true, reverse_pause: 1.5, window: 1.5, solo_window: 2.0, stand_time: 1.5, solo_stand_time: 1.2, seal_radius: 1.6, closed_grace: 0.5, reversal_cooldown: 3.0, seal_damage_pct: 0.03, seal_stun: 2.0, rewind_seconds: 5, rewind_damage: 1.0, hand_width: 1.2, fx_seal: seal_glyph, fx_seal_open: seal_glyph_open, fx_hand: clock_hand, fx_hand_reverse: clock_hand_reverse}
      # 진자 베기: 대상을 지나는 무작위 방향 차선(길이 length, 폭 width). 천장(arm)에 매단 진자가 swings 번 왕복 — 한 번 지날 때(swing_time 초)마다 판정
      pendulum_sweep: {damage: 1.8, width: 3, length: 18, arm: 12, windup: 1.5, swings: 2, swing_time: 1.2, blade_scale: 1.6, depth_scale: 2.5, fx: pendulum, cooldown: 14}
      # 되감기 메아리: 전원, 시전 순간 자리(0.5초 간격 기록의 최신값)에 원 → delay 초 뒤 폭발 (= 터질 때 기준 6초 전 자리)
      rewind_echo: {delay: 6, radius: 2.5, damage: 1.2, record_interval: 0.5, fx: telegraph_circle, cooldown: 18}
      # 톱니 폭풍: lines 줄(아레나를 가로지르는 현, 대상 우선) 위를 거대 톱니가 speed 블록/틱으로 굴러감, 줄마다 0.2초 간격
      gear_storm: {lines_base: 3, lines_per_member: 0.34, lines_max: 8, width: 2, speed: 0.6, damage: 1.3, windup: 1.4, fx: proj_gear_large, cooldown: 16}
    sounds: {ambient: "minecraft:block.copper_bulb.turn_on", hurt: "minecraft:block.copper.hit", death: "minecraft:block.bell.resonate", pitch: 0.5}
    model:
      texture_size: [128, 128]
      parts:
        - {name: torso, form: box, size: [20, 18, 12], pivot: [0, 1.7, 0], anim: body}
        - {name: clockface, form: gear, size: [16, 16, 2], pivot: [0, 1.75, 0.4], anim: spin}
        - {name: head, form: lantern, size: [9, 10, 9], pivot: [0, 2.35, 0.05], anim: head}
        - {name: arm_left, form: arm, size: [8, 24, 8], pivot: [0.85, 2.1, 0], anim: arm_left}
        - {name: arm_right, form: arm, size: [8, 24, 8], pivot: [-0.85, 2.1, 0], anim: arm_right}
        - {name: hand_blade, form: blade, size: [6, 32, 2], pivot: [-0.85, 2.1, 0], anim: arm_right}
        - {name: pendulum, form: tail, size: [5, 22, 5], pivot: [0, 2.0, -0.45], anim: tail}
        - {name: legs, form: leg_pair, size: [14, 14, 7], pivot: [0, 0.9, 0], anim: legs_walk}
      style: {shape: construct, palette: ["#100a06", "#3a2412", "#8a5a26", "#e8b060", "#fff4d0", "#7ae0c0"], features: [clockface_chest, brass_trim, rivets, emissive_core, boss_trim]}

  # ═══════════════════════════════ 지하 10층 ═══════════════════════════════
  floor10_abyss_heart:
    name: "심연의 심장 넬카르"
    floor: 10
    title: "미궁의 근원"
    core: collapse_and_chase
    description: "미궁의 모든 층에 뿌리를 뻗은 검은 심장. 박동할 때마다 바닥이 무너지고, 도망치는 자를 심연의 해일로 집어삼킨다."
    base: IRON_GOLEM
    scale: 2.4
    hp: 95000
    damage: 135
    defense: 56
    speed: 0.0
    phases: [1.0, 0.7, 0.35]
    xp: 30000
    gold: [900, 1400]
    drops: floor10_boss
    bossbar: RED
    # ① 심장실 r18(3×3 타일) ② 추격 회랑 +z 길이 80 폭 7 ③ 심연의 가장자리 단 r12 (+ 바깥 3칸 낭떠러지 — FloorGenerator.RIM_MOAT)
    arena: {radius: 18, theme: abyss, shape: tiled_circle, tile_size: 3, height: 16, corridor_length: 80, corridor_width: 7, rim_radius: 12}
    lines:
      intro: "<dark_aqua>넬카르</dark_aqua><gray>: ...쿵. ...쿵. 너희가 밟고 온 모든 층이, 나의 혈관이다.</gray>"
      phase2: "<dark_aqua>넬카르</dark_aqua><gray>: 도망쳐라. 심연은 언제나 한 걸음 뒤에 있다.</gray>"
      phase3: "<dark_aqua>넬카르</dark_aqua><gray>: 기억하라... 너희가 쓰러뜨린 모든 것을...!</gray>"
      death: "<dark_aqua>넬카르</dark_aqua><gray>: ...쿵. ......쿵. ............</gray>"
    # 점진 힌트 (core/Hints): 흐릿 → 조금 분명 → 거의 정답
    hints:
      - "바닥이 숨을 들이쉴 때 보랏빛이 번지는 곳은 곧 사라진다. 심장이 가라앉으면 뒤돌아보는 자부터 삼켜진다. 끝자락에선 지금까지 쓰러뜨린 것들이 다시 말을 건다."
      - "금 가며 깜빡이는 타일에서 벗어나라 — 무너지는 모양은 매번 바뀐다. 심장이 가라앉으면 남쪽 회랑으로 쉬지 말고 달리고, 끊긴 바닥은 뛰어넘어라. 끝자락의 응시는 같은 방향으로 함께 걸으면 비켜 간다."
      - "심연 붕괴: 보라 타일 2.5초 뒤 실제로 무너짐(떨어지면 최대 HP 25% + 3초간 받는 피해 +20%), 9초마다 흩뿌리기·체스판·동심원·십자·나선. 2페이즈: 회랑 끝 가장자리까지 전력 질주(해일 초당 HP 50%), 낙석 원 피하고 틈 3곳 점프. 회전 응시는 광선이 도는 방향으로 같이 걷기, 균열 원 밖으로. 3페이즈 메아리는 각 층 대응 그대로(돌진 옆으로·포자 흩어지기·꽃 모이기·해일 옆으로·빙창 갈래 사이·되감기 왔던 길 피하기·지우기 보스 뒤로) — 단조 진동은 솟아난 사슬 말뚝 2칸 안에서 웅크려야 낭떠러지로 안 날아간다. 박동은 갈수록 아프니 빨리 끝내기."
    rotation:
      1: [tendril_lash, void_orbs, abyssal_collapse]
      2: [tendril_lash, void_orbs, rotating_gaze, abyss_rift]
      3: [tendril_lash, rotating_gaze, abyss_rift, floor_echoes, heartbeat_pulse]
    patterns:
      tendril_lash: {damage: 1.4, angle: 100, length: 7, windup: 1.0, cooldown: 6}
      void_orbs: {count_base: 2, count_per_member: 0.5, speed: 0.2, homing: 0.06, windup: 0.8, radius: 2, damage: 1.2, lifetime: 8, fx: proj_void_orb, cooldown: 12}
      abyssal_collapse: {tile_size: 3, warn_time: 2.5, regen_time: 15, interval: 9, tiles_per_wave: 0.30, tiles_per_wave_per_member: 0.02, layouts: [scatter, checker, rings, cross, spiral], fall_damage_pct: 0.25, fall_mark_vulnerable: 0.2, fall_mark_duration: 3, fx: telegraph_tile}
      devouring_pursuit: {start_delay: 3, wall_speed: 4.6, wall_accel: 0.05, wall_damage_pct: 0.5, wall_push: 1.2, debris_base: 6, debris_per_member: 1, debris_radius: 2, debris_damage: 1.0, gaps: 3, gap_length: 2, fx_wall: abyss_wall}
      rotating_gaze: {beams: 2, p3_beams: 3, length: 16, width: 1.5, rotation_speed: 30, duration: 8, tick: 0.25, damage_per_tick: 0.5, windup: 2.0, fx: telegraph_line, cooldown: 20}
      abyss_rift: {count_base: 3, count_per_member: 0.5, radius: 3, windup: 1.6, damage: 1.6, linger: 4, linger_dps: 0.3, cooldown: 12}
      heartbeat_pulse: {interval: 30, damage: 0.8, ramp: 0.15}
      floor_echoes: {pool: [rampage_charge, spore_brand, symbiosis_bloom, tidal_sweep, forge_quake, glacial_spikes, rewind_echo, erasure], picks: 1, power: 0.7, windup_mult: 1.2, cooldown: 20}
    sounds: {ambient: "minecraft:entity.warden.heartbeat", hurt: "minecraft:block.sculk.hit", death: "minecraft:entity.warden.death", pitch: 0.5}
    model:
      texture_size: [128, 128]
      parts:
