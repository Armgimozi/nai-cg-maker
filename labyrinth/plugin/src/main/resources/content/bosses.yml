      - "금서 색인: 룬 책장이 빛난 순서대로 책장을 공격(누구든, 틀리면 처음부터·시간 감소). 성공하면 오르벨이 떨어져 기절한다. 먹물 분신: 발밑에 그림자가 있는 쪽이 진짜 — 분신을 치면 먹물이 터져 눈이 멀고, 진짜를 계속 때리면 분신이 사라진다."
