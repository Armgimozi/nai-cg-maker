        - {name: veins, form: tentacle_cluster, size: [40, 20, 40], pivot: [0, 1.0, 0], anim: legs_walk}
        - {name: crown, form: horn_pair, size: [34, 18, 6], pivot: [0, 3.3, 0], anim: body}
        - {name: ring, form: ring, size: [48, 4, 48], pivot: [0, 2.2, 0], anim: orbit}
      style: {shape: colossus, palette: ["#020306", "#08141a", "#123842", "#2fe0d0", "#c8fff8", "#b01a3a"], features: [sculk_veins, veined_eye, emissive_core, heartbeat_glow, boss_trim]}
