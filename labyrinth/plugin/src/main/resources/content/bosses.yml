# ─────────────────────────────────────────────────────────────────────────────
# bosses.yml — 층별 보스 10종 (패턴 로직: bosses/impl/FloorNNBoss.java)
#
# 스키마: ARCHITECTURE.md §6 bosses.yml (+ 추가 필드는 §6 에 기록됨)
#  phases    : HP 비율 경계. [1.0, 0.6, 0.25] = 1페이즈 100~60%, 2페이즈 60~25%, 3페이즈 25~0%
#  rotation  : 페이즈 번호 → 그 페이즈에 쓰는 패턴 키 목록 (스케줄러가 쿨다운 돌아온 것 중 고름)
#  patterns  : 패턴 키 → 파라미터. 공통 규칙(GDD.md "보스 패턴 카탈로그"):
#     damage        = 보스 damage 에 곱하는 배율 (…_pct 는 대상 최대 HP 비율)
#     windup        = 경고 장판 표시 시간(초). 난이도 telegraph 배율이 곱해짐
#     cooldown      = 같은 패턴 재사용 대기(초)
#     *_base + *_per_member = 파티 인원 n 일 때  base + floor((n-1) × per_member)
#     *_per_members: k      = k 명마다 +1  →  base + floor((n-1) / k)
#  core      : 이 보스만의 핵심 기믹 (보스끼리 겹치지 않음 — GDD.md 표 참고)
#  arena     : 보스방 생성 지시 (FloorGenerator/보스 구현이 읽음)
#  bossbar   : Adventure BossBar 색 (PINK|BLUE|RED|GREEN|YELLOW|PURPLE|WHITE)
#  lines     : 등장/페이즈 전환/처치 대사 (MiniMessage)
# 수치(hp/damage)는 솔로·보통 기준. 파티 인원·난이도 배율은 config.
# ─────────────────────────────────────────────────────────────────────────────
version: 1

bosses:

  # ═══════════════════════════════ 지하 1층 ═══════════════════════════════
  floor01_moss_warden:
    name: "이끼 파수꾼 그로브"
    floor: 1
    title: "회랑의 수호자"
    core: destructible_pillars
    description: "회랑을 지키도록 빚어진 이끼 석상. 침입자를 향해 맹목적으로 돌진한다 — 그 앞을 막는 것이 무엇이든."
    base: IRON_GOLEM
    scale: 1.6
    hp: 2400
    damage: 14
    defense: 8
    speed: 0.24
    phases: [1.0, 0.6, 0.25]
    xp: 400
    gold: [80, 120]
    drops: floor01_boss
    bossbar: GREEN
    arena: {radius: 14, theme: mossy, shape: circle, height: 9}
    lines:
      intro: "<green>그로브</green><gray>: ...회랑을... 더럽히는 자... 짓밟는다...</gray>"
      phase2: "<green>그로브</green><gray>: 뿌리여, 깨어나라!</gray>"
      phase3: "<green>그로브</green><gray>: 쓰러지지... 않는다...!</gray>"
      death: "<green>그로브</green><gray>: 이끼는... 다시... 자란다...</gray>"
    rotation:
      1: [vine_lash, root_snare, rampage_charge]
      2: [vine_lash, root_snare, rampage_charge, spore_burst, sproutling_call]
      3: [vine_lash, rampage_charge, spore_burst, sproutling_call]
    patterns:
      vine_lash: {damage: 1.3, angle: 90, length: 6, windup: 1.0, cooldown: 6}
      root_snare: {damage: 0.8, radius: 2.0, windup: 1.4, root: 2.0, count_base: 2, count_per_member: 0.34, cooldown: 11}
      rampage_charge: {damage: 2.0, mark_time: 2.0, width: 3.0, speed: 1.4, max_distance: 28, stun: 4.0, vulnerable: 0.5, wall_recover: 1.0, knockback: 1.2, cooldown: 16}
      moss_pillars: {count: 4, extra_per_members: 4, ring_radius: 8, pillar_radius: 1, height: 5, crashes_to_break: 1, block: MOSSY_STONE_BRICKS, crack_block: CRACKED_STONE_BRICKS}
      spore_burst: {damage: 1.0, radius: 6, windup: 1.5, effect: poison, effect_duration: 4, cooldown: 14}
