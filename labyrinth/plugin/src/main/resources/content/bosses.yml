    core: shield_break_roles
    description: "얼음관에서 깨어난 옛 여제. 위기가 오면 얼음 껍질에 숨어 모든 것을 얼리는 주문을 왼다 — 세 가지 다른 힘으로만 깰 수 있다."
    base: HUSK
    scale: 1.8
    hp: 26000
    damage: 60
    defense: 28
    speed: 0.22
    phases: [1.0, 0.7, 0.35]
    xp: 8000
    gold: [380, 560]
    drops: floor06_boss
    bossbar: BLUE
    arena: {radius: 15, theme: frost, shape: circle, height: 12, sigil_ring_radius: 10, floor_thaw: true}
    lines:
      intro: "<aqua>시린</aqua><gray>: 감히 내 잠을 깨우다니. 영원히 얼어붙어 내 정원의 조각상이 되거라.</gray>"
      phase2: "<aqua>시린</aqua><gray>: 절대영도 앞에선 모든 것이 멈춘다!</gray>"
      phase3: "<aqua>시린</aqua><gray>: 다시 한번... 겨울을!</gray>"
      death: "<aqua>시린</aqua><gray>: 봄이... 오는가...</gray>"
    # 점진 힌트 (core/Hints): 흐릿 → 조금 분명 → 거의 정답. 게임 안 공지·이름표는 조작법을 말하지 않는다
    hints:
      - "여제의 숨은 멈춘 것부터 얼린다. 얼음 껍질 둘레의 세 빛깔 인장은 저마다 다른 손길만 받아들인다."
      - "붉은 인장은 칼날을, 초록 인장은 날아드는 것을, 보라 인장은 마력을 기다린다 — 주문이 끝나기 전에 셋을 모두 깨라. 얼어붙은 동료는 두드려 깨우고, 하늘색 얼음판에선 발을 미리 정해 두어라."
      - "빙결 껍질: 절대영도 시전(12초) 안에 ⚔ 붉은 인장 = 근접, 🏹 초록 = 화살·투사체, ✦ 보라 = 마법으로 깨면 시린이 기절하고 받는 피해가 늘어난다(맞는 직업이 없거나 솔로면 아무 공격이나). 가만히 있으면 동상이 쌓여 빙결 — 동료가 4번 때리거나 사제 정화로 푼다. 빙창은 갈래 사이로, 눈보라는 붉은 우박 원 밖으로, 영구 동토 얼음판 위에선 미끄러진다."
    rotation:
      1: [scepter_sweep, glacial_spikes, frostbite]
      2: [scepter_sweep, glacial_spikes, frostbite, blizzard]
      3: [scepter_sweep, glacial_spikes, frostbite, blizzard, permafrost]
    patterns:
      scepter_sweep: {damage: 1.3, angle: 80, length: 5, windup: 0.8, cooldown: 6}
      # 빙창: 보스→대상(무작위, 솔로는 본인) 선. 3페이즈 3갈래(35°). 갈래가 겹쳐도 한 번만 맞음. fx = 날아가는 얼음 창, fx_spike = 솟는 가시
      glacial_spikes: {damage: 1.4, width: 2, length: 16, windup: 1.2, count: 1, p3_count: 3, p3_spread: 35, target: random, cooldown: 8, fx: proj_frost_shard, fx_spike: ice_spike}
      # 동상: 2초마다 1.5칸 미만 이동 = 서리 1중첩(6초 유지), 5중첩 = 4초 빙결(상태이상 서비스 — 동료 4회 타격으로 해방, 정화로 중첩 제거)
      frostbite: {interval: 2.0, move_threshold: 1.5, max_stacks: 5, freeze: 4.0, break_hits: 4, stack_decay: 6.0, fx: ice_block}
      # 빙결 껍질(핵심): trigger_phases 진입 시. role_damage = classes.yml role → 그 직업이 깰 수 있는 인장 유형
      glacier_shell: {trigger_phases: [2, 3], cast_time: 12, solo_cast_time: 16, wipe_damage: 9.0, sigil_hp: 900, sigil_hp_per_member: 0.6, sigils: [melee, ranged, magic], missing_role_hp_mult: 1.5, shatter_stun: 6.0, shatter_vulnerable: 0.3, glare_damage: 0.6, glare_interval: 2.0, role_damage: {tank: melee, melee: melee, assassin: melee, ranged: ranged, magic: magic, healer: magic}, fx_shell: ice_shell, fx_sigil_melee: frost_sigil_melee, fx_sigil_ranged: frost_sigil_ranged, fx_sigil_magic: frost_sigil_magic, fx_glare: rime_beam, fx_tether: rime_beam}
      # 눈보라: duration 동안 waves 번 우박(사람 발밑 절반 + 무작위). 우박 수 = hail_base + floor((n-1) × hail_per_member)
      blizzard: {hail_base: 6, hail_per_member: 1, hail_max: 20, hail_radius: 2, hail_damage: 1.0, windup: 1.2, duration: 10, waves: 4, visibility_particles: 40, cooldown: 25, fx: proj_frost_shard}
      # 영구 동토: 3×3 타일 coverage 비율이 얼음판(인스턴스 = 실제 block, 그 밖 = 관성 흉내: slide_strength 입력 반영률·slide_retention 속도 유지율)
      permafrost: {tile_size: 3, coverage: 0.3, slide_strength: 0.12, slide_retention: 0.9, slide_max_speed: 0.5, block: BLUE_ICE, windup: 1.0, duration: 15, fx: telegraph_tile_ice, cooldown: 30}
    sounds: {ambient: "minecraft:entity.stray.ambient", hurt: "minecraft:block.glass.hit", death: "minecraft:block.glass.break", pitch: 0.7}
    model:
      texture_size: [128, 128]
      parts:
        - {name: gown, form: cloak, size: [14, 24, 12], pivot: [0, 1.0, 0], anim: float}
        - {name: torso, form: box, size: [9, 10, 6], pivot: [0, 1.55, 0], anim: body}
        - {name: head, form: rounded, size: [8, 9, 8], pivot: [0, 1.95, 0], anim: head}
        - {name: crown, form: crystal_cluster, size: [12, 8, 10], pivot: [0, 2.3, 0], anim: head}
        - {name: arm_left, form: arm, size: [3, 13, 3], pivot: [0.4, 1.8, 0], anim: arm_left}
        - {name: arm_right, form: arm, size: [3, 13, 3], pivot: [-0.4, 1.8, 0], anim: arm_right}
        - {name: scepter, form: blade, size: [4, 28, 4], pivot: [-0.4, 1.8, 0], anim: arm_right}
        - {name: shards, form: ring, size: [30, 6, 30], pivot: [0, 1.4, 0], anim: orbit}
      style: {shape: wraith, palette: ["#101828", "#2a4466", "#6a9ad0", "#bfe6ff", "#ffffff", "#c8b4ff"], features: [frost_rime, translucent, veil, emissive_core, boss_trim]}

  # ═══════════════════════════════ 지하 7층 ═══════════════════════════════
  floor07_dyad:
    name: "양극의 수정체 다이아드"
    floor: 7
    title: "빛과 그림자의 공명"
    core: polarity
    description: "빛과 어둠이 한 몸에서 공명하는 거대한 수정. 같은 색은 감싸 주고 다른 색은 찢어발긴다."
    base: BLAZE
    flying: true
    scale: 2.0
    hp: 36000
    damage: 75
    defense: 34
    speed: 0.20
    phases: [1.0, 0.6, 0.3]
    xp: 11000
    gold: [460, 680]
    drops: floor07_boss
    bossbar: PURPLE
    arena: {radius: 16, theme: crystal, shape: circle, height: 14, pylons: 4}
    lines:
      intro: "<white>다이아드</white><gray>: </gray><yellow>빛이여</yellow><gray>... </gray><dark_purple>그림자여</dark_purple><gray>... 이 불협화음을 조율하라.</gray>"
      phase2: "<white>다이아드</white><gray>: 갈라진 빛은 서로를 찾는다.</gray>"
      phase3: "<white>다이아드</white><gray>: 공명이... 붕괴한다...!</gray>"
      death: "<white>다이아드</white><gray>: 마침내... 하나의 음으로...</gray>"
    # 점진 힌트 (보스 문구 규칙): 실패가 쌓일수록 1 → 2 → 3 단계 단서. 게임 안 공지·이름표는 조작법을 말하지 않는다
    hints:
      - "다이아드는 두 얼굴로 노래한다. 같은 빛깔은 감싸 주고, 다른 빛깔은 찢어발긴다."
      - "파동이 차오르는 색을 보라. 그 색 기둥에 닿은 자는 파동을 흘려보낸다 — 광선도 같은 빛깔의 몸 앞에서 멈추고, 얼굴과 다른 빛깔의 칼날이 더 깊이 박힌다."
      - "극성 파동은 같은 색만 무사하니 경고가 끝나기 전에 그 색 기둥에 닿아라(기둥은 5초에 한 번). 광선은 같은 색 동료가 대상과 보스 사이를 막으면 약해지고, 굴절 껍질이 있는 동안 얼굴과 같은 색은 손을 떼라."
    rotation:
      1: [shard_orbit, crystal_rain, polarity_wave]
      2: [shard_orbit, crystal_rain, polarity_wave, split_beam]
      3: [shard_orbit, crystal_rain, polarity_wave, split_beam, prism_refraction]
    patterns:
      # 극성 배정·기둥 (상시): 기둥 = 동·서 양쪽에 빛·어둠 한 쌍씩(pylons 총 수, 쌍 안 간격 pair_spread 도), 닿으면 그 색(개인 재사용 swap_cooldown 초)
      polarity_assign: {mode: alternate, swap_cooldown: 5, pylons: 4, pair_spread: 28, pylon_radius: 1.5, pylon_ring_radius: 12, pylon_scale: 1.6, fx_light: pylon_light, fx_dark: pylon_dark, fx_mark_light: marker_light, fx_mark_dark: marker_dark}
      # 보스 얼굴 (상시): interval 초마다(3페이즈 p3_interval) 빛↔어둠, 전환 warn 초 전 예고. 반대 극성 +opposite_bonus, 같은 극성 −same_penalty
      face_shift: {start: dark, interval: 20, p3_interval: 10, warn: 2, opposite_bonus: 0.25, same_penalty: 0.5}
      # 핵심: 아레나 전체 색 경고 → 같은 극성 무피해, 다른 극성 damage 배. 3페이즈 p3_gap 초 간격 반대 색 2연속 (첫 파동이 기둥 재사용 초기화)
      polarity_wave: {damage: 3.0, windup: 3.0, p3_double: true, p3_gap: 2.5, p3_reset_swap: true, fx_light: telegraph_light, fx_dark: telegraph_dark, cooldown: 15, weight: 1.3}
      # 빛 광선 → 어둠 대상, 어둠 광선 → 빛 대상 (솔로 1줄). 같은 극성이 끼어들면 soak_damage 배만 받고 흡수, 아무도 없으면 대상 damage 배
      split_beam: {damage: 3.0, soak_damage: 0.6, width: 1.5, length: 22, windup: 2.5, fx_light: telegraph_beam_light, fx_dark: telegraph_beam_dark, fx_beam_light: beam_light, fx_beam_dark: beam_dark, cooldown: 18}
      # 3페이즈: duration 초 수정 껍질 — 얼굴과 같은 극성 공격은 피해의 reflect_ratio 반사 (1회 반사 상한 = 공격자 최대 HP × reflect_cap_pct)
      prism_refraction: {duration: 6, reflect_ratio: 0.5, reflect_cap_pct: 0.4, windup: 1.0, fx: refraction_shell, cooldown: 25}
      crystal_rain: {count_base: 4, count_per_member: 1, radius: 2.5, damage: 1.2, windup: 1.3, fx: proj_crystal, cooldown: 10}
      shard_orbit: {damage: 0.8, radius: 4, duration: 3, tick: 0.5, windup: 1.0, shards: 6, fx: proj_crystal, cooldown: 12}
    sounds: {ambient: "minecraft:block.amethyst_block.resonate", hurt: "minecraft:block.amethyst_block.hit", death: "minecraft:block.amethyst_block.break", pitch: 0.6}
    model:
      texture_size: [128, 128]
      parts:
        - {name: core, form: crystal_cluster, size: [18, 30, 18], pivot: [0, 1.6, 0], anim: float}
        - {name: light_half, form: crystal_cluster, size: [12, 22, 10], pivot: [0.45, 1.7, 0], anim: pulse}
        - {name: dark_half, form: crystal_cluster, size: [12, 22, 10], pivot: [-0.45, 1.7, 0], anim: pulse}
        - {name: ring_inner, form: ring, size: [34, 3, 34], pivot: [0, 1.6, 0], anim: spin}
        - {name: ring_outer, form: ring, size: [44, 2, 44], pivot: [0, 1.6, 0], anim: orbit}
      style: {shape: floating, palette: ["#0c0814", "#2a1e48", "#6a4ab8", "#fff2b0", "#ffffff", "#140c24"], features: [crystal_growth, prism_glint, emissive_core, dual_tone, boss_trim]}

