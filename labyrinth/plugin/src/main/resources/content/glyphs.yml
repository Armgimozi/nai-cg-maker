version: 1

# ═══════════════════════════════════════════════════════════════════════════════════════════════
#  glyphs.yml — 커스텀 UI 폰트 labyrinth:ui (assets/labyrinth/font/ui.json) 의 단일 원본
#  리소스팩 생성기(resourcepack/src/ui.py)가 file 별 그림을 직접 그리고(전부 자체 제작 픽셀아트),
#  플러그인은 Component.text(char).font(labyrinth:ui) 로 쓴다 (ui.Glyphs). 하드코딩 금지 — id 로 찾을 것.
#
#  필드: char = 사설 영역 1글자(U+E000~U+F3FF), file = textures/font/ui/ 아래 PNG, ascent/height = 바닐라
#  bitmap 프로바이더 값(그림 높이 = height → 배율 1), advance = 클라이언트가 계산하는 글자 폭(px, 다음 글자까지).
#  advance 는 생성기가 PNG 로 검증한다(가장 오른쪽 불투명 열 + 2). 그림보다 height 가 크면 아래쪽에 투명
#  줄을 덧대어(ascent <= height 규칙을 지키며) 글리프를 줄 위로 띄운다.
#
#  좌표 규칙 (26.3 클라이언트 바이트코드로 확인): 글리프 윗변 y = 글줄 y + 7 − ascent.
#   - 상자 GUI: 제목 글줄 = 창 왼쪽 위 + (8, 6). 슬롯 아이템 = (8 + 18·열, 18 + 18·행).
#     플레이어 인벤토리 = y 행수·18 + 31 (+18/줄), 핫바 = 행수·18 + 89, "인벤토리" 글자 = (8, 높이 − 94).
#   - 액션바: 글줄 y = 화면높이 − 72, 가로는 전체 폭(advance 합)의 가운데 정렬.
#
#  ── 메뉴 제목 조합 (ui.Glyphs.menuTitle) ──
#   제목 = space(−8) + gui_<id> + space(−(176+1) + 8 = −169) + 제목 글자
#   → 배경 왼쪽 위가 창 왼쪽 위(ascent 13: 6 + 7 − 13 = 0)에 정확히 깔리고 제목 글자는 원래 자리(8, 6)에 온다.
#   배경은 어두운 돌이므로 제목 글자색은 아래 menus.<id>.title_color 를 쓸 것(밝은 양피지색).
#   Java: Glyphs.menuTitle("gui_stats", 176, Text.mm("<#f3e3bd>스탯 배분"))  ← 폭은 항상 176.
#   배경이 플레이어 인벤토리 부분까지 덮는다(같은 디자인). 바닐라 "인벤토리" 글자 자리는 밝은 명판으로 비워 둠.
#   글리프가 아이템보다 먼저 그려지므로 슬롯 아이템·커서·툴팁은 배경 위에 정상 표시된다.
#
#  ── HUD 액션바 조합 (hud: 블록이 수치 원본) ──
#   좌표 x 는 핫바 왼쪽 끝 기준 0..181 (핫바 = 화면 가운데 ±91). 전체 advance 를 정확히 hud.total(182)로
#   맞추면 시작점 = 가운데 − 91 = 핫바 왼쪽 끝. 조합법: 요소마다 space(x − 펜위치) + 글리프, 펜 += advance,
#   마지막에 space(182 − 펜위치). 숫자는 hud_num_*(바 안·레벨 배지 안 줄) / gold_num_*(골드 줄) 고정폭 7px
#   (점·쌍점 4px). 바 안 숫자 가운데 정렬: x = 바x + (82 − (글자수·7 − 1)) / 2.
#   **그림자 끄기 필수**: 액션바는 글자 그림자를 그린다 → 글리프 컴포넌트에 shadowColor(ShadowColor.none())
#   (MiniMessage 는 <!shadow>). 색 지정 없이(흰색) 쓰면 텍스처 색 그대로. 숫자는 흰 바탕이라 color 로 물들일 수 있다.
#   세로 배치(화면 아래 기준): 상태/골드 줄 H−76..H−68 · 레벨 배지 H−66..H−51 · HP/MP 바 H−63..H−55 ·
#   경험치 줄 H−52..H−50 · (바닐라 갑옷 줄 H−49, 하트 H−39, 핫바 H−22 와 안 겹침).
#
#  ── 보스바 ──
#   이름 = boss_ornament_left + space(2) + 보스 이름 + space(2) + boss_ornament_right  (좌우 대칭 → 자동 가운데)
#   boss_frame 은 이름 **전체**로 쓰면(다른 글자 없이) 182×5 막대를 정확히 감싸는 금테가 된다(가운데 창 투명).
#   예: 보호막·광폭 게이지 같은 두 번째 보스바의 이름으로.
#
#  ── 기타 ──
#   party_hp_00..10 (33×5) · party_class_<직업> (7×7): 사이드바/탭/채팅 줄 높이에 맞춤(ascent 5 / 7).
#   dmg_* / crit_* (10×12) · dmg_icon_*: 피해 숫자 TextDisplay 용 (font labyrinth:ui, 배경 투명 권장).
#   status_<효과> (9×9): 액션바 상태 줄(H−76). 효과 id = GDD §9.2 + 버프(buff_*), stealth.
#
#  공백: spaces 의 값 v → 문자 U+F800 + v (−1024..255, U+F400..U+F8FF 예약). Glyphs.space(px) 가 큰 값부터
#  조합하므로 2의 거듭제곱 ±1..±512, −1024 와 자주 쓰는 −169·−177 을 둔다.
# ═══════════════════════════════════════════════════════════════════════════════════════════════

