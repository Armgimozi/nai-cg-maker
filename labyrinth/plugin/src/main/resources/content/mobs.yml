  # 미로 상자·보물방 상자 중 미믹을 처음 열면 상자가 사라지고 그 자리에서 이 몹이 튀어나온다 (dungeon/treasure/MimicSpec).
  #  floor 0 = 어느 층에나 나옴. 아래 hp·damage·defense·xp·gold 는 도감에 보이는 1층 무렵 값일 뿐이고, 실제 수치는
  #  mimic: {hp, damage, defense, xp, gold} = 나오는 층 일반 몹(floors.yml mobs) 평균 × 배율 (난이도·인원·솔로 배율은 다른 몹처럼 그 위에).
  #  mimic.floors = 이 미믹이 나오는 층 [처음, 끝] (없으면 큰 미믹으로는 안 나옴), mimic.companion = 함께 튀어나오는 작은 미믹 (한 마리).
  #  attack_interval 은 그 층 일반 몹 평균을 따른다 (1층 1.5초 · 2층 1.35초 · 그 밖 1.2초).
  #  모델: 몸통(상자 아래) + 뚜껑(anim lid — 뒤 경첩에서 열리는 위턱: 딱딱 씹기 · 크게 벌려 물기 · 깡충 뛸 때 덜컥 · 죽으면 닫힘)
  #  + 혀(앞으로 늘어진 진자). 다리 없이 깡충깡충 뛴다 (RigMath: lid 가 있고 다리가 없으면 걸음 = 뛰기).

