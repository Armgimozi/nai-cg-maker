# ─────────────────────────────────────────────────────────────────────────────
# mobs.yml — 일반 몹 60종 + 엘리트 10종 + 소환물 6종 + 미믹 3종 (전부 자체 디자인)
#   층마다 새 몸 형태 2종: 드래곤(드레이크·와이번·고룡)·용인족·땅굴웜·하피·켄타우로스·나가·리치·미노타우로스
#
# 스키마: ARCHITECTURE.md §6 mobs.yml (+ 추가 필드는 §6 에 기록됨)
#  rank     : normal | elite | add   (add = 보스/엘리트가 소환하는 하수인, 층 몹 목록엔 없음)
#  base     : 히트박스·길찾기용 바닐라 엔티티 (투명·무음·바닐라 공격 제거, 사망은 remove())
#  flying   : true 면 비행형 (Java 가 중력 끄고 대상 위 1.5~3칸에서 맴돌게 함)
#  hp/damage/defense : 솔로·보통 난이도 기준. 파티/난이도 배율은 config
#  attack_interval : 기본 공격 간격(초, 없으면 1.2). 떼(swarm)는 ×0.85, 원거리 기본탄은 +0.8초 (MobAi.attackInterval)
#  skills[] : {type, cooldown, params} — type 은 GDD.md "Mob skill types" 의 닫힌 목록
#             params.damage 는 이 몹 damage 에 곱하는 배율, windup 은 경고 표시 시간(초)
#             cooldown 0 인 타입(explode_on_death, split_on_death, enrage, ambush, aura)은 패시브
#             summon 의 count·max_alive 는 solo_count·solo_max_alive 가 있으면 1인일 때 그 값 (파티는 그대로, GDD §8.4)
#  sounds   : 바닐라 사운드 키 + pitch (자체 사운드 파일 없음, 피치로 개성)
#  model    : parts[].{name, form, size[px], pivot[블록, scale 1 기준], anim}
#             form/anim/shape/features 는 GDD.md "Pack generator templates" 의 닫힌 목록
#             같은 pivot + 같은 anim 을 가진 파트는 한 덩어리처럼 함께 움직인다 (무기를 팔에 붙일 때)
#             붙음: anim neck·tail_chain 파트는 YAML 순서대로 사슬(뿌리 → 끝), 머리(name head)는 목 끝에,
#             anim head 인 다른 파트·jaw 는 머리에 붙어 함께 돈다. 날개(form wing + wings_flap)는 pivot X 부호로 좌(+)/우(−)
# 수치 곡선(일반 몹 기준): GDD.md "밸런스 곡선" 표
# ─────────────────────────────────────────────────────────────────────────────
