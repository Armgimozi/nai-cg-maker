# ─────────────────────────────────────────────────────────────────────────────
# loot.yml — 루팅 테이블 (LootService, 개인 루팅: 파티원마다 따로 굴리고 따로 지급)
#
# 스키마: ARCHITECTURE.md §6 loot.yml (+ 추가 필드는 §6.2). 해석 규칙 전체 = GDD §11.10
#  tables.<id>      : 몹 id(mobs.yml drops) / floorNN_boss / treasure_floor_N / gimmick_floor_N / 공용 하위 테이블
#    rolls          : entries 를 몇 번 굴리나. 한 번 굴릴 때마다 각 항목이 자기 chance 로 따로 판정(여러 개 동시 가능)
#    guaranteed     : 확률·배율 없이 항상 1번 지급 (보스 핵·재료, 기믹방 정수)
#    gold           : 상자 골드 [최소, 최대] (몹·보스 골드는 mobs.yml/bosses.yml 의 gold)
#    entries[] 종류 (닫힌 목록):
#      {item: id, chance, amount}                     특정 아이템. amount = 정수 또는 [최소, 최대] (기본 1)
#      {rarity_pool: 희귀도, floor: N, chance}        items.yml 에서 floor == N, rarity 일치, pool != false 인 장비 중 1개
#      {one_of: [id, ...], chance}                    목록 중 1개 (보스 전용 장비 묶음)
#      {table: 하위테이블, chance}                    다른 테이블을 통째로 굴림 (순환 금지)
#    공통 선택 키: min_difficulty: easy|normal|hard|nightmare  (그 난이도 이상에서만 판정)
#  최종 확률 = min(1, chance × 난이도 drop × 파티 보상 배율 × (1 + LUK × luck_per_point) × rarity_weight)
#  (guaranteed 와 chance 1.0 항목은 배율 무관. rarity_weight 는 장비 항목에만)
# ─────────────────────────────────────────────────────────────────────────────
version: 1

settings:
  own_class_bias: 0.65        # 장비 1개를 고를 때(rarity_pool·one_of) 이 확률로 '루팅한 사람 직업이 쓸 수 있는 장비'만 후보 (없으면 전체)
  luck_per_point: 0.005       # LUK 1점당 드롭 확률 +0.5% (GDD §3)
  party_bonus_per_member: 0.05   # 파티원 1명 추가마다 드롭 확률 +5% (config party.reward_per_member 가 있으면 그쪽 우선)
  max_chance: 1.0
  rarity_weight:              # 난이도별 장비 희귀도 확률 배율 (config difficulties.drop 에 추가로 곱함). 없는 칸 = 1.0
    easy:      {rare: 0.9, epic: 0.8, legendary: 0.7}
    normal:    {}
    hard:      {epic: 1.1, legendary: 1.2}
    nightmare: {epic: 1.2, legendary: 1.4}          # 신화는 rarity_weight 없음 (min_difficulty + 난이도 drop 배율만)
  announce_rarity: legendary  # 이 희귀도 이상을 얻으면 파티 채팅 + 효과음 (신화는 서버 방송)

