    entries:
      - {item: healing_potion, chance: 0.6, amount: [1, 2]}
      - {item: mana_potion, chance: 0.5, amount: [1, 2]}
      - {item: minor_healing_potion, chance: 0.2, amount: [1, 3]}
  potions_t3:
    rolls: 1
    entries:
      - {item: greater_healing_potion, chance: 0.55, amount: [1, 2]}
      - {item: greater_mana_potion, chance: 0.45, amount: [1, 2]}
      - {item: healing_potion, chance: 0.25, amount: [1, 2]}
  scrolls:
    rolls: 1
    entries:
      - {item: return_scroll, chance: 1.0}
  tonics:
    rolls: 1
    entries:
      - {item: cleansing_draught, chance: 0.5}
      - {item: fortitude_tonic, chance: 0.25}
      - {item: fury_tonic, chance: 0.25}
