# ─────────────────────────────────────────────────────────────────────────────
# loot.yml — 루팅 테이블 (LootService, 개인 루팅: 파티원마다 따로 굴리고 따로 지급)
#
# 스키마: ARCHITECTURE.md §6 loot.yml (+ 추가 필드는 §6.2). 해석 규칙 전체 = GDD §11.10
#  tables.<id>      : 몹 id(mobs.yml drops) / floorNN_boss / treasure_floor_N / gimmick_floor_N / maze_chest_<tier>_f<N> / 공용 하위 테이블
#                     (band_tNN_* 단계 풀 · mix_fNN_drop · hoard_fNN · special_trial_fNN · potions_* · enhance_* …)
#    rolls          : entries 를 몇 번 굴리나. 한 번 굴릴 때마다 각 항목이 자기 chance 로 따로 판정(여러 개 동시 가능)
#    guaranteed     : 확률·배율 없이 항상 1번 지급 (보스 핵·재료, 기믹방 정수)
#    gold           : 상자 골드 [최소, 최대] (몹·보스 골드는 mobs.yml/bosses.yml 의 gold)
#    entries[] 종류 (닫힌 목록):
#      {item: id, chance, amount}                     특정 아이템. amount = 정수 또는 [최소, 최대] (기본 1)
#      {rarity_pool: 희귀도, floor: N, chance}        items.yml 에서 floor == N, rarity 일치, pool != false 인 장비 중 1개
#                                                     — 쓰지 않는다 (층·경로가 섞여서). 장비는 아래 명시 목록으로만 준다
#      {one_of: [id, ...], chance}                    목록 중 1개 (공용 무기 · 정예 방어구 · 보스 고유 장비 묶음, guaranteed 에 두면 확정 1개)
#      {table: 하위테이블, chance}                    다른 테이블을 통째로 굴림 (순환 금지)
#      {pick: [{table: 하위테이블, weight: n}, …], chance}   chance 를 넘으면 무게대로 하위 테이블 하나를 골라 굴림 (0.3.5, 순환 금지)
#      {blueprint: 단계, chance}                     도안 하나 (0.3.6) — 희귀 이상 장비 레시피 중 결과 단계가 그 단계 ±1 인 것, 이웃 단계 몫 2 : 7 : 1 (tools/gen_036_blueprints.py)
#    공통 선택 키: min_difficulty: easy|normal|hard|nightmare  (그 난이도 이상에서만 판정)
#  최종 확률 = min(1, chance × 난이도 drop × 파티 보상 배율 × (1 + LUK × luck_per_point) × rarity_weight)
#  (guaranteed 와 chance 1.0 항목은 배율 무관. rarity_weight 는 장비 항목에만 — 단계 풀 band_tNN_* 안의 one_of(chance 1.0)에는 안 붙는다)
#
# 장비 획득 규칙 (0.3.5 — 장비에 층 이름표가 없다, gear_spec §4):
#  장비 단계(items.yml tier) N 은 레벨 구간 Lv 5N−5 ~ 5N. 보스가 아닌 장비는 단계 풀 band_tNN_<종류> 에 들어가고,
#  층 f 는 이웃 단계 f−1 : f : f+1 = 2 : 7 : 1 로 섞어 준다 (특별 시련 1 : 8 : 1) — {pick: [{table, weight}, …], chance} 항목.
#  몬스터·상자 = mix_fNN_drop (일반 몹·보물방·미로 상자가 {table:} 로 굴림) → band_tNN_drop
#  시련방 = gimmick_floor_N 의 PICK → band_tNN_trial · 정예 = 정예 표의 PICK → band_tNN_elite (방어구 세트·방패·장신구·정예 무기)
#  금고·미믹 = hoard_fNN (금고 안 상자·길들인 미믹을 열 때 한 번 더) · 특별 시련 = special_trial_fNN (조건까지 지킨 시련방 성공 상자)
#  보스 고유 장비는 그 보스 표에만 (이웃 층 없음). 두 번째 집은 대장간(recipes.yml)
#  영웅·전설·신화 무기는 획득처 종류 1개 (보스 · 대장간 · 몬스터·상자 · 시련방 · 특별 시련 · 금고·미믹 · 정예)
#  드롭 편향 own_build_bias: one_of 로 장비를 고를 때 이 확률로 '요구치가 가장 큰 능력치가 줍는 사람 능력치 상위 2개 안'인 후보만 (없으면 전체)
# ─────────────────────────────────────────────────────────────────────────────
version: 1

settings:
  own_build_bias: 0.65        # 장비 1개를 고를 때(one_of) 이 확률로 요구치 1위 능력치가 줍는 사람 능력치(기본+분배+칭호) 상위 2개 안인 후보만 (없으면 전체)
  luck_per_point: 0.005       # LUK 1점당 드롭 확률 +0.5% (GDD §3)
  party_bonus_per_member: 0.05   # 파티원 1명 추가마다 드롭 확률 +5% (config party.reward_per_member 가 있으면 그쪽 우선)
  max_chance: 1.0
  rarity_weight:              # 난이도별 장비 희귀도 확률 배율. 없는 칸 = 1.0 — 0.3.5.2: 보상은 난이도와 상관없이 같음 (모두 1.0)
    easy:      {}
    normal:    {}
    hard:      {}
    nightmare: {}
  announce_rarity: legendary  # 이 희귀도 이상을 얻으면 파티 채팅 + 효과음 (신화는 서버 방송)

