  # 확률·개수는 여기 한 곳에서 고치면 전체에 적용된다. t1 = 지하 1~3층(하급 강화석) · t2 = 4~7층(상급) · t3 = 8~10층(최상급).
  # mob = 일반 몹 · swarm = 떼 몹(×0.7) · elite = 정예 · boss = 보스 · chest = 보물방 · gimmick = 기믹방 상자
  # preview = 3층·7층 보스가 다음 구간 강화석을 미리 맛보게 주는 몫. 보호 주문서는 정예·보스만(드물게).
