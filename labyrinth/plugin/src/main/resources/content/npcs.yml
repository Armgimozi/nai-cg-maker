# ─────────────────────────────────────────────────────────────────────────────
# npcs.yml — NPC (Mannequin + 자체 제작 64x64 스킨)
#
# 스키마: ARCHITECTURE.md §6 npcs.yml (+ 추가 필드는 §6 에 기록됨)
#  role       : entrance | blacksmith | class_master | title_keeper | merchant | lore
#               (lore = 층 안 휴식방에 서 있는 이야기 NPC, 우클릭 시 대사 순환. 공략은 수수께끼처럼 돌려 말한다 —
#                파티가 그 층 보스에서 실패할수록 bosses.yml hints 단서를 첫 줄로 덧붙인다: GDD "보스 문구 규칙")
#  skin       : textures/entity/npc/<skin>.png  (리소스팩 생성기가 skin_style 로 그림)
#  skin_style : 생성기 지시 — outfit/hair/accessories 값은 GDD.md "Pack generator templates" 닫힌 목록
#               palette 순서: [피부, 머리카락, 옷 주색, 옷 보조색, 장식/금속, 눈]
#  nameplate  : 이름 위에 뜨는 직함 줄 (MiniMessage)
#  placement  : overworld(관리자가 /labadmin setnpc 로 배치) | floor(해당 층 휴식방에 자동 배치)
#  dialogue   : 우클릭 시 차례로 보여 줄 대사 (메뉴 NPC 는 메뉴를 연 뒤 액션바/채팅에 1줄)
#  shop       : merchant 전용. item(items.yml id), price(골드), level_req(선택)
# ─────────────────────────────────────────────────────────────────────────────
version: 1

npcs:

  # ═══════════════════════════ 오버월드 입구 NPC ═══════════════════════════

  guide:
    name: "미궁 안내인 벨라"
    nameplate: "<gradient:#7fa043:#c9d98a>[미궁 안내인]</gradient>"
    skin: guide
    role: entrance
    placement: overworld
    skin_style:
      palette: ["#f1c9a5", "#3b2a20", "#3f5a23", "#c9d98a", "#d9b25a", "#2f6b3a"]
      outfit: robe
      hair: long_braid
      accessories: [hood_down, lantern_belt, satchel]
    dialogue:
      - "<gray>어서 와요, 모험가님. 이 아래가 바로 <gold>미궁 라비린스</gold>예요.</gray>"
      - "<gray>혼자 들어가도 되고, 동료와 <yellow>파티</yellow>를 맺어 함께 들어가도 돼요. 인원이 많을수록 미궁도 더 사나워지죠.</gray>"
      - "<gray>층의 주인을 쓰러뜨리면 다음 층으로 가는 계단이 열려요. 지하 10층까지… 끝을 본 사람은 아직 없답니다.</gray>"
      - "<gray>미궁의 <yellow>난이도</yellow>는 이 서버의 관리자님이 처음에 정해 두셨어요. 모두가 같은 난이도로 겨루니, 기록도 공평하죠.</gray>"
      - "<gray>층의 주인들은 저마다 고약한 버릇이 있어요. 아무도 가르쳐 주지 않지만… 쓰러질 때마다 조금씩 보이게 될 거예요.</gray>"

  blacksmith:
    name: "대장장이 두르간"
    nameplate: "<gradient:#e0571d:#ffc46b>[대장장이]</gradient>"
    skin: blacksmith
    role: blacksmith
    placement: overworld
    skin_style:
      palette: ["#c98e6b", "#5a2e1a", "#4a3121", "#7b4f2c", "#9a9aa2", "#3a2a1a"]
      outfit: apron
      hair: short_beard
      accessories: [soot_marks, thick_gloves, goggles_forehead]
    dialogue:
      - "<gray>흠! 몹한테서 뜯어 온 재료가 있으면 보여 줘. 쓸 만한 걸로 벼려 주지.</gray>"
      - "<gray>보스가 떨어뜨리는 핵이나 정수는 아주 귀해. 그걸로만 만들 수 있는 물건이 있거든.</gray>"
      - "<gray>전설급 무기? 하하, 재료만 모아 오면 내 망치가 노래를 부를 거다.</gray>"

  class_master:
    name: "전직관 세라핀"
    nameplate: "<gradient:#7fb2ff:#b07cff>[전직관]</gradient>"
    skin: class_master
    role: class_master
    placement: overworld
    skin_style:
      palette: ["#f3d2b8", "#e8e2d4", "#2a3a6a", "#d8c8a0", "#d9b25a", "#4a6ab0"]
      outfit: coat
      hair: silver_ponytail
      accessories: [shoulder_cape, medal_sash, monocle]
    dialogue:
      - "<gray>미궁은 혼자의 힘만으로는 끝까지 갈 수 없는 곳이지. 그대에게 맞는 길을 고르게.</gray>"
      - "<gray>수호기사, 광전사, 사냥꾼, 비전술사, 사제, 그림자. 서로를 채워 주는 파티가 가장 강하다네.</gray>"
      - "<gray>직업 스킬은 <yellow><key:key.swapOffhand></yellow>, <yellow><key:key.sneak>+<key:key.swapOffhand></yellow>, <yellow><key:key.drop></yellow>, <yellow><key:key.sneak>+<key:key.drop></yellow>로 쓴다네. 레벨이 오르면 하나씩 깨어나지.</gray>"
      - "<gray>무기는 마음 가는 대로 들게. 미궁의 무기라면 무엇으로든 직업 스킬이 나간다네. 다만 그 길에 어울리는 무기를 쥐면 스킬이 조금 더 빨리 돌아오지.</gray>"
      - "<gray>첫 길은 그냥 골라도 좋네. 하지만 길을 바꾸려면 <yellow>전직의 두루마리</yellow>가 필요하지. 떠돌이 상인 핀이 가지고 다닌다네. 그리고 한 번 길을 정했으면 한동안은 그 길을 걸어 보게.</gray>"

  title_keeper:
    name: "기록관 노아"
    nameplate: "<gradient:#ffd27a:#fff4d6>[칭호 기록관]</gradient>"
    skin: title_keeper
    role: title_keeper
    placement: overworld
    skin_style:
      palette: ["#e8c0a0", "#1e1a2e", "#5a2a3a", "#efe4c8", "#c8a060", "#6a3a8a"]
      outfit: scholar
      hair: messy_short
      accessories: [round_glasses, scroll_bundle, quill_ear]
    dialogue:
      - "<gray>미궁에서 이룬 모든 위업은 이 두루마리에 기록됩니다. 서버 최초의 기록이라면 더더욱요.</gray>"
      - "<gray>얻은 칭호 중 하나를 골라 이름 앞에 달 수 있어요. 어떤 칭호는 작은 축복도 내려 주죠.</gray>"
      - "<gray>아직 아무도 이루지 못한 기록이 많아요. 그 첫 번째 이름이 당신일지도요.</gray>"

  merchant:
    name: "떠돌이 상인 핀"
    nameplate: "<gradient:#8fd16a:#e8f5a0>[상인]</gradient>"
    skin: merchant
    role: merchant
    placement: overworld
    skin_style:
      palette: ["#d9a882", "#c45a22", "#3a5a2a", "#c8a060", "#e8c870", "#2a6a4a"]
      outfit: traveler
      hair: curly_short
      accessories: [big_backpack, coin_pouch, scarf]
    dialogue:
      - "<gray>물약 필요해? 미궁에선 한 병이 목숨 하나야. 싸게 줄게!</gray>"
      - "<gray>귀환 두루마리는 꼭 챙겨. 깊은 층에서 길 잃으면 아무도 못 찾아.</gray>"
    shop:
      - {item: minor_healing_potion, price: 20}
      - {item: minor_mana_potion, price: 20}
      - {item: healing_potion, price: 60, level_req: 15}
      - {item: mana_potion, price: 60, level_req: 15}
      - {item: greater_healing_potion, price: 150, level_req: 30}
      - {item: greater_mana_potion, price: 150, level_req: 30}
      - {item: return_scroll, price: 100}
      - {item: stat_reset_scroll, price: 2000}
      - {item: class_change_scroll, price: 3000}
      - {item: lesser_enhance_stone, price: 60}
      - {item: wayfarer_sabre, price: 1500, level_req: 3}
      - {item: silk_antler_staff, price: 2000, level_req: 8}
      - {item: glowcap_twin_bow, price: 2500, level_req: 11}

  # ═══════════════════════════ 광산 마을 NPC (0.3.6 — 광부 브론 → 광산 관리소 메뉴 · 제련공 이그나 → 제련소) ═══════════════════════════

  miner:
    name: "광부 브론"
    nameplate: "<gradient:#e8843f:#f0b050>[광부]</gradient>"
    skin: miner
    role: miner
    placement: overworld
    skin_style:
      palette: ["#c98e6b", "#3a2a20", "#4a5866", "#8c6a44", "#f0b050", "#2a2a2a"]
      outfit: miner
      hair: short_beard
      accessories: [helmet_lamp, tool_belt, soot_marks]
    dialogue:
      - "<gray>곡괭이는 챙겼나? 처음 오는 사람한텐 구리 곡괭이 하나는 그냥 준다네.</gray>"
      - "<gray>좋은 곡괭이일수록 더 단단한 광석을 캐지. 약한 곡괭이로는 금도 안 가.</gray>"
      - "<gray>캔 광맥은 시간이 지나면 다시 차. 깊이 내려갈수록 귀한 광석이 섞여 있다네.</gray>"

  smelter:
    name: "제련공 이그나"
    nameplate: "<gradient:#ff9a5a:#3fb090>[제련공]</gradient>"
    skin: smelter
    role: smelter
    placement: overworld
    skin_style:
      palette: ["#d9a882", "#2a3a3a", "#5a3121", "#8c5a34", "#ff9a5a", "#3fb090"]
      outfit: apron
      hair: bun
      accessories: [goggles_forehead, thick_gloves, tool_belt]
    dialogue:
      - "<gray>광석 두 개면 주괴 하나. 불은 내가 볼 테니 골드만 조금 내.</gray>"
      - "<gray>보석에 미궁 정수를 더하면 강화석을 새겨 줄게. 한 번에 두 개씩.</gray>"
      - "<gray>쓰던 곡괭이를 가져오면 더 좋은 금속으로 다시 벼려 줄 수 있어.</gray>"

  # ═══════════════════════════ 층 안 이야기 NPC (휴식방) ═══════════════════════════

  lore_floor2_miner:
    name: "살아남은 광부 토브"
    nameplate: "<gray>[생존자]</gray>"
    skin: lore_miner
    role: lore
    placement: floor
    floor: 2
    skin_style:
      palette: ["#c98e6b", "#3a2a20", "#5a3a26", "#8c5a34", "#d9b07a", "#2a2a2a"]
      outfit: miner
      hair: short_beard
      accessories: [helmet_lamp, bandage_arm]
    dialogue:
      - "<gray>여왕은 꼭 둘을 한 실로 묶더군. 나랑 짝꿍은… 겁에 질려 서로 꼭 붙어 있었지. 그게 마지막이었어.</gray>"
      - "<gray>벽 쪽에서 무언가 꿈틀대는 소리가 나면 오래 내버려 두지 마. 갱도가 새끼들로 가득 찼던 날을 잊을 수가 없어.</gray>"
      - "<gray>은실 고치는 안에서 찢기 어려워. 바깥에 누가 있어 준다면 모를까… 혼자라면, 죽을힘을 다해 몸부림쳐야지.</gray>"

  lore_floor3_explorer:
    name: "길 잃은 탐험가 하린"
    nameplate: "<gray>[탐험가]</gray>"
    skin: lore_explorer
    role: lore
    placement: floor
    floor: 3
    skin_style:
      palette: ["#f1c9a5", "#6a3a1a", "#6a5a3a", "#a89060", "#c8a060", "#3a6a2a"]
      outfit: traveler
      hair: short_bob
      accessories: [map_case, scarf, goggles_forehead]
    dialogue:
      - "<gray>무르노크의 포자는 두 가지 색이야. 하나는 외로움을 좋아하고, 하나는 외로움을 견디지 못하지.</gray>"
      - "<gray>푸른 포자가 터진 자리엔 오래도록 독이 고여. 어디서 터뜨릴지는… 잘 생각해.</gray>"
      - "<gray>노란 꽃은 무거워. 혼자 떠안으면 버섯 거름이 되는 거고.</gray>"

  lore_floor4_lockkeeper:
    name: "견습 수문지기 에일라"
    nameplate: "<gray>[견습 수문지기]</gray>"
    skin: lore_lockkeeper
    role: lore
    placement: floor
    floor: 4
    skin_style:
      palette: ["#e8c0a0", "#1e3a4a", "#24413c", "#7aa899", "#b0b8c0", "#3a8a9a"]
      outfit: uniform
      hair: long_straight
      accessories: [key_ring, rain_cape]
    dialogue:
      - "<gray>스승님이 닻을 끌면 물이 차올라요. 그래도 물은… 높은 곳까지는 못 올라와요.</gray>"
      - "<gray>수문 밸브는 고집이 세요. 선 채로는 꿈쩍도 안 해요. 스승님은 늘 무릎을 꿇고 돌리셨죠.</gray>"
      - "<gray>수문이 하나만 열려선 소용없어요. 물은 늦게 열린 수문을 기다려 주지 않거든요.</gray>"

  lore_floor5_apprentice:
    name: "견습 대장장이 미라"
    nameplate: "<gray>[견습 대장장이]</gray>"
    skin: lore_apprentice
    role: lore
    placement: floor
    floor: 5
    skin_style:
      palette: ["#d9a882", "#a83a1a", "#4a3121", "#7b4f2c", "#9a9aa2", "#5a3a1a"]
      outfit: apron
      hair: twin_buns
      accessories: [soot_marks, thick_gloves]
    dialogue:
      - "<gray>모루왕이 망치를 높이 들면 땅이 울려요. 해자 쪽에 서 있던 견습생들은… 다시 못 봤어요.</gray>"
      - "<gray>바닥 가장자리의 쇠사슬은 장식이 아니에요. 대장장이들은 진동이 오면 사슬부터 찾았죠.</gray>"
      - "<gray>바람이 불고 나면 꼭 망치가 따라와요. 바람이 어디로 불었는지 기억해 두세요.</gray>"

  lore_floor6_knight:
    name: "얼어붙은 기사 에드윈의 망령"
    nameplate: "<gray>[망령]</gray>"
    skin: lore_ghost_knight
    role: lore
    placement: floor
    floor: 6
    skin_style:
      palette: ["#c8d8e8", "#e8f4ff", "#3e4a5e", "#7a8aa8", "#bfe4ff", "#9ad0ff"]
      outfit: armor
      hair: none
      accessories: [ghostly, frost_cracks, broken_crown]
    dialogue:
      - "<gray>…이 묘역에서 걸음을 멈춘 자는 얼음이 된다. 얼어붙은 동료를 그대로 두지 마라.</gray>"
      - "<gray>여제의 얼음 껍질은 하나의 힘으로는 깨지지 않는다. 칼, 활, 주문… 셋이 한뜻이어야 한다.</gray>"
      - "<gray>주문이 끝나기 전에 껍질을 깨지 못하면… 나처럼 영원히 이곳에 남게 되리라.</gray>"

  lore_floor7_tuner:
    name: "조율사 루시엔"
    nameplate: "<gray>[떠돌이 조율사]</gray>"
    skin: lore_tuner
    role: lore
    placement: floor
    floor: 7
    skin_style:
      palette: ["#f3d2b8", "#2a1e48", "#6a4ab8", "#e0d0ff", "#fff2b0", "#8a5ae0"]
      outfit: robe
      hair: long_straight
      accessories: [tuning_fork, crystal_pendant]
    dialogue:
      - "<gray>다이아드 앞에 서면 당신도 색을 입게 돼요. 빛, 아니면 어둠.</gray>"
      - "<gray>파동은 제 색을 알아봐요. 낯선 색에게만 사납죠.</gray>"
      - "<gray>양쪽 기둥은 그냥 서 있는 게 아니에요. 그리고… 다이아드는 자기와 반대인 것을 두려워해요.</gray>"

  lore_floor8_scribe:
    name: "필경사 유령 마르타"
    nameplate: "<gray>[필경사의 유령]</gray>"
    skin: lore_scribe
    role: lore
    placement: floor
    floor: 8
    skin_style:
      palette: ["#d8d0c0", "#2a2418", "#22182e", "#efe4c8", "#c8a060", "#5a7ab0"]
      outfit: scholar
      hair: bun
      accessories: [ghostly, round_glasses, ink_stains]
    dialogue:
      - "<gray>사서님이 떠오르면 서고가 순서를 속삭여요. 귀 기울이고, 잊지 마세요.</gray>"
      - "<gray>엉뚱한 책장을 두드리면 먹물이 쏟아져요. 순서만 맞는다면 누구 손이든 상관없지만요.</gray>"
      - "<gray>먹물 분신은 사서님과 똑같이 생겼어요. 하지만 먹물은… 그림자를 갖지 못해요.</gray>"

  lore_floor9_tinker:
    name: "태엽 수리공 오토"
    nameplate: "<gray>[태엽 수리공]</gray>"
    skin: lore_tinker
    role: lore
    placement: floor
    floor: 9
    skin_style:
      palette: ["#c98e6b", "#d8d8d8", "#4a3020", "#a06a34", "#e0b070", "#6ad0b0"]
      outfit: uniform
      hair: bald_mustache
      accessories: [goggles_forehead, tool_belt, mechanical_arm]
    dialogue:
      - "<gray>테오라와 싸우는 동안 종말의 시계가 줄어든다네. 0이 되면… 모두 처음으로 되감기지.</gray>"
      - "<gray>바닥의 봉인석은 아무 때나 밟는 게 아니야. 시곗바늘에게 물어보게.</gray>"
      - "<gray>성급한 발은 몇 초 전으로 끌려가고, 시계도 함께 줄어든다네. 시계는 기다릴 줄 아는 자를 좋아하지.</gray>"

  lore_floor10_challenger:
    name: "첫 번째 도전자 리아"
    nameplate: "<gray>[첫 번째 도전자]</gray>"
    skin: lore_challenger
    role: lore
    placement: floor
    floor: 10
    skin_style:
      palette: ["#e8c0a0", "#b01a3a", "#1a3c46", "#2fe0d0", "#ffe9a8", "#2fe0d0"]
      outfit: armor
      hair: short_messy
      accessories: [ghostly, torn_cape, sculk_scars]
    dialogue:
      - "<gray>…여기까지 왔구나. 나는 이 심장 앞에서 멈췄어. 너희는 다르길.</gray>"
      - "<gray>바닥이 보랏빛으로 갈라지면 그 자리는 이미 심연의 것이야.</gray>"
      - "<gray>심장이 포효하면… 돌아보지 마. 심연의 해일은 멈추지 않으니까.</gray>"
