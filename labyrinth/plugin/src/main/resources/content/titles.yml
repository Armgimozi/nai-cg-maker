# ─────────────────────────────────────────────────────────────────────────────
# titles.yml — 업적 55종 → 칭호
#
# 스키마: ARCHITECTURE.md §6 titles.yml (+ 추가 필드는 §6 에 기록됨)
#  condition.type (닫힌 목록) 과 파라미터:
#    FIRST_CLEAR      {floor}                         서버 최초로 그 층 보스를 잡은 파티 전원 (records.yml 에 1회만)
#    CLEAR            {floor, count?=1}               그 층 클리어 누적 count 회 (난이도 무관)
#    SOLO_CLEAR       {floor}                         혼자 입장해서 클리어
#    NO_DEATH_CLEAR   {floor, party_min?=1}           파티원 누구도 죽지 않고 클리어 (party_min 명 이상 파티)
#    DIFFICULTY_CLEAR {floor, difficulty}             difficulty 이상(easy<normal<hard<nightmare)으로 클리어
#    SPEED_CLEAR      {floor, seconds}                입장~보스 처치 시간이 seconds 이하
#    KILL             {count, mob?, rank?}            누적 처치 (mob = mobs.yml id, rank = normal|elite|add)
#    BOSS_KILL        {count, boss?}                  보스 누적 처치 (boss = bosses.yml id, 없으면 아무 보스)
#    LEVEL            {level}                         레벨 도달
#    OBTAIN_RARITY    {rarity, count?=1}              그 희귀도 장비를 count 개 획득 (드롭·제작·보상 모두)
#    CRAFT            {count, rarity?}                대장장이 제작 누적 (rarity 있으면 그 희귀도 이상만 셈)
#    PVP_FIRST_WIN    {}                              파티 대 파티 매치 첫 승리 (ARCHITECTURE §5 PvP)
#    PVP_WIN          {count}                         매치 승리 누적
#    PVP_STREAK       {count}                         매치 연승
#    PVP_RATING       {min}                           파티 레이팅 min 이상 도달
#  title     : 장착 시 채팅·탭·이름표 접두어 (MiniMessage)
#  bonus     : 장착 중에만 적용. 키 = STR|DEX|INT|VIT|WIS|LUK 또는 xp_bonus|gold_bonus (비율)
#  broadcast : 달성 시 서버 전체 방송
#  reward    : 달성 즉시 1회 지급. gold, items(items.yml id → 개수)
#  category  : UI 탭 분류 — pioneer | clear | challenge | combat | growth | collection | craft | pvp
#  hidden    : true 면 달성 전엔 이름·조건이 ??? 로 표시
# ─────────────────────────────────────────────────────────────────────────────
