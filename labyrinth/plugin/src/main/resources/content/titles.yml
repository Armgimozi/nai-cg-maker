# ─────────────────────────────────────────────────────────────────────────────
# titles.yml — 칭호 12종 (0.3.4: 칭호마다 서버에서 단 한 명)
#
#  ※ 이 파일은 관리자용입니다. 조건은 칭호에 주인이 생기기 전까지 플레이어에게 보이지 않습니다
#    (메뉴·/칭호·도감·방송 어디에도 "조건: ???"). 주인이 생기면 그때부터 모두에게 조건이 공개됩니다.
#    관리자는 /labadmin title list 로 조건과 주인을 볼 수 있습니다.
#
# 스키마: ARCHITECTURE.md §6 titles.yml
#  규칙: 칭호 하나 = 주인 한 명. 조건을 가장 먼저 채운 사람이 주인 (records.yml title.<id>, 재시작해도 유지).
#        판정은 그 일이 일어난 순간에만 (접속·리로드로는 주지 않음). 주인이 생긴 칭호는 다시 판정하지 않음.
#        파티로 한 일(층 돌파·보스 처치)은 그 보스에게 가장 많은 피해를 준 한 명만 (같으면 막타, 기록이 없으면 파티 순서).
#  condition.type (닫힌 목록) 과 파라미터:
#    FIRST_CLEAR      {floor}                     그 층의 서버 최초 돌파(records first_clear.floor_N 을 세운 돌파)
#    CLEAR            {floor, count?=1}           그 층 돌파 (누적 count 번째 이상)
#    SOLO_CLEAR       {floor, count?=1}           혼자 입장해서 돌파
#    NO_DEATH_CLEAR   {floor, party_min?=1}       아무도 쓰러지지 않고 돌파 (party_min 명 이상 파티)
#    DIFFICULTY_CLEAR {floor, difficulty}         서버 난이도 difficulty 이상(easy<normal<hard<nightmare)에서 돌파
#    SPEED_CLEAR      {floor, seconds}            그 층 시작~보스 처치가 seconds 이하
#      (돌파 조건 공통 선택 키: solo: true · no_death: true · party_min · difficulty · seconds — 섞어 쓸 수 있음)
#    KILL             {count, mob?, mobs?, rank?} 누적 처치 (그 몹을 잡는 순간 판정)
#    BOSS_KILL        {count?=1, boss?}           보스 처치 (boss = bosses.yml id)
#    LEVEL            {level}                     그 레벨을 넘는 순간
#    OBTAIN_RARITY    {rarity, count?=1}          그 희귀도 장비 획득 (드롭·제작 — 관리자 지급·칭호 보상은 안 셈)
#    CRAFT            {count?=1, rarity?}         대장간 제작 (rarity 이상만 셈)
#    ENHANCE          {level}                     강화 성공으로 +level 이상이 되는 순간
#    TREASURE         {kind, count?=1}            미로 보물: chest | gold_chest | vault | mimic
#  name      : 칭호 이름 (조건을 암시하지 않게)
#  lore      : 한 줄 설명 (조건을 암시하지 않게)
#  title     : 장착 시 채팅·탭·이름표 접두어 (MiniMessage)
#  bonus     : 장착 중에만. STR|DEX|INT|VIT|WIS|LUK 또는 xp_bonus|gold_bonus (비율)
#  broadcast : 주인이 생기면 서버 전체 방송 (조건 공개)
#  reward    : 주인이 될 때 1회. gold, items(items.yml id → 개수)
#  (예전 키 server_first · category · hidden · description 은 읽어도 쓰지 않음)
# ─────────────────────────────────────────────────────────────────────────────
