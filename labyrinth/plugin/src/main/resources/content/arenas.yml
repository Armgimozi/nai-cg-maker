# ─────────────────────────────────────────────────────────────────────────────
# arenas.yml — 파티 대 파티 PvP 투기장 6종 (전부 오리지널 설계) + 대전 규칙
#
# 스키마: ARCHITECTURE.md §6 arenas.yml (+ 추가 필드는 §6.2). 설계 의도·흐름 = GDD §18 PvP
#  투기장은 labyrinth_world 의 PvP 전용 격자 슬롯에 매치마다 생성하고, 매치가 끝나면 슬롯을 비운다.
#  기존 지형·미궁 밖 월드는 절대 건드리지 않는다.
#  size        : 바닥 크기 [x, z] (블록).  height : 벽·천장 높이 (천장 없음 = 하늘 열림, 벽 위 BARRIER)
#  palette.*   : 실제 26.3 블록 Material 이름 (floors.yml 과 같은 규칙: 앞쪽일수록 자주)
#  layout      : 구현 키 (닫힌 목록) pillars_ring | bridges | tiers | maze_lite | central_altar | floating_isles
#  layout_params : 레이아웃 구현이 읽는 자유 파라미터 (블록 단위)
#  team_size   : 이 투기장이 뽑힐 수 있는 팀 인원 [최소, 최대] (큰 쪽 팀 기준)
#  weight      : 무작위 선택 가중치
#  spawns      : 두 팀 시작 위치 규칙 {distance: 중심에서 거리, protect: 시작 무적 초}
#  hazards[]   : 시간이 지나면 발동하는 위험 요소 (닫힌 목록) — start(라운드 시작 후 초) + 종류별 파라미터
#                rising_water | ember_rain | bridge_collapse | blizzard | prism_beams | clock_hand | tile_collapse
#                *_pct = 대상 최대 HP 비율 피해(방어 무시, PvP damage_mult 미적용)
#  objective   : (선택) 투기장 목표. altar_control
#  ambient     : particle(데이터 없는 입자) / sound(바닐라 사운드 키) / sound_interval / volume / pitch
# ─────────────────────────────────────────────────────────────────────────────
version: 1

arenas:

  # ═════════ 1. 가라앉은 투기장 — 높은 곳을 차지하라 ═════════
  sunken_colosseum:
    name: "가라앉은 투기장"
    description: "<gray>수로에 잠긴 옛 투기장. 시간이 지나면 물이 차올라 기둥 위 발판만이 안전해진다.</gray>"
    theme: flooded
    size: [41, 41]
    height: 12
    palette:
      floor: [PRISMARINE_BRICKS, DARK_PRISMARINE, MUD_BRICKS]
      wall: [PRISMARINE_BRICKS, WAXED_OXIDIZED_CUT_COPPER, DARK_PRISMARINE]
      accent: [WAXED_OXIDIZED_COPPER, WAXED_COPPER_GRATE, CHISELED_TUFF_BRICKS]
      light: [SEA_LANTERN, WAXED_COPPER_BULB]
    layout: pillars_ring
    layout_params: {ring_radius: 11, pillars: 8, pillar_radius: 1, pillar_height: 3, platform_every: 2, platform_radius: 2, center_pool_radius: 4, center_pool_depth: 1}
    team_size: [1, 5]
    weight: 3
    spawns: {distance: 16, protect: 3}
    hazards:
      - {type: rising_water, start: 90, interval: 15, step: 1, max_level: 2, slow: 0.35, damage_pct: 0.02, tick: 1.0}
    ambient: {particle: DRIPPING_WATER, density: 1.0, sound: "minecraft:ambient.underwater.loop.additions", sound_interval: [20, 40], volume: 0.5, pitch: 0.9}

  # ═════════ 2. 잿불 다리 — 좁은 길에서 밀고 당기기 ═════════
  ember_bridges:
    name: "잿불 다리"
    description: "<gray>용암 해자 위에 놓인 세 갈래 돌다리. 불씨가 쏟아지고, 버티지 못한 바깥 다리부터 무너진다.</gray>"
    theme: forge
    size: [45, 33]
    height: 14
    palette:
      floor: [POLISHED_BLACKSTONE_BRICKS, CINNABAR_BRICKS, BLACKSTONE]
      wall: [BLACKSTONE, POLISHED_BLACKSTONE_BRICKS, BASALT]
      accent: [GILDED_BLACKSTONE, CHISELED_CINNABAR, POLISHED_BASALT]
      light: [SHROOMLIGHT, OCHRE_FROGLIGHT]
      liquid: [LAVA]
    layout: bridges
    layout_params: {bridges: 3, bridge_width: 5, bridge_gap: 4, platform_depth: 8, cross_links: 1, cross_link_width: 3, trench_depth: 2, rail: true}
    team_size: [2, 5]
    weight: 3
    spawns: {distance: 18, protect: 3}
    lava_contact: {damage_pct: 0.25, teleport: nearest_safe, extinguish: true}
    hazards:
      - {type: ember_rain, start: 60, interval: 6, count_base: 4, count_per_player: 0.5, radius: 2.5, windup: 1.2, damage_pct: 0.08}
      - {type: bridge_collapse, start: 120, warn: 5, keep: center}
    ambient: {particle: LAVA, density: 0.6, sound: "minecraft:block.lava.ambient", sound_interval: [6, 14], volume: 0.6, pitch: 0.8}

  # ═════════ 3. 서리 원형극장 — 계단식 고지대와 눈보라 ═════════
  frost_tiers:
    name: "서리 원형극장"
    description: "<gray>얼어붙은 왕릉의 원형극장. 높은 단은 시야가 넓지만, 눈보라가 몰아치면 화로 곁만이 따뜻하다.</gray>"
    theme: frost
    size: [43, 43]
    height: 14
    palette:
      floor: [PACKED_ICE, SNOW_BLOCK, CALCITE]
      wall: [CALCITE, QUARTZ_PILLAR, PACKED_ICE]
      accent: [CHISELED_QUARTZ_BLOCK, BLUE_ICE, BONE_BLOCK]
      light: [SOUL_LANTERN, PEARLESCENT_FROGLIGHT]
    layout: tiers
    layout_params: {tiers: 3, tier_width: 4, tier_rise: 2, pit_radius: 7, stairs: 4, ice_pit: true, braziers: 4, brazier_tier: 2}
    team_size: [1, 5]
    weight: 2
    spawns: {distance: 18, protect: 3}
    hazards:
      - {type: blizzard, start: 75, interval: 20, duration: 6, frost_every: 2.0, frost_amount: 1, safe_radius: 3, slow: 0.15}
    ambient: {particle: SNOWFLAKE, density: 2.0, sound: "minecraft:block.powder_snow.step", sound_interval: [10, 20], volume: 0.4, pitch: 0.7}

  # ═════════ 4. 수정 미로 — 벽을 엄폐물로, 광선을 피해 ═════════
  crystal_maze:
    name: "수정 미로"
    description: "<gray>허리 높이 수정 벽이 얽힌 미로. 중앙 결정체가 깨어나면 회전 광선이 벽 너머를 쓸고 지나간다.</gray>"
    theme: crystal
    size: [37, 37]
    height: 10
    palette:
      floor: [SMOOTH_BASALT, CALCITE, TUFF_BRICKS]
      wall: [AMETHYST_BLOCK, CALCITE, SMOOTH_BASALT]
      accent: [BUDDING_AMETHYST, POLISHED_TUFF, CHISELED_TUFF_BRICKS]
      light: [PEARLESCENT_FROGLIGHT, END_ROD]
    layout: maze_lite
    layout_params: {cell: 5, cells: 7, wall_height: 2, open_ratio: 0.35, center_room: 2, seed_per_match: true}
    team_size: [1, 4]
    weight: 2
    spawns: {distance: 15, protect: 3}
    hazards:
      - {type: prism_beams, start: 60, beams: 2, length: 18, width: 1.2, rotate_speed: 30, height: 1.2, damage_pct: 0.06, tick: 0.5, blocked_by_walls: true, add_beam_every: 45}
    ambient: {particle: END_ROD, density: 0.8, sound: "minecraft:block.amethyst_block.chime", sound_interval: [4, 10], volume: 0.6, pitch: 1.2}

  # ═════════ 5. 시계탑 제단 — 중앙 제단 쟁탈 ═════════
  clockwork_altar:
    name: "시계탑 제단"
    description: "<gray>거대한 시계판 위의 제단. 제단을 홀로 지킨 팀은 태엽의 가속을 얻는다. 바늘이 돌기 시작하면 뛰어넘어라.</gray>"
    theme: clockwork
    size: [41, 41]
    height: 14
    palette:
      floor: [WAXED_CUT_COPPER, TUFF_BRICKS, POLISHED_TUFF]
      wall: [TUFF_BRICKS, WAXED_COPPER_BLOCK, CHISELED_TUFF_BRICKS]
      accent: [WAXED_COPPER_GRATE, LIGHTNING_ROD, CHISELED_TUFF]
      light: [WAXED_COPPER_BULB, WAXED_COPPER_LANTERN]
    layout: central_altar
    layout_params: {altar_radius: 4, altar_height: 2, ramps: 4, clock_face: true, outer_cover: 6, cover_height: 2}
    team_size: [2, 5]
    weight: 3
    spawns: {distance: 17, protect: 3}
    objective: {type: altar_control, capture_time: 3.0, buff: {damage: 0.10, cooldown_reduction: 0.10}, buff_duration: 10, cooldown: 20, contested_blocks: true}
    hazards:
      - {type: clock_hand, start: 90, period: 12, width: 2, height: 1, damage_pct: 0.15, knockback: 1.0, reverse_after: 150}
    ambient: {particle: WAX_OFF, density: 0.6, sound: "minecraft:block.copper_bulb.turn_on", sound_interval: [8, 16], volume: 0.5, pitch: 0.6}

  # ═════════ 6. 심연의 가장자리 — 무너지는 섬 ═════════
  abyss_rim:
    name: "심연의 가장자리"
    description: "<gray>공허 위에 떠 있는 아홉 개의 섬. 바깥 섬부터 하나씩 심연으로 떨어진다 — 마지막에 설 곳은 중앙뿐.</gray>"
    theme: abyss
    size: [39, 39]
    height: 0
    palette:
      floor: [DEEPSLATE_TILES, POLISHED_DEEPSLATE, SCULK]
      wall: [DEEPSLATE_TILES, OBSIDIAN]
      accent: [CRYING_OBSIDIAN, CHISELED_DEEPSLATE, SCULK_VEIN]
      light: [SOUL_LANTERN, VERDANT_FROGLIGHT]
    layout: floating_isles
    layout_params: {grid: 3, isle_size: 9, bridge_width: 2, gap: 6, isle_thickness: 3, keep_center: true}
    team_size: [1, 5]
    weight: 2
    spawns: {distance: 15, protect: 3}
    void_fall: {damage_pct: 0.25, teleport: random_safe_isle, vulnerable: 0.20, vulnerable_duration: 3}
    hazards:
      - {type: tile_collapse, start: 45, interval: 20, warn: 3, order: outer_first, keep: center}
    ambient: {particle: SCULK_SOUL, density: 0.5, sound: "minecraft:ambient.soul_sand_valley.mood", sound_interval: [25, 50], volume: 0.5, pitch: 0.8}

# ═════════════════════════ 대전 규칙 (MatchService · PvpRules · RatingService) ═════════════════════════
pvp:
  enabled: true
  rounds_to_win: 2              # best-of-3
  round_time: 180               # 초. 끝나면 sudden_death
  prep_time: 10                 # 라운드 시작 전 카운트다운 (이동 가능, 공격·스킬 불가, 시작 지점 벽)
  between_rounds: 8             # 라운드 사이 휴식 (HP·MP·쿨다운 전부 초기화)
  team_size: [1, 5]             # 한 팀 인원 범위 (파티원 중 참가 인원)
  allow_uneven: true
  max_size_diff: 2              # 인원 차이가 이보다 크면 매치 불가
  uneven_bonus: {hp: 0.15, damage: 0.10}   # 인원 1명 차이당 적은 쪽 최대 HP·주는 피해 보정
  challenge_timeout: 60         # /대전 도전 수락 대기 (초)
  min_level: 10                 # 이 레벨 미만은 대전 불가
  queue:
    enabled: true
    rating_window: 150          # 처음엔 팀 평균 레이팅 ±150 안에서만 매칭
    window_growth: 50           # growth_interval 초마다 창을 넓힘
    growth_interval: 20
    max_wait: 300               # 이 시간이 지나면 창 제한 없이 매칭
  sudden_death: {shrink_time: 30, final_radius: 4, damage_pct: 0.05, tick: 1.0, tiebreak: hp_percent}
  arena_pick: random_weighted   # random_weighted | vote(두 팀장이 3개 중 고르기)
  rules:
    damage_mult: 0.6            # 플레이어 → 플레이어 모든 피해
    healing_mult: 0.7           # 치유·흡혈
    shield_mult: 0.7            # 보호막 흡수량
    cc_duration_mult: 0.6       # 기절·속박·둔화·침묵 지속시간
    cc_immunity: 4.0            # 같은 대상에게 기절/속박이 끝난 뒤 이 시간 동안 같은 종류 면역 (연속 제어 방지)
    knockback_mult: 0.8
    execute_mult: 0.5           # '처형' 류 추가 피해(그림자 처형 HP 30% 이하 2배 등)의 추가분을 절반으로
    stealth_reveal_on_damage: true
    revive: false               # 부활의 성가는 PvP 에서 회복만 (쓰러진 아군 부활 X)
    consumables: false          # 물약·강장제·불사조 깃털·귀환 주문서 사용 불가
    title_bonuses: false        # 칭호 스탯 보너스 꺼짐 (명예만)
    weapon_skills: true
    friendly_fire: false        # 아군 오사 없음 (TargetFilter)
  gear:
    mode: soften                # full(장비 그대로) | soften(장비 격차 완화) | flat(장비 스탯 무시 — 순수 실력전)
    soften: 0.5                 # soften: 장비로 얻은 파생 능력치를 매치 참가자 평균 쪽으로 50% 당김
  rating:
    start: 1000
    k: 32
    k_placement: 48             # 처음 placement_matches 판은 변동 크게
    placement_matches: 10
    floor: 0
    uneven_k_mult: 0.5          # 인원이 다른 매치는 레이팅 변동 절반
    season_reset: {keep: 0.5, toward: 1000}   # /labadmin pvp season: 새 레이팅 = 1000 + (기존 − 1000) × 0.5
    tiers:                      # 표시용 등급 (탭·대전 메뉴). min 이상이면 그 등급
      - {min: 0,    name: "견습 투사", color: "#a8a8b0"}
      - {min: 1150, name: "청동 투사", color: "#c8864a"}
      - {min: 1300, name: "은빛 투사", color: "#c8d8ff"}
      - {min: 1450, name: "황금 투사", color: "#ffd27a"}
      - {min: 1600, name: "수정 투사", color: "#b07cff"}
      - {min: 1800, name: "심연 투사", color: "#2fe0d0"}
  rewards:
    titles_only: true           # 대전 보상은 칭호·등급·전적뿐. 골드·아이템·스탯 보상 없음 (돈으로 살 수 있는 이점 없음)
    broadcast_streak: 5         # 이 연승부터 서버 방송
  spectate: {allow_outsiders: true, max_spectators: 20}
  afk: {idle_seconds: 30}       # 라운드 중 30초 무입력 → 그 라운드 사망 처리
