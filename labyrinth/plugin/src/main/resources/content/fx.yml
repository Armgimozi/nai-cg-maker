# ─────────────────────────────────────────────────────────────────────────────
# fx.yml — 아우라 · 무기 스킬 이펙트 · 경고 장판 · 투사체 · 기믹 오브젝트 모델 (전부 자체 제작)
#
# 스키마: ARCHITECTURE.md §6 fx.yml (+ 추가 필드는 §6 에 기록됨)
#  models.<name>  → 아이템 모델 labyrinth:fx/<name>  (assets/labyrinth/items/fx/<name>.json)
#    style     : 생성기 템플릿 (GDD.md "Pack generator templates" → FX 스타일 닫힌 목록)
#    motif     : 무늬/장식 (같은 목록 참고). palette: 어두운 색 → 밝은 색
#    animated/frames/frametime : 텍스처 프레임 애니메이션 (.png.mcmeta)
#    size      : [w, h, d] 픽셀(16 = 1블록, 표시 스케일 1 기준). Java 가 Display 변환으로 크기 조절
#    flat      : true 면 바닥에 눕는 모델 (경고 장판 등, Y 두께 거의 0)
#    billboard : FIXED | CENTER | VERTICAL — Java 가 Display.Billboard 로 설정
#    glow      : true 면 Java 가 Display 밝기를 (15,15)로 고정 (어둠 속에서도 빛남)
#  auras.<id>    → 전설·신화 무기를 들었을 때 (items.yml 의 aura 값)
#    tier      : legendary | mythic
#    particles : [{type(Particle), count, radius, height(발 기준 Y), pattern, chance?, color?, color_to?, size?, speed?}]
#                pattern = orbit | spiral | rise | fall | swirl | burst | trail (GDD.md "아우라" 설명)
#                color/color_to/size 는 DUST / DUST_COLOR_TRANSITION 전용
#    ring_model / ring_spin(도/틱) / ring_scale / ring_height(발 기준 Y) / ring_step(true = 시계처럼 끊어 회전)
#    secondary_model / secondary_spin / secondary_mode(ring | back) — 신화 전용 2번째 레이어
#    interval  : 파티클 생성 주기(틱). LOD 는 AuraService 가 거리·인원으로 추가 조절
#    swing     : 휘두를 때 한 번 터지는 파티클 (선택)
# ─────────────────────────────────────────────────────────────────────────────
version: 1

auras:

  # ═══════════════════════ 전설 (금색 등급, 링 아우라) ═══════════════════════
  dawn:
    tier: legendary
    particles:
      - {type: DUST, color: "#ffd27a", size: 1.0, count: 2, radius: 0.7, height: 1.0, pattern: orbit}
      - {type: END_ROD, count: 1, radius: 0.5, height: 0.3, pattern: rise, chance: 0.4, speed: 0.02}
    ring_model: dawn_ring
    ring_spin: 4.0
    ring_scale: 1.2
    ring_height: 0.05
    interval: 4
    swing: {type: END_ROD, count: 6, speed: 0.08}
  ember:
    tier: legendary
    particles:
      - {type: FLAME, count: 2, radius: 0.6, height: 0.6, pattern: rise, speed: 0.01}
      - {type: SMALL_FLAME, count: 1, radius: 0.4, height: 1.2, pattern: orbit}
      - {type: LAVA, count: 1, radius: 0.3, height: 1.0, pattern: burst, chance: 0.05}
    ring_model: ember_ring
    ring_spin: 6.0
    ring_scale: 1.2
    ring_height: 0.05
    interval: 3
    swing: {type: FLAME, count: 8, speed: 0.06}
  gale:
    tier: legendary
    particles:
      - {type: SMALL_GUST, count: 1, radius: 0.8, height: 0.8, pattern: swirl, chance: 0.3}
      - {type: DUST, color: "#c8f0dc", size: 0.7, count: 2, radius: 0.8, height: 0.2, pattern: spiral}
    ring_model: gale_ring
    ring_spin: 10.0
    ring_scale: 1.3
    ring_height: 0.05
    interval: 4
    swing: {type: SMALL_GUST, count: 1, speed: 0.0}
  rime:
    tier: legendary
    particles:
      - {type: SNOWFLAKE, count: 2, radius: 0.7, height: 2.0, pattern: fall, speed: 0.01}
      - {type: DUST, color: "#bfe6ff", size: 0.8, count: 1, radius: 0.6, height: 1.0, pattern: orbit}
    ring_model: rime_ring
    ring_spin: 3.0
    ring_scale: 1.2
    ring_height: 0.05
    interval: 4
    swing: {type: SNOWFLAKE, count: 8, speed: 0.05}
  sanctum:
    tier: legendary
    particles:
      - {type: END_ROD, count: 1, radius: 0.4, height: 0.2, pattern: rise, speed: 0.03}
      - {type: DUST, color: "#fff4d6", size: 1.0, count: 2, radius: 0.5, height: 2.1, pattern: orbit}
    ring_model: sanctum_ring
    ring_spin: 2.0
    ring_scale: 0.7
    ring_height: 2.2
    interval: 4
    swing: {type: WAX_ON, count: 6, speed: 0.1}
  nightshade:
    tier: legendary
    particles:
      - {type: DUST_COLOR_TRANSITION, color: "#5a2a8a", color_to: "#0a0a12", size: 1.2, count: 2, radius: 0.6, height: 0.5, pattern: swirl}
      - {type: SQUID_INK, count: 1, radius: 0.3, height: 1.0, pattern: burst, chance: 0.15, speed: 0.01}
    ring_model: nightshade_ring
    ring_spin: -5.0
    ring_scale: 1.2
    ring_height: 0.05
    interval: 4
    swing: {type: SMOKE, count: 6, speed: 0.04}
  tide:
    tier: legendary
    particles:
      - {type: DRIPPING_WATER, count: 2, radius: 0.6, height: 1.6, pattern: fall}
      - {type: DUST, color: "#5ab0d0", size: 0.9, count: 2, radius: 0.7, height: 0.4, pattern: spiral}
      - {type: BUBBLE_POP, count: 1, radius: 0.5, height: 1.0, pattern: orbit, chance: 0.5}
    ring_model: tide_ring
    ring_spin: 5.0
    ring_scale: 1.25
    ring_height: 0.05
    interval: 4
    swing: {type: SPLASH, count: 10, speed: 0.1}
  prism:
    tier: legendary
    particles:
      - {type: DUST, color: "#fff2b0", size: 0.9, count: 1, radius: 0.7, height: 1.0, pattern: orbit}
      - {type: DUST, color: "#6a4ab8", size: 0.9, count: 1, radius: 0.7, height: 1.0, pattern: orbit}
      - {type: END_ROD, count: 1, radius: 0.4, height: 0.5, pattern: rise, chance: 0.3, speed: 0.02}
    ring_model: prism_ring
    ring_spin: 7.0
    ring_scale: 1.2
    ring_height: 0.05
    interval: 4
    swing: {type: END_ROD, count: 6, speed: 0.08}
  chrono:
    tier: legendary
    particles:
      - {type: WAX_OFF, count: 1, radius: 0.6, height: 1.0, pattern: orbit}
      - {type: DUST, color: "#e8b060", size: 0.8, count: 2, radius: 0.75, height: 0.1, pattern: orbit}
      - {type: ELECTRIC_SPARK, count: 1, radius: 0.4, height: 1.2, pattern: burst, chance: 0.2}
    ring_model: chrono_ring
    ring_spin: 6.0
    ring_step: true
    ring_scale: 1.3
    ring_height: 0.05
    interval: 5
    swing: {type: WAX_OFF, count: 8, speed: 0.1}

  # ─── 전설 아우라 추가분 (아이템 단계: 전설 무기마다 다른 테마) ───
  soulfire:   # 혼불 — 푸른 영혼불, 6층 묘역
    tier: legendary
    particles:
      - {type: SOUL_FIRE_FLAME, count: 2, radius: 0.5, height: 0.4, pattern: rise, speed: 0.02}
      - {type: SOUL, count: 1, radius: 0.7, height: 1.0, pattern: orbit, chance: 0.3}
      - {type: DUST, color: "#5ad8ff", size: 0.9, count: 1, radius: 0.6, height: 1.4, pattern: swirl}
    ring_model: soulfire_ring
    ring_spin: -4.0
    ring_scale: 1.25
    ring_height: 0.05
    interval: 4
    swing: {type: SOUL_FIRE_FLAME, count: 8, speed: 0.06}
  codex:   # 금서 — 금빛 글자가 둘레를 도는 색인, 8층 서고
    tier: legendary
    particles:
      - {type: ENCHANT, count: 3, radius: 0.9, height: 1.2, pattern: orbit, speed: 0.4}
      - {type: DUST, color: "#ffd27a", size: 0.8, count: 1, radius: 0.7, height: 0.2, pattern: spiral}
      - {type: END_ROD, count: 1, radius: 0.4, height: 0.6, pattern: rise, chance: 0.2, speed: 0.02}
    ring_model: codex_ring
    ring_spin: 3.0
    ring_scale: 1.25
    ring_height: 0.05
    interval: 4
    swing: {type: ENCHANT, count: 12, speed: 0.6}
  geode:   # 정동 — 자수정 결정이 자라고 부서짐, 7층 공명동
    tier: legendary
    particles:
      - {type: DUST_COLOR_TRANSITION, color: "#9a62e0", color_to: "#efd8ff", size: 1.0, count: 2, radius: 0.7, height: 0.8, pattern: orbit}
      - {type: ENCHANTED_HIT, count: 1, radius: 0.5, height: 1.0, pattern: burst, chance: 0.25, speed: 0.05}
    ring_model: geode_ring
    ring_spin: 5.0
    ring_scale: 1.25
    ring_height: 0.05
    interval: 4
    swing: {type: ENCHANTED_HIT, count: 10, speed: 0.2}
  inkblot:   # 먹물 — 번지는 잉크와 떠다니는 글자, 8층 서고
    tier: legendary
    particles:
      - {type: SQUID_INK, count: 1, radius: 0.6, height: 0.8, pattern: swirl, speed: 0.01}
      - {type: DUST, color: "#2a3a6a", size: 1.2, count: 2, radius: 0.5, height: 1.6, pattern: fall}
      - {type: GLOW_SQUID_INK, count: 1, radius: 0.4, height: 1.0, pattern: burst, chance: 0.1, speed: 0.01}
    ring_model: inkblot_ring
    ring_spin: -3.0
    ring_scale: 1.25
    ring_height: 0.05
    interval: 4
    swing: {type: SQUID_INK, count: 8, speed: 0.05}
  abyssal:   # 심연 — 청록빛 스컬크 맥이 박동, 10층 심연
    tier: legendary
    particles:
      - {type: SCULK_SOUL, count: 1, radius: 0.6, height: 0.3, pattern: rise, chance: 0.5, speed: 0.02}
      - {type: SCULK_CHARGE_POP, count: 2, radius: 0.8, height: 0.1, pattern: orbit}
      - {type: DUST, color: "#2fe0d0", size: 0.9, count: 1, radius: 0.6, height: 0.6, pattern: spiral}
    ring_model: abyssal_ring
    ring_spin: 2.5
    ring_scale: 1.25
    ring_height: 0.05
    interval: 4
    swing: {type: SCULK_SOUL, count: 8, speed: 0.05}
  voltaic:   # 전격 — 구리 코일 사이를 뛰는 번개, 9층 피뢰침
    tier: legendary
    particles:
      - {type: ELECTRIC_SPARK, count: 2, radius: 0.6, height: 1.0, pattern: burst, speed: 0.05}
      - {type: SCRAPE, count: 1, radius: 0.8, height: 0.4, pattern: orbit, chance: 0.5}
      - {type: DUST, color: "#7ae0c0", size: 0.7, count: 1, radius: 0.7, height: 0.1, pattern: orbit}
    ring_model: voltaic_ring
    ring_spin: 9.0
    ring_scale: 1.25
    ring_height: 0.05
    interval: 4
    swing: {type: ELECTRIC_SPARK, count: 12, speed: 0.15}
  quicksilver:   # 수은 — 은빛 액체 방울이 흐르고 갈라짐
    tier: legendary
    particles:
      - {type: DUST, color: "#c8d0dc", size: 1.0, count: 2, radius: 0.7, height: 0.9, pattern: orbit}
      - {type: WAX_OFF, count: 1, radius: 0.5, height: 1.6, pattern: fall, chance: 0.4}
      - {type: END_ROD, count: 1, radius: 0.3, height: 0.3, pattern: rise, chance: 0.15, speed: 0.02}
    ring_model: quicksilver_ring
    ring_spin: -6.0
    ring_scale: 1.25
    ring_height: 0.05
    interval: 4
    swing: {type: WAX_OFF, count: 10, speed: 0.1}
  aurora:   # 극광 — 초록·분홍 빛의 띠가 일렁임
    tier: legendary
    particles:
      - {type: DUST_COLOR_TRANSITION, color: "#5affb0", color_to: "#ff8ad8", size: 1.1, count: 2, radius: 0.8, height: 0.2, pattern: spiral}
      - {type: END_ROD, count: 1, radius: 0.5, height: 0.4, pattern: rise, chance: 0.3, speed: 0.03}
      - {type: GLOW, count: 1, radius: 0.6, height: 1.6, pattern: orbit, chance: 0.3}
    ring_model: aurora_ring
    ring_spin: 2.0
    ring_scale: 1.25
    ring_height: 0.05
    interval: 4
    swing: {type: END_ROD, count: 10, speed: 0.1}
  venom:   # 맹독 — 똑똑 떨어지는 독, 가시 덩굴
    tier: legendary
    particles:
      - {type: DUST_COLOR_TRANSITION, color: "#4a9a2a", color_to: "#b0ff4a", size: 1.0, count: 2, radius: 0.6, height: 0.6, pattern: swirl}
      - {type: ITEM_SLIME, count: 1, radius: 0.4, height: 1.0, pattern: burst, chance: 0.2, speed: 0.02}
      - {type: DUST, color: "#8a3ab0", size: 0.8, count: 1, radius: 0.5, height: 1.5, pattern: fall, chance: 0.5}
    ring_model: venom_ring
    ring_spin: -5.0
    ring_scale: 1.25
    ring_height: 0.05
    interval: 4
    swing: {type: ITEM_SLIME, count: 8, speed: 0.08}

  # ═══════════════════════ 신화 (빨강 등급, 2겹 애니메이션 아우라) ═══════════════════════
  celestial:
    tier: mythic
    particles:
      - {type: END_ROD, count: 2, radius: 0.9, height: 1.2, pattern: orbit, speed: 0.0}
      - {type: DUST, color: "#7fb2ff", size: 1.1, count: 2, radius: 0.7, height: 0.3, pattern: spiral}
      - {type: FIREWORK, count: 1, radius: 0.5, height: 1.8, pattern: burst, chance: 0.08, speed: 0.02}
    ring_model: celestial_ring
    ring_spin: 3.0
    ring_scale: 1.4
    ring_height: 0.05
    secondary_model: celestial_ring_outer
    secondary_spin: -2.0
    secondary_mode: ring
    interval: 3
    swing: {type: END_ROD, count: 12, speed: 0.12}
  bloodmoon:
    tier: mythic
    particles:
      - {type: DUST, color: "#b01a3a", size: 1.3, count: 3, radius: 0.7, height: 0.6, pattern: swirl}
      - {type: CRIMSON_SPORE, count: 2, radius: 0.6, height: 1.0, pattern: rise}
      - {type: DRIPPING_LAVA, count: 1, radius: 0.3, height: 1.3, pattern: fall, chance: 0.3}
    ring_model: bloodmoon_ring
    ring_spin: 8.0
    ring_scale: 1.4
    ring_height: 0.05
    secondary_model: bloodmoon_ring_outer
    secondary_spin: -4.0
    secondary_mode: ring
    interval: 3
    swing: {type: DUST, color: "#ff3b3b", size: 1.5, count: 12, speed: 0.1}
  tempest:
    tier: mythic
    particles:
      - {type: ELECTRIC_SPARK, count: 3, radius: 0.7, height: 1.0, pattern: burst, speed: 0.05}
      - {type: SMALL_GUST, count: 1, radius: 0.9, height: 0.5, pattern: swirl, chance: 0.25}
      - {type: DUST, color: "#e0f0ff", size: 0.8, count: 2, radius: 0.8, height: 0.2, pattern: spiral}
    ring_model: tempest_ring
    ring_spin: 12.0
    ring_scale: 1.4
    ring_height: 0.05
    secondary_model: tempest_ring_outer
    secondary_spin: -9.0
    secondary_mode: ring
    interval: 3
    swing: {type: ELECTRIC_SPARK, count: 14, speed: 0.2}
  void:
    tier: mythic
    particles:
      - {type: REVERSE_PORTAL, count: 3, radius: 0.6, height: 0.8, pattern: swirl, speed: 0.02}
      - {type: PORTAL, count: 2, radius: 1.0, height: 1.0, pattern: orbit, speed: 0.4}
      - {type: DUST, color: "#2a0a4a", size: 1.4, count: 1, radius: 0.5, height: 0.2, pattern: spiral}
    ring_model: void_ring
    ring_spin: -6.0
    ring_scale: 1.4
    ring_height: 0.05
    secondary_model: void_ring_outer
    secondary_spin: 4.0
    secondary_mode: ring
    interval: 3
    swing: {type: REVERSE_PORTAL, count: 14, speed: 0.15}
  seraph:
    tier: mythic
    particles:
      - {type: END_ROD, count: 2, radius: 0.5, height: 0.2, pattern: rise, speed: 0.04}
      - {type: DUST, color: "#ffffff", size: 1.0, count: 2, radius: 0.6, height: 2.2, pattern: orbit}
      - {type: WAX_ON, count: 1, radius: 0.6, height: 1.4, pattern: burst, chance: 0.3}
    ring_model: seraph_ring
    ring_spin: 2.0
    ring_scale: 0.75
    ring_height: 2.25
    secondary_model: seraph_wings
    secondary_spin: 0.0
    secondary_mode: back
    interval: 3
    swing: {type: END_ROD, count: 12, speed: 0.1}
  eclipse:
    tier: mythic
    particles:
      - {type: DUST_COLOR_TRANSITION, color: "#ffd27a", color_to: "#05040a", size: 1.3, count: 3, radius: 0.8, height: 1.0, pattern: orbit}
      - {type: SMOKE, count: 1, radius: 0.4, height: 0.3, pattern: rise, speed: 0.02}
      - {type: SQUID_INK, count: 1, radius: 0.3, height: 1.2, pattern: burst, chance: 0.15, speed: 0.01}
    ring_model: eclipse_ring
    ring_spin: 4.0
    ring_scale: 1.4
    ring_height: 0.05
    secondary_model: eclipse_ring_outer
    secondary_spin: -6.0
    secondary_mode: ring
    interval: 3
    swing: {type: DUST_COLOR_TRANSITION, color: "#ffd27a", color_to: "#05040a", size: 1.5, count: 12, speed: 0.1}

models:

  # ═══════════════════════ 아우라 링 (전설 18 · 신화 6 + 신화 2번째 레이어 6) ═══════════════════════
  dawn_ring:        {style: ring, motif: sun_rays, palette: ["#5a3a10", "#c8902a", "#ffd27a", "#fff4d6"], animated: true, frames: 8, frametime: 2, size: [32, 1, 32], flat: true, glow: true}
  ember_ring:       {style: ring, motif: flames, palette: ["#2b0d05", "#7a2410", "#e0571d", "#ffc46b", "#fff4d6"], animated: true, frames: 8, frametime: 2, size: [32, 1, 32], flat: true, glow: true}
  gale_ring:        {style: ring, motif: wind_streaks, palette: ["#1e3a2e", "#4f9a7a", "#c8f0dc", "#ffffff"], animated: true, frames: 8, frametime: 1, size: [34, 1, 34], flat: true, glow: true}
  rime_ring:        {style: ring, motif: snowflakes, palette: ["#16283a", "#4a7ab0", "#bfe6ff", "#ffffff"], animated: true, frames: 8, frametime: 3, size: [32, 1, 32], flat: true, glow: true}
  sanctum_ring:     {style: ring, motif: halo_runes, palette: ["#6a5020", "#d9b25a", "#fff4d6", "#ffffff"], animated: true, frames: 8, frametime: 3, size: [20, 1, 20], flat: true, glow: true}
  nightshade_ring:  {style: ring, motif: thorns, palette: ["#05040a", "#1e1030", "#5a2a8a", "#b07cff"], animated: true, frames: 8, frametime: 2, size: [32, 1, 32], flat: true, glow: true}
  tide_ring:        {style: ring, motif: waves, palette: ["#0e2230", "#1e4a6a", "#5ab0d0", "#d8f8ff"], animated: true, frames: 8, frametime: 2, size: [34, 1, 34], flat: true, glow: true}
  prism_ring:       {style: ring, motif: crystal_facets, palette: ["#140c24", "#6a4ab8", "#fff2b0", "#ffffff"], animated: true, frames: 8, frametime: 2, size: [32, 1, 32], flat: true, glow: true}
  chrono_ring:      {style: ring, motif: clock_gears, palette: ["#3a2412", "#8a5a26", "#e8b060", "#7ae0c0"], animated: true, frames: 8, frametime: 4, size: [34, 1, 34], flat: true, glow: true}
  celestial_ring:         {style: ring, motif: constellation, palette: ["#0a1430", "#2a4a9a", "#7fb2ff", "#ffffff"], animated: true, frames: 16, frametime: 2, size: [36, 1, 36], flat: true, glow: true}
  celestial_ring_outer:   {style: ring, motif: star_dots, palette: ["#2a4a9a", "#7fb2ff", "#ffe9a8", "#ffffff"], animated: true, frames: 16, frametime: 2, size: [46, 1, 46], flat: true, glow: true}
  bloodmoon_ring:         {style: ring, motif: crescent, palette: ["#1a0006", "#5a0a18", "#b01a3a", "#ff6a6a"], animated: true, frames: 16, frametime: 2, size: [36, 1, 36], flat: true, glow: true}
  bloodmoon_ring_outer:   {style: ring, motif: blood_drops, palette: ["#3a0610", "#8a0a1a", "#ff3b3b", "#ffc0a0"], animated: true, frames: 16, frametime: 2, size: [46, 1, 46], flat: true, glow: true}
  tempest_ring:           {style: ring, motif: lightning, palette: ["#10183a", "#3a5ab0", "#a8d0ff", "#ffffff"], animated: true, frames: 16, frametime: 1, size: [36, 1, 36], flat: true, glow: true}
  tempest_ring_outer:     {style: ring, motif: wind_streaks, palette: ["#1a2a4a", "#5a7ab0", "#e0f0ff", "#ffffff"], animated: true, frames: 16, frametime: 1, size: [46, 1, 46], flat: true, glow: true}
  void_ring:              {style: ring, motif: void_rift, palette: ["#020104", "#1a0a2e", "#5a1a8a", "#c080ff"], animated: true, frames: 16, frametime: 2, size: [36, 1, 36], flat: true, glow: true}
