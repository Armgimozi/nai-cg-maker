# ─────────────────────────────────────────────────────────────────────────────
# recipes.yml — 대장장이 두르간 제작 (CraftingService + 대장장이 GUI)
#
# 스키마: ARCHITECTURE.md §6 recipes.yml (+ 추가 필드는 §6.2)
#  result     : items.yml id (레시피 id = 결과 id)
#  category   : weapon | armor | accessory | material  — 대장장이 GUI 탭
#  station    : blacksmith
#  materials  : {재료 id: 개수}  — 인벤토리에서 소모
#  gold       : 제작 골드 (명장의 부적 craft_discount 로 할인)
#  level_req  : 제작 가능 레벨
#  amount     : 결과 개수 (기본 1, 정수 정제용)
# 제작 결과 장비의 stats 는 드롭과 같은 [최소, 최대] 범위에서 굴린다. 재료 경제 설계 = GDD §11.11
