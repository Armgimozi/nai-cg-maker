# ─────────────────────────────────────────────────────────────────────────────
# recipes.yml — 대장장이 두르간 제작 (CraftingService + 대장장이 GUI)
#
# 스키마: ARCHITECTURE.md §6 recipes.yml (+ 추가 필드는 §6.2)
#  result     : items.yml id (레시피 id = 결과 id)
#  category   : weapon | armor | accessory | material | tool(0.3.6 곡괭이)  — GUI 탭
#  station    : blacksmith (대장간) | smelter (0.3.6 제련소·광산 관리소 — 제련·새기기·곡괭이)
#  materials  : {재료 id: 개수}  — 인벤토리에서 소모
#  gold       : 제작 골드 (명장의 부적 craft_discount 로 할인)
#  level_req  : 결과 장비의 숨은 아이템 레벨 (정렬·표시용 — 제작을 레벨로 막지 않는다)
#  amount     : 결과 개수 (기본 1, 정수 정제용)
# 제작 결과 장비의 stats 는 드롭과 같은 [최소, 최대] 범위에서 굴린다. 재료 경제 설계 = GDD §11.11
# 재료는 그 장비 단계 층(items.yml tier)의 몹 재료 · 정예 재료 · 보스 핵 · 그 층 등급 정수만 쓴다 (다른 층 재료 금지).
# 보스 핵은 그 보스 고유 장비 전용이다 — 1~4층 보스 장비는 핵 2개, 5층 이상 보스 장비는 핵 1개 + 재료. 정예 장비에는 핵을 쓰지 않는다.
# 레시피가 없는 장비: 1층 Lv1 공용 무기 · 몬스터·상자 전용 공용 무기(2·3·4·5·7층) · 영웅 이상 보스 고유 무기(2~10층, 보스만 — 핵은 보스 방어구·장신구·강화에)
#                   · 신화 · 넬카르의 심장 · 칭호 보상 · 수련생(시작 지급).  6·8·9·10층 공용 무기(영웅)는 대장간 전용 (몹·상자에서 안 나옴)
# 영웅·전설·신화 무기는 획득처가 1곳이다 — 여기 있는 영웅 무기는 드롭이 없고, 보스 고유 무기는 여기 없다.
