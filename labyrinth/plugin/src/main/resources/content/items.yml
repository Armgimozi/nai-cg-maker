# ─────────────────────────────────────────────────────────────────────────────
# items.yml — 아이템 전부 (자체 제작) + 방어구 세트 효과
#
# 스키마: ARCHITECTURE.md §6 items.yml (+ 추가 필드는 §6.2). 생략한 필드는 null / 기본값.
#  type        : weapon | armor | accessory | material | consumable | key
#  attack      : 무기만 {style, interval, kind} (0.3.5 — 무기 종류 없음, 무기마다 공격 방식)
#                style = melee(근접) | ranged(활 — 당겨 쏘기) | caster(시전)   interval = 기본 공격 간격(초, 민첩 전 · 활은 당김 + 0.15초)
#                kind = physical(힘이 키움) | magic(지능이 키움)   (선택) skill_power_mult = 스킬 위력 배율 (시전 기본 1.05)
#  armor_slot  : head | chest | legs | feet | offhand(방패 — 보조손)
#  look        : 세트 없는 투구의 겉모습 heavy(판금) | light(가죽) | cloth(천) | any(어느 겉모습이든 — 악몽의 왕관). 세트 방어구는
#                sets.<id>.look 을 쓰고, 방패는 언제나 판금 (적지 않는다). 겉모습마다 숨은 장단점 = config.yml armor_looks (0.3.5)
#  armor_set   : 장비 에셋 id(labyrinth:<set>). 투구는 플러그인이 assetId 를 넣지 않고 3D 모델을 머리에 씌운다
#  rarity      : common < uncommon < rare < epic < legendary < mythic (GDD §11.1)
#  level_req   : 장비(무기·방어구·방패·장신구) = 숨은 아이템 레벨 (그 층 레벨 구간 안) — 정렬·강화 골드·층 구간 계산에만 쓴다.
#                툴팁에 안 보이고 착용을 막지 않는다 (착용 조건은 아래 requires). 소모품 = 사용 레벨 (그대로 막는다)
#  tier        : 장비 단계(1~10, 숨김) = 그 장비를 만든 레벨 구간 Lv 5N−5 ~ 5N (0.3.5 — 화면에 층이 나오지 않는다).
#                보스가 아닌 장비는 레벨 창(단계 ±1)이 겹치는 이웃 층 셋이 나눠 준다 (loot.yml 단계 풀 band_tNN_*, 층 몫 2 : 7 : 1).
#                보스 고유 장비는 그 단계 층 보스만. 재료는 floor(그 층 재료) 그대로
#  requires    : 착용 요구 능력치 {STAT: n, ...} — 모두 채워야 한다 (requires_any '… 중 하나' 는 0.3.5 부터 쓰지 않음)
#                STAT = STR DEX INT VIT WIS LUK. 없거나 비우면 요구 없음. 무기·방어구·방패만 (장신구·재료·소모품은 없음)
#                내 능력치 = 직업 기본(classes.yml base_stats) + 분배한 포인트 + 장착 칭호 보너스 (장비 스탯은 세지 않는다)
#                무기 (0.3.5, tools/gen_035_content.py): 합 = ceil(2.75 × (level_req − 1)), 2 이하면 없음, 능력치 2~3개 '그리고' —
#                        60 : 40 또는 50 : 30 : 20 (세 개는 Lv12 부터). 물리 무기는 STR·DEX, 마법 무기는 INT·WIS 가 하나 이상
#                방어구·방패 (0.3.5, tools/gen_035_looks.py): 합 = ceil(2.75 × (level_req − 1)), 2 이하면 없음, 두 능력치 60 : 40 —
#                        앞 = 겉모습(판금·방패 VIT · 가죽 DEX · 천 INT 또는 WIS), 뒤 = 세트 정체성 (평상복·악몽의 왕관은 자유)
#  classes     : 직업 문장(key)만 — 장비에는 없다 (0.3.5). 드롭 편향은 요구 능력치로 (loot.yml own_build_bias)
#  stats       : 키 = GDD §11.7 닫힌 목록. 값 [최소, 최대] 를 드롭·제작 순간 굴려 PDC 에 저장
#                damage = 무기 한 방 피해(공격력의 기반 — 간격마다 온전히 들어감) · 백분율 키는 0~1 (0.05 = 5%)
#  set_bonus   : sets: 의 세트 id.   aura : fx.yml auras id (전설·신화 무기)
#  pool        : false 면 rarity_pool 이 뽑지 않음. 생략 = true. loot.yml 은 rarity_pool 을 쓰지 않으므로 장비는 전부 false (실수로 풀을 다시 써도 안전)
#  sources     : 획득처 (툴팁·도감 표시용, tools/gen_035_content.py 가 loot/recipes/titles/npcs/시작 지급에서 계산해 적음)
#                영웅·전설·신화 무기는 획득처 종류 1개 — 보스 고유 = 그 보스만 (제작법 없음) · 대장간 = 대장간만 (드롭 없음) ·
#                몬스터·상자 · 시련방 · 특별 시련 · 금고·미믹 · 정예 중 하나 (몬스터·상자 = drop+chest 한 종류)
#                drop·chest 몬스터·상자(mix_fNN_drop → 단계 풀 band_tNN_drop — 일반 몹·보물방·미로 상자) · elite 정예(band_tNN_elite) ·
#                boss 보스 고유 · trial 시련방(band_tNN_trial) · special 특별 시련(band_tNN_special) · hoard 금고·미믹(band_tNN_hoard)
#                craft 대장간 · reward 칭호 보상 · shop 상인 · starter 시작 지급(config starter_kit — 몹·상자·대장간에서 안 나옴)
#  use         : 소모품 효과 (action 닫힌 목록 = GDD §11.9)
#  weapon_skills : 일부 상위 무기의 무기 스킬. id = 구현 키(GDD §17 Weapon skill catalog 닫힌 목록, 공용 구현 재사용)
#                input = LEFT | RIGHT | SNEAK_LEFT | SNEAK_RIGHT (활은 RIGHT 가 바닐라 당기기라 금지 → SNEAK_LEFT · SNEAK_RIGHT(웅크리고 당겨 쏘기), 일부 신화 활만 LEFT)
#                pvp_mult = 플레이어에게 주는 피해 배율 (기본 1, 0.1~1.0 — 여러 번 맞히는 광역·큰 스킬만, tools/gen_035_pvp.py)
#                params.damage = 스킬 위력 배율 (스킬 위력 = 무기 초당 피해 기준, 0.3.5 — 무거운 무기가 스킬을 독차지하지 않음),
#                params.fx = fx.yml models 이름, params.damage_type = melee|ranged|magic (없으면 무기 attack.kind)
#  model       : 3D 템플릿 {shape, length} (GDD §14.1). 재료·소모품만 shape: icon (2D)
#  texture     : 생성기 지시 {style, palette(4~6색, 어두움→밝음), animated, frames, frametime, effect} (GDD §14.2)
#                전설·신화 무기는 animated: true (프레임 애니메이션 = GIF 처럼 움직임) + aura
# 수치 곡선(무기 피해·방어·부가 스탯)은 GDD §16.4 공식으로 맞췄다. 밸런스는 이 파일 숫자만 고치면 된다.
# ─────────────────────────────────────────────────────────────────────────────
