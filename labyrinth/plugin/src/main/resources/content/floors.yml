# ─────────────────────────────────────────────────────────────────────────────
# floors.yml — 미궁 지하 1~10층
#
# 스키마: ARCHITECTURE.md §6 floors.yml (+ 추가 필드는 §6 에 기록됨)
#  palette.*        : 실제 26.3 블록 Material 이름. 목록 안에서 가중치 없이 무작위(앞쪽일수록 자주: 생성기가 1/(i+1) 가중치 권장)
#  rooms            : 방 종류별 개수. 시작방·보스방은 항상 1개씩 자동 추가
#  mob_density      : 전투방 1개당 일반 몹 수 [최소, 최대] (파티 인원 배율 전, 솔로 기준)
#  mobs             : 전투방·엘리트방 호위·보물방 미믹·기믹방이 고르는 일반 몹 (목록에서 균등 무작위, 층마다 6종)
#  gimmick          : 기믹방 구현 키 (dungeon/rooms/, GDD.md "기믹방" 참고) + gimmick_params
#  ambient          : particle(Particle enum, 데이터 없는 입자만) / density(플레이어 1명 주변 초당 개수)
#                     sound(바닐라 사운드 키) / sound_interval([최소,최대] 초) / volume / pitch
#  decor            : 장식 블록 산포. where: floor | ceiling | wall | corner,  chance: 해당 면 블록당 확률
#  liquid           : 수로/용암 도랑에 쓸 액체 (WATER | LAVA | null). 통로 가장자리 1칸 도랑, 난간 필수
#  level_range      : 밸런스용 레벨 구간 [최소, 최대] — 플레이어에게는 보여 주지 않는다 (사용자 결정)
#  size.cells       : 미로 격자 한 변 셀 수 (셀 하나 24×24 블록). 깊은 층일수록 크다 (7 → 9)
#  maze             : 미로 복잡도 (GDD §5.4, 생략한 키는 기본값)
#                     dead_end_keep  막다른 길을 남기는 비율 (나머지는 고리로 잇거나 잘라 냄) — 끝에 상자·함정·비밀 통로
#                     loop_chance    닫힌 벽마다 고리(돌아가는 다른 길)로 뚫을 확률 (바로 옆 칸끼리의 작은 고리는 제외)
#                     branch         신장 트리가 아무 칸에서나 가지를 칠 확률 (0 = 긴 구불길, 1 = 짧은 가지투성이)
#                     braid          잘라 낼 막다른 길을 대신 이웃과 이어 고리로 만들 확률
#                     twist          복도 셀이 꺾인 복도·좁은 통로·광장·계단·기둥 숲이 될 확률
#                     secret_ratio / secret_max   남은 막다른 길 중 금 간 벽 비밀 통로가 될 비율 / 최대 개수
#                     min_path       주 경로(시작→보스 최단) 최소 길이 = 격자 한 변 × 이 값 (기본 2.2, 모자라면 다시 생성)
#  palette.secret   : 비밀 통로 금 간 벽 블록 (그 층 벽과 살짝 달라야 함), palette.stairs: 계단 복도 계단 블록
#  traps            : 미로 함정 (GDD §5.5) — density 복도 셀 하나당 함정 수, types 이 층 함정 종류(닫힌 목록:
#                     spike arrow_wall flame_jet falling_rock poison_gas pitfall alarm_rune current ice_slide crystal_beam
#                     ink_burst saw_blade void_rift), mark 함정 칸 바닥에 까는 '살짝 다른' 블록(눈치 빠르면 보임), spacing 함정 간 최소 거리(기본 7)
#  chests           : 미로 보물 상자 (GDD §5.6) — dead_end/minor 막다른 길(미로 굴 안) 상자 확률, iron/gold 등급 확률,
#                     gold_behind_trap 앞 복도에 함정이 있으면 금 상자로, mimic 미믹 확률, vault 열쇠 금고(기본 true),
#                     key_from_elite 열쇠가 정예 처치에서 나올 확률(나머지는 막다른 길 철 상자),
#                     bracket 루팅 표 — 0 = 층별 표(maze_chest_<등급>_f<층>) 우선, 없으면 구간 표(1~3·4~6·7~9·10층) · 1~4 = 그 구간 표 강제
#  special_trial    : (선택) 특별 시련 조건 덮어쓰기 (GDD §10.1, 확률·조건 수치는 dungeon.yml special_trial) — 생략하면 기믹마다 기본표
#                     conditions 후보 [swift, unscathed, abstain, flawless] 중 시드로 하나 (빈 목록 또는 enabled: false = 이 층 끔),
#                     seconds 서두름 초. flawless 는 lever_sequence·resonance_tune·book_cipher·gear_timing 만,
#                     swift 는 torch_relay·void_trial 제외, unscathed 는 spore_purge 제외.  예: special_trial: {conditions: [flawless, swift], seconds: 60}
# 모든 블록 배치는 labyrinth_world 의 인스턴스 슬롯 안에서만 이루어진다.
# ─────────────────────────────────────────────────────────────────────────────
