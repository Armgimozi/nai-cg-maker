# 미궁 라비린스 서버 설정 (마인크래프트 자바 에디션 26.3 / Paper)
# 수정한 뒤에는 서버를 껐다 켜야 적용됩니다.
motd=\u00a75\u00a7l\ubbf8\uad81 \ub77c\ube44\ub9b0\uc2a4 \u00a77\uc9c0\ud558 10\uce35\uc758 \ud30c\ud2f0 \ub358\uc804
# 미궁 입구 마을 "등불 어귀" 가 미리 지어진 월드(이 폴더의 world). level-seed 는 그 월드를 만든 시드라서
# 마을 밖으로 멀리 나가도 같은 지형이 자연스럽게 이어집니다. (world 폴더를 지우면 마을 없는 새 월드가 생깁니다)
# 미궁은 플러그인이 만드는 별도 공허 월드(labyrinth_world)에 지어집니다.
level-name=world
level-seed=24680
level-type=minecraft\:normal
generate-structures=true
# 정품 계정만 접속 (친구도 정품이어야 함)
online-mode=true
server-port=25565
max-players=10
difficulty=normal
gamemode=survival
# PvP: 같은 파티원끼리는 서로 못 때리고, 그 밖의 플레이어끼리는 어디서든 싸울 수 있습니다.
# 실제 스위치는 plugins/Labyrinth/config.yml 의 pvp.enabled 입니다 (플러그인이 켤 때 모든 월드의 PvP 규칙을 그 값으로 맞춤).
pvp=true
# 스폰 보호를 끄면 관리자가 아닌 친구도 스폰 근처 입구·NPC 를 쓸 수 있습니다
spawn-protection=0
view-distance=8
simulation-distance=8
# 돌진·도약 스킬이 몸을 띄우기 때문에 켜 둡니다 (끄면 '비행' 으로 오해받아 튕길 수 있음)
allow-flight=true
enable-command-block=false
enforce-secure-profile=false
white-list=false
enforce-whitelist=false
# 리소스팩은 플러그인이 8163 포트로 직접 보냅니다 (plugins/Labyrinth/config.yml 의 pack:). 여기는 비워 둡니다.
resource-pack=
require-resource-pack=false
