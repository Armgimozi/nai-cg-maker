# 미궁 라비린스 서버 설정 (마인크래프트 자바 에디션 26.3 / Paper)
# 수정한 뒤에는 서버를 껐다 켜야 적용됩니다.
motd=\u00a7d\u00a7l\u2694 \ubbf8\uad81 \ub77c\ube44\ub9b0\uc2a4 \u2694 \u00a78| \u00a7b\uc9c0\ud558 10\uce35\uc758 \ud30c\ud2f0 \ub358\uc804
# 평범한 기본 월드. 미궁은 플러그인이 만드는 별도 공허 월드(labyrinth_world)에 지어지므로 이 월드의 지형은 건드리지 않습니다.
level-name=world
level-type=minecraft\:normal
# 정품 계정만 접속 (친구도 정품이어야 함)
online-mode=true
server-port=25565
max-players=10
difficulty=normal
gamemode=survival
# 오늘 판은 협동 미궁이라 PvP 를 끕니다. (파티 대 파티 대전은 다음 업데이트에서 전용 투기장으로 들어옵니다)
pvp=false
# 스폰 보호를 끄면 관리자가 아닌 친구도 스폰 근처 입구·NPC 를 쓸 수 있습니다
spawn-protection=0
view-distance=8
simulation-distance=8
# 돌진·도약 스킬이 몸을 띄우기 때문에 켜 둡니다 (끄면 '비행' 으로 오해받아 튕길 수 있음)
allow-flight=true
enable-command-block=false
enforce-secure-profile=false
white-list=false
enforce-whitelist=false
# 리소스팩은 플러그인이 8163 포트로 직접 보냅니다 (plugins/Labyrinth/config.yml 의 pack:). 여기는 비워 둡니다.
resource-pack=
require-resource-pack=false
