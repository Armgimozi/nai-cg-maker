<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  블록수선전 UI 그림. tools/render_art.mjs 가 id 붙은 요소를 하나씩 투명 PNG 로 찍는다.
  data-slice="좌,위,우,아래" 는 Roblox SliceCenter(픽셀) — 업로드 뒤 Art.luau 에 함께 기록된다.
-->
<style>
  :root {
    --lacquer-1: #222738;
    --lacquer-2: #12141d;
    --gold: #c9a45c;
    --gold-hi: #f3dda4;
    --gold-lo: #7a5c2b;
    --jade: #5fb39a;
    --jade-hi: #cdf2e2;
    --jade-lo: #1f5a4a;
    --cream: #f6ecd2;
  }
  body { margin: 0; background: transparent; }
  .asset { display: block; margin: 0; }
  svg { display: block; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 금속 금테 -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a8"/>
      <stop offset="0.45" stop-color="#c9a45c"/>
      <stop offset="0.55" stop-color="#a8823d"/>
      <stop offset="1" stop-color="#e6c983"/>
    </linearGradient>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b3e"/>
      <stop offset="1" stop-color="#11131c"/>
    </linearGradient>
    <radialGradient id="jadeDisc" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#d4f5e6"/>
      <stop offset="0.25" stop-color="#7fcbb1"/>
      <stop offset="0.7" stop-color="#3d8f77"/>
      <stop offset="1" stop-color="#1c5444"/>
    </radialGradient>
    <radialGradient id="stoneDisc" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#8d8a84"/>
      <stop offset="0.5" stop-color="#55524e"/>
      <stop offset="1" stop-color="#2c2a28"/>
    </radialGradient>
    <radialGradient id="goldDisc" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.35" stop-color="#e2bd6a"/>
      <stop offset="0.8" stop-color="#9c7534"/>
      <stop offset="1" stop-color="#5e4319"/>
    </radialGradient>
    <radialGradient id="haloGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ffe7a6" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#ffe7a6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe7a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jadeBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff0dc"/>
      <stop offset="0.35" stop-color="#6cc3a6"/>
      <stop offset="1" stop-color="#25705b"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c0"/>
      <stop offset="0.35" stop-color="#e0b964"/>
      <stop offset="1" stop-color="#8a6528"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07080c"/>
      <stop offset="1" stop-color="#1b1e2a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="brush" x="-5%" y="-30%" width="110%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.09" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <!-- 상운(祥雲) 한 송이: 큰 말림 + 작은 말림 + 꼬리 -->
    <g id="cloud">
      <path d="M2 30 C2 16 12 6 25 6 C37 6 45 15 45 25 C45 33 39 38 32 38 C26 38 22 34 22 29 C22 25 25 22 29 22 C32 22 34 24 34 27"
            fill="none" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M45 25 C49 17 57 13 64 15 C71 17 74 24 71 30 C69 34 64 35 61 32 C59 30 60 27 62 26"
            fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M2 30 C2 40 10 46 20 46 L58 46" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<!-- 1. 칠기 판 (9-slice) -->
<svg class="asset" id="panel" data-slice="80,80,176,176" width="256" height="256" viewBox="0 0 256 256">
  <rect x="3" y="3" width="250" height="250" rx="20" fill="url(#lacquer)" fill-opacity="0.94"/>
  <rect x="3" y="3" width="250" height="250" rx="20" fill="none" stroke="#5c4420" stroke-width="3"/>
  <rect x="6.5" y="6.5" width="243" height="243" rx="17" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="15" y="15" width="226" height="226" rx="10" fill="none" stroke="#c9a45c" stroke-opacity="0.45" stroke-width="1"/>
  <g transform="translate(13 13) scale(0.82)"><use href="#cloud"/></g>
  <g transform="translate(243 13) scale(-0.82 0.82)"><use href="#cloud"/></g>
  <g transform="translate(13 243) scale(0.82 -0.82)"><use href="#cloud"/></g>
  <g transform="translate(243 243) scale(-0.82 -0.82)"><use href="#cloud"/></g>
</svg>

<!-- 2. 경지 현판: 가운데는 늘어나고 양 끝은 여의두 모양 -->
<svg class="asset" id="plaque" data-slice="120,44,392,68" width="512" height="112" viewBox="0 0 512 112">
  <path d="M70 18 H442 C455 18 462 10 474 10 C492 10 504 26 504 42 C504 50 498 56 492 56 C498 56 504 62 504 70 C504 86 492 102 474 102 C462 102 455 94 442 94 H70 C57 94 50 102 38 102 C20 102 8 86 8 70 C8 62 14 56 20 56 C14 56 8 50 8 42 C8 26 20 10 38 10 C50 10 57 18 70 18 Z"
        fill="url(#lacquer)" fill-opacity="0.95" stroke="#5c4420" stroke-width="3"/>
  <path d="M70 18 H442 C455 18 462 10 474 10 C492 10 504 26 504 42 C504 50 498 56 492 56 C498 56 504 62 504 70 C504 86 492 102 474 102 C462 102 455 94 442 94 H70 C57 94 50 102 38 102 C20 102 8 86 8 70 C8 62 14 56 20 56 C14 56 8 50 8 42 C8 26 20 10 38 10 C50 10 57 18 70 18 Z"
        fill="none" stroke="url(#gold)" stroke-width="2"/>
  <path d="M76 26 H436 M76 86 H436" stroke="#c9a45c" stroke-opacity="0.45" stroke-width="1"/>
  <g transform="translate(22 30) scale(0.55)"><use href="#cloud"/></g>
  <g transform="translate(490 30) scale(-0.55 0.55)"><use href="#cloud"/></g>
  <circle cx="474" cy="56" r="4" fill="url(#gold)"/>
  <circle cx="38" cy="56" r="4" fill="url(#gold)"/>
</svg>

<!-- 3. 게이지 홈 / 채움 (가로 9-slice) -->
<svg class="asset" id="barTrack" data-slice="16,13,240,15" width="256" height="28" viewBox="0 0 256 28">
  <rect x="1.5" y="1.5" width="253" height="25" rx="8" fill="url(#track)" stroke="#6b5126" stroke-width="2"/>
  <rect x="4" y="4" width="248" height="2" rx="1" fill="#000" fill-opacity="0.5"/>
</svg>
<svg class="asset" id="barJade" data-slice="10,9,246,11" width="256" height="20" viewBox="0 0 256 20">
  <rect x="0" y="0" width="256" height="20" rx="6" fill="url(#jadeBar)"/>
  <path d="M0 13 C30 8 50 16 80 11 S130 6 160 12 S220 16 256 10" fill="none" stroke="#e6fff4" stroke-opacity="0.35" stroke-width="2"/>

</svg>
<svg class="asset" id="barGold" data-slice="10,9,246,11" width="256" height="20" viewBox="0 0 256 20">
  <rect x="0" y="0" width="256" height="20" rx="6" fill="url(#goldBar)"/>
  <path d="M0 13 C30 8 50 16 80 11 S130 6 160 12 S220 16 256 10" fill="none" stroke="#fff8dc" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="3" y="2" width="250" height="3" rx="1.5" fill="#fff" fill-opacity="0.4"/>
</svg>

<!-- 4. 둥근 옥 버튼 -->
<svg class="asset" id="orbJade" width="256" height="256" viewBox="0 0 256 256">
  <circle cx="128" cy="132" r="118" fill="#000" fill-opacity="0.35"/>
  <circle cx="128" cy="128" r="118" fill="url(#gold)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#4d3816" stroke-width="3"/>
  <circle cx="128" cy="128" r="104" fill="#3a2a10"/>
  <circle cx="128" cy="128" r="101" fill="url(#jadeDisc)"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="#174536" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="128" cy="128" r="80" fill="none" stroke="#d9fff0" stroke-opacity="0.25" stroke-width="1.5"/>
  <ellipse cx="104" cy="78" rx="52" ry="24" fill="#fff" fill-opacity="0.18" transform="rotate(-24 104 78)"/>
  <g fill="#f6e2a8" stroke="#5c4420" stroke-width="1.5">
    <circle cx="128" cy="17" r="5"/><circle cx="239" cy="128" r="5"/><circle cx="128" cy="239" r="5"/><circle cx="17" cy="128" r="5"/>
  </g>
</svg>
<svg class="asset" id="orbStone" width="256" height="256" viewBox="0 0 256 256">
  <circle cx="128" cy="132" r="118" fill="#000" fill-opacity="0.35"/>
  <circle cx="128" cy="128" r="118" fill="#6e6a62"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#2a2825" stroke-width="3"/>
  <circle cx="128" cy="128" r="104" fill="#262420"/>
  <circle cx="128" cy="128" r="101" fill="url(#stoneDisc)"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="#1a1917" stroke-opacity="0.6" stroke-width="2"/>
  <ellipse cx="104" cy="78" rx="52" ry="24" fill="#fff" fill-opacity="0.08" transform="rotate(-24 104 78)"/>
  <g fill="#9a958c" stroke="#2a2825" stroke-width="1.5">
    <circle cx="128" cy="17" r="5"/><circle cx="239" cy="128" r="5"/><circle cx="128" cy="239" r="5"/><circle cx="17" cy="128" r="5"/>
  </g>
</svg>
<svg class="asset" id="orbGold" width="256" height="256" viewBox="0 0 256 256">
  <circle cx="128" cy="132" r="118" fill="#000" fill-opacity="0.35"/>
  <circle cx="128" cy="128" r="118" fill="url(#gold)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#4d3816" stroke-width="3"/>
  <circle cx="128" cy="128" r="104" fill="#3a2a10"/>
  <circle cx="128" cy="128" r="101" fill="url(#goldDisc)"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="#5e4319" stroke-opacity="0.55" stroke-width="2"/>
  <ellipse cx="104" cy="78" rx="52" ry="24" fill="#fff" fill-opacity="0.22" transform="rotate(-24 104 78)"/>
  <g fill="#fff4cf" stroke="#5c4420" stroke-width="1.5">
    <circle cx="128" cy="17" r="5"/><circle cx="239" cy="128" r="5"/><circle cx="128" cy="239" r="5"/><circle cx="17" cy="128" r="5"/>
  </g>
</svg>
<svg class="asset" id="halo" width="256" height="256" viewBox="0 0 256 256">
  <circle cx="128" cy="128" r="128" fill="url(#haloGrad)"/>
</svg>

<!-- 6. 구분선과 장식 -->
<svg class="asset" id="divider" width="512" height="32" viewBox="0 0 512 32">
  <defs>
    <linearGradient id="fadeLine" x1="0" x2="1">
      <stop offset="0" stop-color="#c9a45c" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#c9a45c"/>
      <stop offset="0.7" stop-color="#c9a45c"/>
      <stop offset="1" stop-color="#c9a45c" stop-opacity="0"/>

  </defs>
  <path d="M20 16 H216 M296 16 H492" stroke="url(#fadeLine)" stroke-width="1.6"/>

  <g transform="translate(290 2) scale(-0.42 0.42)"><use href="#cloud"/></g>
  <circle cx="256" cy="16" r="3.5" fill="url(#gold)"/>
</svg>
<svg class="asset" id="gem" width="32" height="32" viewBox="0 0 32 32">
  <path d="M16 2 L28 16 L16 30 L4 16 Z" fill="url(#jadeDisc)" stroke="#e6c983" stroke-width="2"/>
</svg>

<!-- 7. 버튼 알약 (9-slice) -->
<svg class="asset" id="pillJade" data-slice="22,22,138,34" width="160" height="56" viewBox="0 0 160 56">

  <rect x="4.5" y="4.5" width="151" height="47" rx="12" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
</svg>
<svg class="asset" id="pillStone" data-slice="22,22,138,34" width="160" height="56" viewBox="0 0 160 56">
  <rect x="2" y="2" width="156" height="52" rx="14" fill="#3a3834" stroke="#22201d" stroke-width="3"/>
  <rect x="4.5" y="4.5" width="151" height="47" rx="12" fill="none" stroke="#6e6a62" stroke-width="1.4"/>

<!-- 9. 상태창 뒤 먹안개 -->

<!-- 10. 닫기 -->
<svg class="asset" id="iconClose" width="64" height="64" viewBox="0 0 64 64">

</body>
